id: f3-20260917-1801
frente: front-3
cycle_id: 2026-09-17T18
tema_objeto: "Integradores tiempo-temperatura pasivos como memoria material acumulativa de exposición térmica"
afirmacion_principal: "Una reacción química, fisicoquímica o biológica con cinética dependiente de temperatura puede actuar como memoria material sin electrónica: integra el historial tiempo-temperatura y lo transforma en un cambio irreversible visible. La lectura del cambio es observación directa del estado del indicador; inferir deterioro o calidad del objeto acompañado exige emparejar y validar las cinéticas de ambos."
funcion: registrar
principio_de_mediacion: "Cinética acumulativa dependiente de temperatura (aproximable por Arrhenius) que transforma exposición térmica integrada en cambio cromático irreversible."
variable_fisica_entrada: "historial de temperatura a lo largo del tiempo"
señal_o_estado_salida: "estado cromático irreversible / absorbancia del indicador"
modalidad: "química-pasiva / colorimétrica / memoria acumulativa"
invasividad: minima
requiere_contacto: no
requiere_electronica: no
requiere_computacion_digital: no
resolucion_o_precision: "No es un termómetro instantáneo ni entrega una resolución térmica universal. En el sistema fructosa-glicina se modeló absorbancia a 420 nm frente a tiempo y temperatura; la sensibilidad térmica fue ajustable mediante formulación, con energías de activación de 58.09–95.54 kJ/mol."
latencia: "Intrínsecamente acumulativa y dependiente de formulación y temperatura; no corresponde a respuesta instantánea."
condiciones_de_prueba: "TTI no enzimático fructosa-glicina ensayado en cuatro concentraciones de sustrato y pH 8.0–10.0. Como evidencia independiente de la necesidad de emparejamiento cinético, un TTI microbiano fue probado a distintas temperaturas y niveles iniciales de inóculo."
