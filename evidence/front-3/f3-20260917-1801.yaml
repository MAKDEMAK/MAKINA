nivel_evidencia: A
datos_cuantitativos:
  - "Fructosa-glicina: Ea ajustable entre 58.09 y 95.54 kJ/mol mediante pH y proporción de reactivos."
  - "TTI microbiano: endpoint visual pasó de 27 días a 0 °C a 2.5 días a 16 °C; Ea del indicador 97.7 kJ/mol frente a 103.2 kJ/mol para crecimiento de L. sakei en el sustrato."
  - "En el TTI microbiano a 8 °C, variar el inóculo de 10^1 a 10^6 CFU/ml desplazó el endpoint aproximadamente de 6 a 2 días."
  - "Sistema de ácido gálico: Ea ajustable de 17.57 kJ/mol a pH 8.0 a 70.36 kJ/mol a pH 6.0; modelo de calidad de leche Ea 51.68 kJ/mol, emparejado con formulación pH 6.5."
mecanismo_o_principio: "HECHO DOCUMENTADO: la velocidad de cambio del indicador aumenta con temperatura y puede parametrizarse cinéticamente; el estado resultante conserva el efecto acumulado del historial térmico. HECHO DOCUMENTADO: modificar formulación/pH permite desplazar la energía de activación y, por tanto, la sensibilidad térmica. INTERPRETACIÓN: el valor general para observabilidad es usar una transformación material irreversible como memoria analógica acumulativa, no como sensor instantáneo."
limitaciones:
  - "El estado del indicador no identifica de manera única la trayectoria temperatura-tiempo que lo produjo; historiales distintos pueden converger a respuestas similares."
  - "No mide directamente calidad, deterioro ni carga microbiana del objeto acompañado: esas variables son inferencias que requieren correspondencia cinética y validación específica."
  - "La formulación, pH, concentración e inicialización alteran fuertemente el endpoint y la sensibilidad."
  - "La lectura visual es cualitativa; cuantificación por absorbancia exige instrumentación óptica."
contradicciones:
  - "No se encontró contradicción con el principio de integración; las fuentes sí muestran que 'indicar calidad' no es una propiedad universal del TTI sino una relación calibrada con el proceso objetivo."
