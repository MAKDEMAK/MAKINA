nivel_evidencia: A
datos_cuantitativos:
  correlacion_rail: ">0.988"
  frecuencia_excitacion_rail: "120 Hz"
  banda_ruido_rail: "20-200 Hz"
mecanismo_o_principio: "acoplamiento magnetoelastico + saltos de paredes de Bloch inducidos por magnetizacion alterna"
limitaciones:
  - "La amplitud MBN responde tanto a tension como a microestructura; no identifica tension de forma univoca sin calibracion."
  - "Cambios modestos de tamano de grano entre lote de calibracion y muestra produjeron errores significativos."
  - "La direccion de carga/sensor importa; en el ensayo de rail la orientacion perpendicular apenas cambio con el aumento de carga."
  - "Requiere material ferromagnetico y acceso superficial para excitacion/lectura."
contradicciones:
  - "Un estudio comparativo observo diferencias significativas MBN-XRD cuando la microestructura de calibracion no coincidia; tras considerar tamano de grano mejoro la concordancia."
