id: f3-20260917-1401
frente: front-3
cycle_id: 2026-09-17T14
tema_objeto: ruido_magnetico_barkhausen_para_tension_residual
afirmacion_principal: "La excitacion magnetica superficial y la lectura del ruido de Barkhausen permiten hacer observable de forma no destructiva el estado de tension en aceros ferromagneticos; la senal es directa respecto de la dinamica de paredes de dominio, mientras convertirla a tension cuantitativa es inferencia calibrada y sensible a microestructura."
funcion: medir
principio_de_mediacion: "Un campo magnetico alterno desplaza paredes de dominio de Bloch de forma discontinua; una bobina capta los pulsos electromagneticos. La tension mecanica modifica esa dinamica magnetoelastica y por tanto la intensidad/estadistica de la senal MBN."
variable_fisica_entrada: "tension aplicada o residual y microestructura ferromagnetica superficial"
senal_o_estado_salida: "intensidad/parametros de ruido magnetico Barkhausen; tension estimada tras calibracion"
modalidad: magnetica
invasividad: nula
requiere_contacto: si
requiere_electronica: si
requiere_computacion_digital: opcional
resolucion_o_precision: "En ensayo sobre rail 50 kgN, correlacion tension-senal >0.988; no se generaliza como precision absoluta."
latencia: "medicion rapida; valor temporal absoluto no reportado en las fuentes consultadas"
condiciones_de_prueba: "Rail 50 kgN: seleccion de excitacion 120 Hz y banda 20-200 Hz; ensayos de traccion y rail usado. Estudios adicionales: aceros carburizados, soldados y muestras con microestructura controlada."
