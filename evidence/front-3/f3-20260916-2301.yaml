mecanismo_o_principio: "El efecto magnetostrictivo acopla estado mecanico y respuesta magnetica. La deformacion modifica la frecuencia resonante del elemento; una bobina externa excita e interroga esa resonancia. La geometria tipo reloj de arena reduce el esfuerzo de conexion y aumenta la sensibilidad."
limitaciones:
  - "Requiere fijar fisicamente el resonador a la estructura, por lo que no es observacion estrictamente no-contacto del objeto."
  - "La lectura necesita instrumentacion externa de excitacion y captacion magnetica."
  - "La sensibilidad depende de geometria, montaje y acoplamiento mecanico."
  - "El estudio demuestra deformacion controlada; no establece por si solo robustez universal frente a temperatura, campos parasitos o envejecimiento del montaje."
contradicciones:
  - "La pasividad corresponde al elemento sensor, no al sistema completo de interrogacion."
  - "Mayor sensibilidad geometrica no equivale automaticamente a mayor exactitud en condiciones de campo."
