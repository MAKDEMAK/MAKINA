tema_objeto: sensado remoto pasivo de deformacion mediante resonancia magnetoelastica
afirmacion_principal:
  hecho: "Una lamina magnetoelastica adherida a una estructura puede convertir deformacion mecanica en un desplazamiento de su frecuencia resonante, interrogable remotamente mediante campo magnetico, sin bateria ni conexion electrica al sensor."
  hipotesis: "La geometria del resonador puede concentrar la respuesta mecanica y elevar la sensibilidad sin agregar electronica local."
  interpretacion: "Es un principio general de mediacion para volver observable deformacion de una estructura existente dejando en ella solo un elemento pasivo."
funcion: medir
principio_de_mediacion: "deformacion -> cambio de esfuerzo/permeabilidad magnetoelastica -> cambio de frecuencia resonante -> lectura magnetica remota"
variable_fisica_entrada: deformacion mecanica
señal_o_estado_salida: frecuencia resonante magnetoelastica
modalidad: magnetica/resonante
invasividad: minima
requiere_contacto: si
requiere_electronica: no
requiere_computacion_digital: no
resolucion_o_precision: "sensibilidad maxima experimental reportada: 37100 Hz/strain"
latencia: desconocida
condiciones_de_prueba: "Sensor magnetoelastico con geometria de reloj de arena y cinta estrecha central; fabricado y ensayado experimentalmente; frecuencia medida de forma remota mediante excitacion/deteccion magnetica."
