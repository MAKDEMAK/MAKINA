id: f3-20260916-1701
frente: front-3
cycle_id: '2026-09-16T17'
tema_objeto: cupon testigo de fatiga acumulativa para estructuras soldadas
afirmacion_principal: >-
  Un cupon metalico delgado precargado y fijado junto a una union soldada puede convertir
  el historial real de esfuerzos ciclicos de la estructura en crecimiento irreversible de
  una grieta testigo; la longitud de esa grieta representa daño acumulativo de fatiga y
  permite estimar fraccion de vida de diseno consumida sin reconstruir digitalmente todo
  el historial de cargas.
funcion: registrar
principio_de_mediacion: >-
  Concentracion de tensiones y propagacion de una pregrieta por fatiga en un cupon cuya
  respuesta S-N se ajusta a la clase de detalle soldado objetivo. Pistas conductoras
  secuenciales atravesadas por la grieta discretizan posteriormente su longitud para lectura.
variable_fisica_entrada: historial local de esfuerzo ciclico transferido desde la estructura
señal_o_estado_salida: longitud irreversible de grieta testigo; secundariamente numero de pistas conductoras seccionadas
modalidad: mecanica_fractura_con_lectura_electrica
invasividad: minima
requiere_contacto: si
requiere_electronica: opcional
requiere_computacion_digital: no
resolucion_o_precision: >-
  El prototipo CrackFirst usa 12 pistas conductoras a cada lado de la ranura central;
  la primera pista se secciono tipicamente alrededor de 10-20% de la vida total del sensor
  y las siguientes de forma aproximadamente regular. No equivale a una precision universal
  en porcentaje de vida.
latencia: acumulativa; determinada por crecimiento de grieta bajo ciclos de carga
condiciones_de_prueba: >-
  Cupon de acero de 0.25 mm de espesor, 20 mm de ancho y 51 mm de largo, precargado
  aproximadamente a 120 MPa y montado junto a uniones soldadas de acero. Ensayos axiales
  de amplitud constante y variable; en evaluacion 2007 se ensayaron 10 sensores sobre
  probetas con uniones soldadas, R=0.1. Validacion anterior cubrio vidas de 1e5 a 5e6 ciclos
  y R=0.1 y -1, ademas de amplitud variable.
