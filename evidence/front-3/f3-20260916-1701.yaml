    fecha: desconocida
nivel_evidencia: A
datos_cuantitativos:
  - 'geometria del cupon evaluado: 0.25 x 20 x 51 mm'
  - '12 pistas conductoras por cada lado de la pregrieta'
  - 'precarga de instalacion aproximada: 120 MPa'
  - 'ensayos de desarrollo: aproximadamente 1e5 a 5e6 ciclos'
  - 'carga variable en desarrollo: endurance sensor/endurance soldadura 0.44-0.84'
  - 'evaluacion posterior: todos los sensores alcanzaron su indicacion final antes que las uniones ensayadas'
mecanismo_o_principio: >-
  El propio daño por fatiga funciona como integrador fisico del historial de carga. En vez
  de medir cada ciclo y aplicar despues una regla de acumulacion, un testigo calibrado
  experimenta el mismo historial y conserva fisicamente su efecto acumulado como grieta.
limitaciones:
  - requiere transferencia representativa del esfuerzo mediante ubicacion, orientacion, fijacion y precarga correctas
  - responde al esfuerzo medio sobre su longitud activa y es inadecuado para gradientes muy pronunciados o componentes muy pequenos
  - la correspondencia depende de emparejar el cupon con la clase de fatiga de la union objetivo
  - el modo de carga importa; mayor componente de flexion produjo vidas del sensor ligeramente mayores
  - la lectura electrica, memoria y descarga de datos requieren electronica, aunque el registro mecanico acumulativo no
contradicciones:
  - >-
    No es una medicion directa del dano microscopico de la union objetivo: es un objeto testigo
    sometido a un historial que se busca hacer representativo.
  - >-
    Bajo secuencias variables, ni la soldadura ni el sensor siguieron exactamente la regla de Miner;
    el trabajo reporto desviaciones y pidio validar secuencias capaces de producir predicciones inseguras.
  - >-
    La documentacion institucional indica que el sistema llego a licenciarse; por tanto no debe
    describirse como mera prueba de laboratorio.
etiquetas_neutrales:
