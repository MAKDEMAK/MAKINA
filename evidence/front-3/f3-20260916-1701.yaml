  - minimally_invasive
  - passive_recording
  - proxy_measurement
medicion_directa_o_inferencia: inferencia_indirecta
hecho: >-
  Ensayos de laboratorio documentados muestran crecimiento secuencial de la grieta/pistas y
  advertencia conservadora respecto de las uniones probadas; TWI documenta ademas licencia comercial.
hipotesis: >-
  Un testigo correctamente calibrado puede aproximar el consumo de vida de la clase de detalle
  objetivo bajo historiales de servicio compatibles con su validacion.
interpretacion: >-
  Es un principio reusable de mediacion porque traslada la integracion temporal desde un logger
  y un modelo numerico hacia un proceso fisico irreversible que conserva localmente el historial acumulado.
