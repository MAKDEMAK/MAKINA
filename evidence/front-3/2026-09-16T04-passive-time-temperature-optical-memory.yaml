id: f3-20260916T04-passive-tti
frente: front-3
cycle_id: 2026-09-16T04
tema_objeto: registro pasivo irreversible de historia tiempo-temperatura mediante color estructural
afirmacion_principal:
  HECHO: Un recubrimiento polimerico CLC supramolecular registra acumulativamente exposicion termica como desplazamiento irreversible de longitud de onda, sin electronica ni computacion; a 60 C cambio ~80 nm en 10 h, a 40 C ~70 nm en 46 h y a 20 C ~20 nm en 480 h.
  INTERPRETACION: Es un integrador fisico de historia termica, no un termometro instantaneo: el estado optico codifica una combinacion de tiempo y temperatura mediante cinetica del material.
  HIPOTESIS: La inversion cuantitativa de una historia termica arbitraria no queda demostrada; diferentes trayectorias pueden producir estados finales ambiguos.
funcion: registrar
principio_de_mediacion: cinetica termicamente activada de desenrollamiento helicoidal -> cambio irreversible de paso CLC -> corrimiento de color estructural
variable_fisica_entrada: historia de temperatura y duracion de exposicion
señal_o_estado_salida: longitud de onda/color reflejado persistente
modalidad: optica pasiva / material responsivo
invasividad: minima
requiere_contacto: no
requiere_electronica: no
requiere_computacion_digital: no
resolucion_o_precision: respuesta espectral cuantificada; no se reporta una precision universal de reconstruccion de temperatura
latencia: dependiente de temperatura; segundos sobre T_NI para perdida de color y horas-dias por debajo para integracion gradual
condiciones_de_prueba: recubrimiento CLC impreso sobre BOPET; T_NI del ejemplo ~68 C; espectros UV-vis bajo exposicion isotermica a 20, 40 y 60 C
