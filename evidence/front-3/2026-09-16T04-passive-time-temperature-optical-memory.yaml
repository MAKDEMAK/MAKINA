  escritura_umbral: "5 s a 80 C demostro impresion; por encima de T_NI ocurre perdida irreversible rapida de color"
mecanismo_o_principio: Los enlaces de hidrogeno dinamicos y el confinamiento de polimerizacion permiten que la helice CLC se desenrolle gradualmente; el paso helicoidal determina la longitud de onda reflejada. La cinetica sigue una respuesta modelable con constante de velocidad y comportamiento tipo Arrhenius.
limitaciones:
  - integra tiempo y temperatura y por tanto no identifica necesariamente una trayectoria termica unica
  - respuesta cinetica fuertemente dependiente de composicion y temperatura
  - por encima de T_NI la perdida de orden/color cambia el regimen desde integracion gradual a indicador de umbral
  - requiere lectura visual o espectral posterior; cuantificacion precisa exige instrumentacion/calibracion
contradicciones:
  - no es medicion directa de temperatura instantanea aunque el color sea sensible a exposicion termica
  - la afirmacion de evaluacion precisa de vida util es una posibilidad propuesta; el paper demuestra la respuesta del material, no validacion universal contra degradacion de productos
