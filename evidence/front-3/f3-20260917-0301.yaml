tema_objeto: memoria mecanica pasiva para registrar indices de dano
afirmacion_principal: Un sensor basado en pandeo elastico y extension plastica de un alambre puede memorizar mecanicamente el valor pico de deformacion o desplazamiento sin alimentacion durante la medicion.
funcion: registrar
principio_de_mediacion: El evento mecanico produce pandeo elastico y una extension plastica residual; la longitud retenida codifica el maximo historico y puede leerse por resistencia, inductancia o capacitancia.
variable_fisica_entrada: deformacion o desplazamiento mecanico
senal_o_estado_salida: elongacion residual mecanica y cambio electrico opcional para lectura
modalidad: mecanica_pasiva
invasividad: minima
requiere_contacto: si
requiere_electronica: opcional
requiere_computacion_digital: no
resolucion_o_precision: no cuantificada en la fuente accesible
latencia: registro ligado al evento y lectura posterior
condiciones_de_prueba: estudios teoricos y experimentales para estructuras con control de dano
fuentes:
  - url: https://doi.org/10.1088/0964-1726/12/2/307
    titulo: A smart sensor using a mechanical memory for structural health monitoring of a damage-controlled building
    tipo: paper revisado por pares
    fecha: 2003-04
