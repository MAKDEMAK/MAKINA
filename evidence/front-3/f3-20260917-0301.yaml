    tipo: registro institucional de publicacion
    fecha: desconocida
nivel_evidencia: A
datos_cuantitativos: []
mecanismo_o_principio: memoria fisica irreversible por deformacion plastica inducida mediante pandeo de alambre fino
limitaciones:
  - La memoria basica conserva un indice extremo, no una serie temporal ni el instante del evento.
  - La lectura electrica o inalambrica requiere instrumentacion al recuperar el dato, aunque el registro no requiere alimentacion.
  - La relacion entre elongacion residual e indice de dano requiere calibracion.
contradicciones:
  - No es completamente libre de electronica cuando se desea lectura remota; lo pasivo es el registro.
HECHO: El mecanismo de memoria de pico fue construido y estudiado experimentalmente.
HIPOTESIS: El principio puede generalizarse a otros indices de dano si existe una transformacion mecanica monotona y calibrable hacia deformacion residual.
INTERPRETACION: El propio elemento fisico funciona simultaneamente como detector y memoria historica, evitando adquisicion continua.
