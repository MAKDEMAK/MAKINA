id: f3-20260917-1501
frente: front-3
cycle_id: 2026-09-17T15
tema_objeto: "Emisión acústica como proxy de desgaste y mecanismo de desgaste durante mecanizado"
afirmacion_principal: "Un sensor de emisión acústica acoplado a la máquina puede hacer observable indirectamente el desgaste de una herramienta no instrumentada: eventos micromecánicos de fricción, deformación, abrasión y fractura generan ondas elásticas de alta frecuencia cuya distribución tiempo-frecuencia cambia con el mecanismo y estado de desgaste."
funcion: diagnosticar
principio_de_mediacion: "Transducción piezoeléctrica de ondas elásticas espontáneas generadas por procesos micromecánicos; análisis STFT separa componentes espectrales asociadas a mecanismos distintos."
variable_fisica_entrada: "Ondas elásticas/acústicas de alta frecuencia producidas durante corte, fricción, deformación, desgaste y fractura."
señal_o_estado_salida: "Señal eléctrica AE y espectrograma tiempo-frecuencia; identificación indirecta de mecanismos/estado de desgaste."
modalidad: "emisión acústica / vibración ultrasónica"
invasividad: minima
requiere_contacto: si
requiere_electronica: si
requiere_computacion_digital: si
resolucion_o_precision: "El estudio 2024 no entrega una precisión universal de desgaste; demuestra separación espectral de mecanismos. Un trabajo independiente de estimación AE+SVR en mecanizado ultrasónico reportó 96.13% frente a 84.89% usando sólo parámetros de proceso, pero no es directamente transferible entre procesos."
latencia: "Compatible con análisis durante el mecanizado; no se documentó en las fuentes consultadas una latencia end-to-end generalizable."
condiciones_de_prueba: "Torneado de acero AISI 4340 con herramientas de carburo sin recubrimiento, AlCrN y AlCrN nanoestructurado; velocidades 150-250 m/min, avances 0.10-0.20 mm/rev y profundidades 0.25/0.75 mm en la línea experimental documentada."
