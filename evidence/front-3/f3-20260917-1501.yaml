    titulo: "Machine learning coupled with acoustic emission signal features for tool wear estimation during ultrasonic machining of Inconel 718"
    tipo: "paper experimental"
    fecha: "2024"
nivel_evidencia: A
datos_cuantitativos:
  - "En el ensayo AISI 4340, un caso al fin de vida mostró pico AE de 253 kHz a 0.75 s (250 m/min, 0.25 mm/rev, 0.75 mm, herramienta K sin recubrimiento)."
  - "El artículo 2024 resume abrasión predominantemente en 200-230 kHz y adhesión en 15-115 kHz; propagación de grietas se sitúa en la literatura empleada en 350-550 kHz."
  - "La tesis institucional ensayó 150, 200 y 250 m/min; avances 0.10, 0.15 y 0.20 mm/rev; profundidades 0.25 y 0.75 mm, y encontró mayor sensibilidad al desgaste en condiciones bajas y medias."
  - "Estudio independiente AE+SVR sobre Inconel 718: 96.13% de precisión reportada frente a 84.89% con sólo parámetros de proceso."
mecanismo_o_principio: "MEDICIÓN DIRECTA: el transductor mide ondas elásticas AE presentes físicamente en la estructura. INFERENCIA INDIRECTA: atribuir bandas/amplitudes a desgaste, mecanismo específico, vida restante o fallo de herramienta depende del proceso, material, herramienta, posición del sensor y procesamiento."
limitaciones:
  - "No existe una banda espectral universal que equivalga directamente a una cantidad de desgaste; la respuesta depende del proceso y condiciones de corte."
  - "La AE contiene contribuciones simultáneas de deformación/fractura de pieza, formación de viruta, fricción y herramienta; STFT ayuda a separarlas pero no elimina ambigüedad física."
  - "Sensores AE pueden ser sensibles a ruido ambiental; revisiones recientes favorecen fusión multisensor cuando se requiere clasificación robusta."
  - "Requiere contacto/acoplamiento mecánico del transductor con una ruta de propagación adecuada, electrónica de adquisición de alta frecuencia y procesamiento."
contradicciones:
  - "La literatura presenta AE como relativamente inmune a vibraciones mecánicas de baja frecuencia por operar en bandas superiores, pero también documenta susceptibilidad a ruido ambiental; por tanto 'robusto al ruido' depende del espectro y montaje, no es una propiedad absoluta."
etiquetas_neutrales: [acoustic-emission, tool-wear, machining, proxy-signal, condition-monitoring, piezoelectric, stft, indirect-inference]
