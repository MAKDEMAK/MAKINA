mecanismo_o_principio:
  medicion_directa: "La elongacion/deformacion mecanica causa directamente la decoloracion del sensor."
  inferencia_indirecta: "Convertir hue/decoloracion a deformacion numerica o ancho de grieta requiere calibracion y analisis; no equivale a medir directamente la separacion geometrica de las caras de la grieta."
limitaciones:
  - "La cuantificacion pierde fiabilidad con propagacion y geometria irregular de grieta."
  - "Hubo decoloracion fuera del area de grieta en un especimen."
  - "Condicion de fabricacion del sensor afecta los resultados."
  - "Las zonas cubiertas por adhesivo no deforman/decoloran como la zona libre."
  - "La respuesta a baja temperatura queda temporalmente alterada y debe recuperarse."
  - "La lectura visual cualitativa no requiere electronica, pero cuantificacion reproducible mediante HSV requiere camara/procesamiento."
contradicciones:
  - "El articulo describe mediciones de ancho de grieta como precisas en algunos casos, pero sus propios datos muestran errores grandes para varias grietas mayores y excluyen un especimen por decoloracion espuria; por tanto no se generaliza precision alta."
etiquetas_neutrales: [mecanocromismo, sensor_pasivo, deformacion, grieta, color, concreto, sin_alimentacion, medicion_directa, inferencia_indirecta]
