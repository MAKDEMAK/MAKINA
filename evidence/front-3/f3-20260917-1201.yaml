id: f3-20260917-1201
frente: front-3
cycle_id: 2026-09-17T12
tema_objeto: sensor mecano-cromico pasivo adherido para hacer visible deformacion y apertura de grietas
afirmacion_principal: "Una lamina mecano-cromica adherida por sus extremos puede transducir elongacion superficial en un cambio de color visible sin alimentacion; el evento fisico de deformacion se observa directamente, mientras estimar ancho de grieta desde el color es una inferencia calibrada y sensible a geometria y fabricacion."
funcion: medir
principio_de_mediacion: "La deformacion modifica la estructura/condicion de resonancia optica del sensor y por ello su color; el componente hue H del espacio HSV cambia aproximadamente de forma lineal con la deformacion en las condiciones ensayadas."
variable_fisica_entrada: deformacion longitudinal superficial / apertura local de grieta
señal_o_estado_salida: cambio de color visible; hue HSV para lectura cuantitativa
modalidad: optica_mecanocromica_pasiva
invasividad: minima
requiere_contacto: si
requiere_electronica: no
requiere_computacion_digital: opcional
resolucion_o_precision: "Se detecto deformacion de concreto hasta 0.01 mm. En viga, ejemplos escala→imagen: 0.050→0.043 mm y 0.300→0.272 mm; a grietas mayores aparecieron errores importantes (1.400→0.558 mm; 4.000→1.517 mm)."
latencia: "respuesta visual durante deformacion; no se reporta una latencia temporal instrumental. Tras freeze-thaw, la capacidad de decoloracion se recupero en ~2 h al retornar hacia ~15 °C."
condiciones_de_prueba: "Ensayos de traccion sobre concreto con sensor pegado mediante Loctite SF 770/406; analisis de video/color HSV; ensayo freeze-thaw segun ASTM C666/C666M-15; ensayo en miembro de viga con grietas diagonales."
fuentes:
