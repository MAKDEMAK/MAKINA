tema_objeto: sensado inalámbrico pasivo de vibración mediante transducción piezoeléctrica SAW
afirmacion_principal:
  HECHO: Un resonador SAW sobre LiNbO3 puede convertir directamente vibración mecánica en potencial eléctrico y devolver la señal por acoplamiento inductivo sin alimentación aplicada al sensor; en prueba sobre viga en voladizo recuperó correctamente una resonancia de 43 Hz y formas de onda/espectros concordantes con vibrometría láser Doppler.
  INTERPRETACION: El principio permite hacer observable vibración de una estructura mediante un elemento adherido sin batería ni electrónica activa local durante la medición pasiva.
  HIPOTESIS: Su utilidad fuera de la geometría y distancias ensayadas requiere validación específica.
funcion: medir
principio_de_mediacion: vibración mecánica -> potencial piezoeléctrico en sustrato LiNbO3 -> señal electromagnética recuperada por acoplamiento inductivo
variable_fisica_entrada: vibración mecánica local
señal_o_estado_salida: forma de onda eléctrica inalámbrica y espectro de frecuencia
modalidad: piezoeléctrica + inductiva/inalámbrica
invasividad: minima
requiere_contacto: si
requiere_electronica: opcional
requiere_computacion_digital: no
resolucion_o_precision: No se reporta incertidumbre metrológica en el texto principal; frecuencia resonante de 43 Hz correctamente recuperada frente a LDV.
latencia: tiempo real en prueba; no cuantificada
condiciones_de_prueba: sensor SAW adherido a viga en voladizo; comparación simultánea con laser Doppler vibrometer; resonador ~39 MHz; electrodos IDT de 25.5 um; ensayos de vibración a 35 y 43 Hz.
