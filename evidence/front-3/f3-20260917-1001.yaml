mecanismo_o_principio: El sustrato piezoeléctrico genera potencial dinámico entre grupos de electrodos IDT al vibrar. Esa energía se acopla desde la bobina receptora del sensor a una bobina lectora; no se inyecta potencia durante el modo pasivo de vibración. Es medición directa de vibración/frecuencia; atribuir causa, daño o estado de máquina desde esa vibración sería inferencia indirecta.
limitaciones:
  - La amplitud/SNR disminuye al aumentar la separación entre bobinas.
  - El sensor debe estar mecánicamente acoplado a la estructura.
  - La demostración pasiva es proof-of-concept sobre una viga; no establece robustez industrial.
  - El lector externo sí requiere instrumentación (bobina y osciloscopio en el experimento).
  - No se publica incertidumbre, resolución mínima de amplitud ni distancia máxima fiable en el texto principal consultado.
contradicciones:
  - 'power-free passive' describe el elemento sensor durante vibración, no un sistema end-to-end sin energía ni electrónica.
  - Las funciones de strain/temperatura/agua del mismo dispositivo usan modo activo; sólo la medición de vibración fue demostrada sin potencia de entrada.
