tema_objeto: medicion magnetica no intrusiva de corriente
afirmacion_principal: Un arreglo externo de sensores magneticos permite estimar corrientes individuales de varios conductores encerrados sin abrir el conduit; eventos de cambio de carga ayudan a identificar conexiones y posiciones para construir la transformacion de lectura magnetica a corriente.
funcion: medir
principio_de_mediacion: campo magnetico de corriente -> arreglo magnetico -> estimacion geometrica -> matriz de transimpedancia -> corriente
variable_fisica_entrada: campo magnetico de conductores AC encerrados
señal_o_estado_salida: corrientes individuales estimadas
modalidad: magnetica
invasividad: nula
requiere_contacto: no
requiere_electronica: si
requiere_computacion_digital: si
resolucion_o_precision: no cuantificada en las fuentes abiertas consultadas
latencia: tiempo real reportado; sin cifra numerica abierta
