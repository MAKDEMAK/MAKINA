nivel_evidencia: A
datos_cuantitativos:
  rango_frecuencia_hz: "2-10000"
  error_medio_frecuencia: "~0.42%"
mecanismo_o_principio: "La geometria elastica ajusta la respuesta mecanica; la triboelectricidad transduce el movimiento sin fuente electrica del sensor. La frecuencia se obtiene de la periodicidad de la señal mediante procesamiento tiempo-frecuencia/FFT."
limitaciones:
  - "La medicion cuantitativa publicada se centra principalmente en frecuencia; no equivale a medir de forma universal amplitud, aceleracion o severidad de falla."
  - "La respuesta depende de estructura, montaje, resonancias y acoplamiento mecanico; requiere calibracion/contexto para inferir estado de una maquina."
  - "El elemento sensor es autoalimentado, pero adquisicion, filtrado, FFT, almacenamiento o transmision pueden requerir electronica/computacion externa."
contradicciones:
  - "Autoalimentado describe la transduccion; no demuestra por si solo una cadena completa de monitorizacion sin energia externa."
  - "Rango amplio en excitador de laboratorio no demuestra igual precision bajo espectros industriales variables o montaje no controlado."
etiquetas_neutrales: [vibracion, triboelectricidad, TENG, autoalimentado, condition-monitoring, transduccion, proxy]
