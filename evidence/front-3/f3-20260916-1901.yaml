id: f3-20260916-1901
frente: front-3
cycle_id: 2026-09-16T19
tema_objeto: sensado triboelectrico autoalimentado de vibracion de maquinaria
afirmacion_principal: "HECHO: una estructura triboelectrica de acero elastico convierte vibracion mecanica directamente en una senal electrica cuya frecuencia permite medir vibraciones entre 2 y 10000 Hz sin alimentacion externa, con error medio reportado de ~0.42%. INTERPRETACION: es un principio de mediacion reutilizable para hacer observable maquinaria existente mediante energia extraida del propio fenomeno medido, pero la inferencia de fallas requiere procesamiento posterior."
funcion: medir
principio_de_mediacion: "movimiento relativo inducido por vibracion -> contacto/separacion triboelectrica -> carga/voltaje alternante; transformacion tiempo-frecuencia y filtrado recuperan la frecuencia mecanica"
variable_fisica_entrada: vibracion mecanica
señal_o_estado_salida: señal electrica triboelectrica periodica y frecuencia estimada
modalidad: vibracion/triboelectrica
invasividad: minima
requiere_contacto: si
requiere_electronica: opcional
requiere_computacion_digital: opcional
resolucion_o_precision: "rango 2-10000 Hz; error medio ~0.42% reportado para frecuencia"
latencia: desconocido
condiciones_de_prueba: "excitacion mecanica controlada; estructura ES-TENG optimizada para ampliar respuesta a frecuencias medias/altas; validacion de laboratorio"
fuentes:
  - url: https://www.mdpi.com/2079-4991/12/16/2790
    titulo: Ultra-Wide Range Vibration Frequency Detection Sensors Based on Elastic Steel Triboelectric Nanogenerators for Intelligent Machinery Monitoring
    tipo: paper experimental
    fecha: 2022-08-15
  - url: https://onlinelibrary.wiley.com/doi/full/10.1002/idm2.70004
