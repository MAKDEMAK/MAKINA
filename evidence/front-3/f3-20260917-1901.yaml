    fecha: "2026-04"
nivel_evidencia: A
datos_cuantitativos:
  - "Hale & Brown: errores reportados ~10–15% en campos de contacto relativamente suaves."
  - "Evaluación de 1980: rango estudiado 8–450 kg/cm²; precisión indicada 2.0 kg/cm² en película de baja presión, 8.0 kg/cm² intermedia y 20.0 kg/cm² alta."
  - "En esa evaluación, una misma carga de 44 kg/cm² produjo densidad 0.94 a 22.0 °C/50% RH y 1.35 a 23.5 °C/83% RH, evidenciando sensibilidad ambiental."
  - "SAE 850186: cuantificación con densitómetro reportada con exactitud ±2%."
  - "Documentación Fujifilm 2026: variantes disponibles cubren aproximadamente 0.006–300 MPa."
mecanismo_o_principio: "La presión rompe selectivamente microcápsulas cuya población está diseñada con umbrales de ruptura; el colorante liberado reacciona con una capa reveladora. La densidad de cápsulas activadas produce una imagen espacial que funciona simultáneamente como transductor y memoria física del evento. Observación directa: huella de ruptura/color en el film. Medición de presión: inferencia calibrada desde densidad óptica. Inferir fuerza total, calidad de contacto o condición del artefacto es un nivel adicional de inferencia."
limitaciones:
  - "Es consumible/de un solo evento; no entrega serie temporal ni orden de múltiples cargas superpuestas."
  - "Temperatura y humedad alteran sensibilidad y exigen condiciones o curvas de calibración apropiadas."
  - "La densidad óptica cambia después de la exposición; el tiempo entre carga y lectura debe controlarse."
  - "El film introduce espesor/compliance en la interfaz y puede modificar el contacto que pretende medir, especialmente en geometrías sensibles, rugosas o de alta curvatura."
  - "Gradientes fuertes y discontinuidades locales dificultan la reconstrucción cuantitativa aunque el patrón cualitativo siga siendo observable."
  - "Lectura visual elimina electrónica pero reduce precisión; densitometría/imaging puede mejorar cuantificación a costa de instrumentación."
contradicciones:
  - "La precisión no es una propiedad universal: se encuentran ~10–15% en experimentos biomecánicos, ±10% en especificaciones técnicas y ±2% con densitometría reportada en SAE; dependen de procedimiento, calibración y campo de presión."
  - "Aunque el registro químico es permanente a escala práctica, estudios muestran evolución/fading de densidad después de la carga; 'permanente' no equivale a valor óptico temporalmente invariante."
