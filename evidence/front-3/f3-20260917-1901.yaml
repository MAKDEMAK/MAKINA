id: f3-20260917-1901
frente: front-3
cycle_id: 2026-09-17T19
tema_objeto: "película microencapsulada como memoria espacial pasiva de presión de contacto"
afirmacion_principal: "Una película delgada con microcápsulas de ruptura calibrada puede insertarse temporalmente entre superficies de un artefacto existente y convertir la presión de contacto en una huella cromática irreversible que conserva distribución y magnitud aproximada sin electrónica; la cuantificación absoluta requiere calibración y es sensible al ambiente y al propio espesor del film."
funcion: registrar
principio_de_mediacion: "ruptura mecánica dependiente de presión de microcápsulas, liberación de colorante y reacción/fijación química; densidad óptica espacial como registro de la carga"
variable_fisica_entrada: "presión normal de contacto distribuida sobre una superficie"
señal_o_estado_salida: "mapa cromático permanente; densidad óptica local correlacionada con presión"
modalidad: "mecano-química / colorimétrica / memoria material pasiva"
invasividad: minima
requiere_contacto: si
requiere_electronica: no
requiere_computacion_digital: no
resolucion_o_precision: "En campos de contacto relativamente suaves, literatura experimental reporta errores aproximadamente 10–15%; documentación técnica reporta ±10% por densitometría bajo condiciones especificadas. Un paper SAE de 1985 reportó ±2% usando densitómetro. La resolución/precisión efectiva empeora con gradientes, geometría, rugosidad y condiciones ambientales."
latencia: "respuesta esencialmente inmediata al aplicar presión para lectura cualitativa; la densidad óptica puede evolucionar después de la carga, por lo que la lectura cuantitativa debe hacerse en una ventana temporal controlada"
condiciones_de_prueba: "Hale y Brown (1992): distribuciones estandarizadas generadas comprimiendo película entre cilindros rígidos de siete radios distintos y una capa elástica sobre sustrato rígido, comparando gradientes detectados con predicción analítica. Fujifilm especifica exactitud bajo 23 °C y 65% RH. Estudios históricos muestran dependencia fuerte de humedad y evolución temporal de la mancha."
