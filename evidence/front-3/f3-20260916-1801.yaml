id: f3-20260916-1801
frente: front-3
cycle_id: 2026-09-16T18
tema_objeto: memoria térmica pasiva por antifusible polimérico irreversible
afirmacion_principal: >-
  HECHO: un compuesto termorresponsivo de negro de acetileno y una mezcla de PEG de dos pesos moleculares cambia irreversiblemente de alta a baja resistencia al superar aproximadamente 60 °C, convirtiendo una excursión térmica en un bit físico no volátil. Integrado a una etiqueta RFID con entrada de tamper, el estado puede leerse digitalmente sin batería en el sensor.
funcion: registrar
principio_de_mediacion: >-
  Una transición térmica reorganiza la red conductora de partículas de negro de acetileno dentro de la matriz PEG y forma una red de percolación persistente; al enfriar, la baja resistencia no revierte, por lo que el propio material enclava el hecho de haber cruzado el umbral.
variable_fisica_entrada: temperatura máxima / cruce de umbral térmico
señal_o_estado_salida: estado resistivo irreversible HR->LR, legible como 1 bit por RFID
modalidad: termo-resistiva + RFID pasivo
invasividad: minima
requiere_contacto: si
requiere_electronica: opcional
requiere_computacion_digital: no
resolucion_o_precision: >-
  No es un termómetro continuo: registra un evento binario alrededor del umbral diseñado (~60 °C en la composición óptima reportada). La fuente primaria consultada no proporciona una incertidumbre metrológica única del umbral que justifique declarar precisión en °C.
latencia: >-
  Dependiente de temperatura, cinética térmica y geometría; no se reduce a una latencia única en la evidencia consultada.
condiciones_de_prueba: >-
  Compuestos AB/PEG caracterizados eléctricamente durante calentamiento; la composición destacada usa mezcla PEG1450:PEG10k 80:20 con 2.5 wt.% de negro de acetileno. Se reportan ensayos prolongados a 40, 50 y 60 °C, ciclos repetidos a 60 °C y ciclos de temperatura creciente de 30 a 60 °C, sobre vidrio ITO y/o PCB según ensayo; también se integró el antifusible con una etiqueta RFID pasiva con detección de tamper.
