tema_objeto: desagregacion no intrusiva de cargas desde alimentacion electrica agregada
afirmacion_principal:
  hecho: "NILM permite inferir estados y consumo de aparatos individuales usando solo señales agregadas de voltaje/corriente/potencia medidas en el punto de entrada, sin instrumentar cada aparato."
  hipotesis: null
  interpretacion: "La alimentación común puede funcionar como canal proxy para volver observables múltiples artefactos existentes con un único punto de medición."
funcion: inferir
principio_de_mediacion: "detectar cambios o estados característicos en la señal eléctrica agregada y desagregarlos mediante firmas eléctricas/modelos temporales"
variable_fisica_entrada: "voltaje, corriente y/o potencia eléctrica agregada"
senal_o_estado_salida: "identidad/estado operativo y estimación de potencia por carga"
modalidad: electrica
invasividad: minima
requiere_contacto: si
requiere_electronica: si
requiere_computacion_digital: si
resolucion_o_precision: "dependiente del método; revisión 2026 reporta un sistema SVM embebido con 91% de exactitud y métodos recientes >0.9 F1 para ciertos aparatos/datasets"
latencia: "dependiente del muestreo/modelo; existen implementaciones de tiempo real"
condiciones_de_prueba: "hogares, edificios e instalaciones industriales; rendimiento sensible a frecuencia de muestreo, simultaneidad de eventos, cargas desconocidas y transferencia entre sitios"
fuentes:
