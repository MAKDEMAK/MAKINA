    tipo: "paper técnico"
    fecha: "1985-06-30"
nivel_evidencia: A
datos_cuantitativos:
  - "error de medición <3% para 4–20 kN"
  - "relación aproximadamente lineal CTOF–precarga entre 0 y 20 kN"
  - "frecuencia central longitudinal medida: 17.14 MHz"
  - "señal conservada tras ensayo a 320 °C durante 1 h"
mecanismo_o_principio: "Medición directa: el instrumento mide tiempo de propagación acústica dentro del propio perno. Inferencia indirecta: la fuerza de precarga no se observa directamente; se estima desde CTOF mediante el modelo/calibración acustoelástica y la longitud efectivamente tensionada. El principio es reutilizable porque convierte una pieza estructural no diseñada para telemetría en su propio camino de medición."
limitaciones:
  - "Requiere acceso físico al menos a una cabeza/extremo y acoplamiento acústico reproducible, salvo sensores integrados."
  - "La conversión TOF→fuerza depende de material, geometría, longitud efectiva tensionada y coeficientes acustoelásticos."
  - "Cambios de temperatura también modifican dimensiones y velocidad acústica; métodos mono-onda requieren compensación o referencia térmica, mientras combinaciones longitudinal/transversal pueden reducir esa dependencia."
  - "Roscas, posición del transductor, ancho de banda y regiones no uniformemente tensionadas afectan la propagación y calibración."
  - "La precisión <3% citada corresponde a un montaje experimental con película piezoeléctrica integrada y no debe generalizarse automáticamente a un transductor temporal sobre cualquier perno."
contradicciones:
  - "Algunas fuentes describen la precarga como medida 'directamente' por ultrasonido; metrológicamente aquí se separa la medición directa de TOF de la inferencia calibrada de fuerza."
  - "El sensor integrado mejora repetibilidad frente a cambios de posición/capa de acoplante, pero aumenta invasividad de fabricación; el principio clásico con sonda externa es retrofit mínimo pero más sensible al acoplamiento."
