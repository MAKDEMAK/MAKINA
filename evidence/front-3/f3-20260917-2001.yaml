id: f3-20260917-2001
frente: front-3
cycle_id: 2026-09-17T20
tema_objeto: "Precarga axial en uniones atornilladas existentes mediante tiempo de vuelo ultrasónico"
afirmacion_principal: "La precarga de un perno puede hacerse observable sin desmontar la unión midiendo el cambio del tiempo de vuelo de pulsos ultrasónicos a lo largo del perno; la carga altera simultáneamente su longitud efectiva y la velocidad acústica por efecto acustoelástico."
funcion: medir
principio_de_mediacion: "Pulso-eco ultrasónico y efecto acustoelástico: la tensión axial modifica la longitud de propagación y la velocidad del sonido; el cambio de TOF respecto del estado de referencia se calibra contra carga axial."
variable_fisica_entrada: "tensión/deformación axial producida por la precarga del perno"
señal_o_estado_salida: "cambio de tiempo de vuelo ultrasónico (CTOF), convertible por calibración a fuerza de precarga"
modalidad: "ultrasonido; pulso-eco; acustoelasticidad"
invasividad: minima
requiere_contacto: si
requiere_electronica: si
requiere_computacion_digital: opcional
resolucion_o_precision: "En pernos M8 de superaleación de níquel con sensor piezoeléctrico de película delgada de alta frecuencia se reportó error inferior a 3% entre 4 y 20 kN."
latencia: "No cuantificada como latencia operacional en las fuentes revisadas; la magnitud primaria se obtiene del tiempo de vuelo de cada interrogación pulso-eco."
condiciones_de_prueba: "Perno M8 de superaleación de níquel; película piezoeléctrica integrada, espectro longitudinal centrado en 17.14 MHz; carga 0–20 kN. Se verificó señal ultrasónica a 320 °C durante 1 h. Literatura histórica documenta el mismo principio con transductor aplicado al extremo/cabeza del perno para control de pretensión."
fuentes:
