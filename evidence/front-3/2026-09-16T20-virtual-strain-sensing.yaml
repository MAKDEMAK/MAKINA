id: f3-20260916-2001
frente: front-3
cycle_id: 2026-09-16T20
tema_objeto: sensado virtual de deformacion en puntos no instrumentados
afirmacion_principal: "HECHO: deformacion y fatiga en zonas fisicamente no instrumentadas pueden inferirse desde un numero reducido de galgas accesibles mediante observadores basados en modelo; en un prototipo de bancada de prensa, LSSE y SSKF reprodujeron deformacion con RRMSE <15% y localizaron correctamente el inicio de grieta. HIPOTESIS: la transferencia a maquinaria legacy requiere que el modelo estructural y las condiciones de carga sigan representando adecuadamente al sistema real. INTERPRETACION: es un principio general de observabilidad espacial: sensores en puntos accesibles pueden actuar como proxies de estados mecanicos en puntos inaccesibles."
funcion: inferir
principio_de_mediacion: "Reconstruccion de deformacion no medida mediante relaciones modales/estructurales entre un conjunto reducido de mediciones accesibles y estados en puntos remotos; LSSE usa estimacion por minimos cuadrados y SSKF incorpora correccion estocastica."
variable_fisica_entrada: "deformacion medida en galgas accesibles; opcionalmente fuerza aplicada segun algoritmo"
señal_o_estado_salida: "deformacion virtual y tension Hot Spot en puntos no instrumentados; estimacion indirecta de daño e inicio de grieta"
modalidad: mecanica/deformacion + estimacion basada en modelo
invasividad: minima
requiere_contacto: si
requiere_electronica: si
requiere_computacion_digital: si
resolucion_o_precision: "LSSE: RRMSE 6.8% (gauge 2-REF) y 13.3% (gauge 6-REF); SSKF: 7.0% y 13.4%."
latencia: "no caracterizada como tiempo real; ensayo cuasi-estatico"
condiciones_de_prueba: "Prototipo soldado de acero S-275 de 127 kg; carga sinusoidal 15-150 kN a 3 Hz; cuatro galgas de entrada accesibles; modelo FEM de 2.14 millones de elementos; ensayo hasta 1,150,000 ciclos."
