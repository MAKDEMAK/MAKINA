    titulo: "Strain Virtual Sensing Applied to Industrial Presses for Fatigue Monitoring"
    tipo: repositorio institucional de texto completo
    fecha: 2024-05-23
nivel_evidencia: A
datos_cuantitativos:
  - "LSSE RRMSE: 6.8% y 13.3% en dos puntos de referencia."
  - "SSKF RRMSE: 7.0% y 13.4%."
  - "LSSE predijo inicio en B-1 a 300,305 ciclos; SSKF a 301,090."
  - "El experimento situo el inicio de grieta en B-1 entre 300,000 y 400,000 ciclos; FEM habia estimado 370,000."
  - "DSO produjo 258,000 ciclos y no pudo distinguir cual de los cuatro puntos criticos fallaria."
mecanismo_o_principio: "observabilidad estructural/model-based virtual sensing: inferir estados mecanicos espacialmente remotos a partir de mediciones parciales y un modelo que relaciona grados de libertad."
limitaciones:
  - "Validado en estructura escalada y cargas estaticas/cuasi-estaticas; no demuestra igual precision bajo dinamica compleja."
  - "Requiere caracterizacion/modelo estructural y sensores fisicos en puntos accesibles."
  - "Cambios estructurales, condiciones de contorno o cargas fuera del modelo pueden degradar la inferencia."
  - "La prediccion de grieta es inferencia indirecta derivada de deformacion/tension virtual, no deteccion directa de la grieta."
contradicciones:
  - "No todos los observadores rindieron igual: DSO supero 20% RRMSE en un caso y no localizo el punto de inicio de grieta."
  - "'Sensor virtual' no elimina sensores: reduce o relocaliza instrumentacion fisica."
