tema_objeto: diagnostico acustico sin contacto de maquinaria rotativa
afirmacion_principal:
  hecho: "En el benchmark QU-DMBF, sonido captado externamente permitió detectar fallas de rodamientos con desempeño comparable al mejor enfoque por vibración y mayor robustez frente al cambio de ubicación del sensor."
  hipotesis: null
  interpretacion: "El campo acústico ambiental puede actuar como proxy de condición mecánica sin fijar un transductor al artefacto."
funcion: diagnosticar
principio_de_mediacion: "fallas mecánicas modulan patrones acústicos radiados; clasificación temporal/espectral convierte el sonido en estado de salud"
variable_fisica_entrada: "presión acústica radiada por maquinaria rotativa"
senal_o_estado_salida: "clasificación de condición/falla de rodamiento"
modalidad: acustica
invasividad: nula
requiere_contacto: no
requiere_electronica: si
requiere_computacion_digital: si
resolucion_o_precision: "el artículo reporta desempeño de detección de nivel estado-del-arte y comparable al mejor detector por vibración; no se fija aquí una cifra única porque varía por partición/condición"
latencia: "orientado a detección en tiempo real; cifra única no extraída"
condiciones_de_prueba: "dos motores, DC y AC trifásico; 1080 condiciones de trabajo; pruebas con condiciones no vistas y cambios de localización/severidad"
