tema_objeto: sensado inalámbrico pasivo bidimensional de esfuerzo mediante efecto magnetostrictivo inverso
afirmacion_principal:
  HECHO: "Material magnetostrictivo adherido a una estructura puede traducir tensión y torsión en cambios inalámbricamente interrogables de armónicos magnéticos, sin alimentación local del sensor."
  HIPOTESIS: "La misma mediación puede generalizarse a observación de carga en estructuras existentes cuando sea posible adherir el elemento y calibrar la geometría."
  INTERPRETACION: "Es un principio de observabilidad física pasiva: el estado mecánico altera permeabilidad magnética y el lector externo recupera esa alteración."
funcion: medir
principio_de_mediacion: "Efecto magnetostrictivo inverso: la carga cambia la permeabilidad del material; una excitación magnética externa permite leer inalámbricamente cambios en amplitud de armónicos superiores."
variable_fisica_entrada: "tensión axial y torque"
señal_o_estado_salida: "amplitud de armónicos magnéticos dependiente de carga"
modalidad: magnetica
invasividad: minima
requiere_contacto: si
requiere_electronica: no
requiere_computacion_digital: opcional
resolucion_o_precision: "error tras calibración/desacoplamiento: 3.4% para Fx y 4.2% para Tx bajo carga compuesta de 35 N y 3.5 N·m"
latencia: desconocida
condiciones_de_prueba: "prototipo con tres piezas magnetostrictivas sobre base elastomérica; rangos efectivos 0-40 N tensión y 0-4 N·m torque; ensayo compuesto 35 N + 3.5 N·m"
