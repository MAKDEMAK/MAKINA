mecanismo_o_principio: "La deformación modifica la permeabilidad de Metglas/material magnetostrictivo; la respuesta magnética no lineal bajo interrogación externa codifica componentes de carga."
limitaciones:
  - "Requiere adhesión mecánica del material sensor y calibración/desacoplamiento."
  - "La validación reportada corresponde a un prototipo y rangos de carga definidos; no demuestra universalidad entre geometrías/materiales."
  - "La pasividad corresponde al elemento sensor; la interrogación requiere campo y lector externos."
contradicciones:
  - "'Wireless/passive' no implica infraestructura totalmente sin energía: el lector externo aporta interrogación y adquisición."
