mecanismo_o_principio: "El piezoelectrico simultaneamente obtiene energia de la vibracion y genera la señal; el umbral electrico produce emisiones LED discretas. La etiqueta no interpreta la vibracion: la inferencia ocurre externamente sobre la temporizacion de los pulsos."
limitaciones:
  - "Requiere acoplamiento mecanico del piezoelectrico al objeto."
  - "Requiere linea de vista optica y receptor externo alimentado."
  - "El 94.9% es inferencia indirecta y dependiente del conjunto de cinco clases, no precision de medicion de vibracion."
  - "La respuesta depende de amplitud/espectro de vibracion y del umbral electrico/optico."
contradicciones:
  - "'Batteryless' describe la etiqueta; la canalizacion completa no es libre de alimentacion ni de computacion digital."
