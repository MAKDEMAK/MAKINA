tema_objeto: transduccion autoalimentada vibracion-a-pulsos-opticos
afirmacion_principal:
  hecho: "Una etiqueta formada por disco piezoelectrico, diodo Zener y LED convierte vibracion mecanica en pulsos opticos dispersos sin bateria, radio ni microcontrolador en la etiqueta; una camara de eventos externa puede observarlos para inferencia indirecta."
  hipotesis: "La codificacion fisica dispersa puede preservar suficiente estructura temporal de vibracion para distinguir estados o fuentes sin digitalizacion local."
  interpretacion: "El principio separa la mediacion local, energeticamente pasiva respecto de una bateria, de la computacion y alimentacion del receptor."
funcion: inferir
principio_de_mediacion: "deformacion piezoelectrica -> carga electrica -> umbral Zener/LED -> pulsos de luz visible -> eventos temporales"
variable_fisica_entrada: vibracion mecanica
señal_o_estado_salida: secuencia temporal de pulsos opticos
modalidad: piezoelectrica+optica
invasividad: minima
requiere_contacto: si
requiere_electronica: opcional
requiere_computacion_digital: opcional
resolucion_o_precision: "No se reporta precision metrologica de amplitud/frecuencia; 94.9% de fitness medio de clasificacion en cinco clases en la canalizacion completa."
latencia: "trade-off medido por binning temporal; el resultado publicado evalua varias ventanas, por lo que no se asume una latencia unica"
condiciones_de_prueba: "Cinco clases de dispositivos en entorno de taller; etiqueta fijada al objeto vibrante; enlace optico visible hacia camara de eventos; clasificacion posterior con SNN."
