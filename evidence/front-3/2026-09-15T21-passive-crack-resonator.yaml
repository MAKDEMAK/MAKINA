tema_objeto: passive wireless resonant crack sensing
afirmacion_principal: A flexible chip-free resonant ring can translate crack width into a remotely readable resonance-frequency shift without an onboard power supply.
funcion: medir
principio_de_mediacion: crack-induced perturbation of electromagnetic resonance
variable_fisica_entrada: crack width
señal_o_estado_salida: resonant frequency
modalidad: RF passive resonator
invasividad: minima
requiere_contacto: si
requiere_electronica: no
requiere_computacion_digital: no
resolucion_o_precision: sensitivity 67.02 MHz/mm over 0 to 2.5 mm
latencia: not reported
condiciones_de_prueba: flexible polyimide resonant-ring samples tested under varying crack width, distance, angle and bending
fuentes:
  - url: https://doi.org/10.3390/mi17080943
    titulo: Flexible Wireless Passive Resonance Ring Sensor for Nondestructive Crack Monitoring of Metal Structures
    tipo: experimental journal paper
    fecha: 2026-08-07
