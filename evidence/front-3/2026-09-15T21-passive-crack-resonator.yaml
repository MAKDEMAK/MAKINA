datos_cuantitativos:
  rango_grieta_mm: 0-2.5
  sensibilidad_MHz_por_mm: 67.02
mecanismo_o_principio: Crack growth perturbs the resonator electromagnetic field and shifts resonance; an external reader interrogates the structure wirelessly.
limitaciones:
  - Requires attachment of the passive resonator to the monitored structure.
  - Environmental and installation geometry can shift resonance and require compensation.
  - Evidence is laboratory-scale rather than long-duration field deployment.
contradicciones: Practical long-term engineering stability is proposed but not established by the reported laboratory experiments.
