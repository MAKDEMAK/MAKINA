id: f3-20260916-0801
frente: front-3
cycle_id: 2026-09-16T08
tema_objeto: inferencia no-contacto del estado operativo de motor de induccion mediante flujo magnetico de fuga
afirmacion_principal:
  hecho: Un unico sensor magnetico externo de alta sensibilidad y el espectro tiempo-frecuencia del flujo de fuga permiten extraer frecuencia de rotor y estimar indirectamente torque y potencia sin intervenir el cableado ni el eje.
  interpretacion: El campo magnetico de fuga funciona como señal proxy multivariable de un artefacto electromecanico legacy; la medicion primaria es campo magnetico y las variables mecanicas son inferencias calibradas.
funcion: inferir
principio_de_mediacion: captacion no-contacto del flujo magnetico de fuga externo y separacion espectral mediante STFT; la frecuencia de picos transitorios sigue la rotacion y su intensidad se correlaciona con carga/torque
variable_fisica_entrada: campo magnetico de fuga producido por corrientes y movimiento electromecanico del motor
senal_o_estado_salida: espectro magnetico; frecuencia de rotor directa desde pico espectral; torque y potencia inferidos mediante calibracion
modalidad: magnetica
invasividad: nula
requiere_contacto: no
requiere_electronica: si
requiere_computacion_digital: si
resolucion_o_precision: El paper demuestra correlacion experimental pero no reporta una metrica global de error de torque/potencia; ajuste de torque publicado tau_Nm = 0.1*I_mag1st_uT + 0.0068.
latencia: desconocido; procesamiento por STFT en ventanas temporales
condiciones_de_prueba: Motor de induccion monofasico de laboratorio alimentado a 50 Hz; sensor probado en dos posiciones/orientaciones externas; torque aplicado al eje y contrastado simultaneamente con load cell, corriente y sensor optico de velocidad; ruido <3 Hz excluido.
