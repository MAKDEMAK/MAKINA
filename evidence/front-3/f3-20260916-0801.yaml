nivel_evidencia: A
datos_cuantitativos:
  alimentacion_motor_Hz: 50
  ruido_excluido_menor_que_Hz: 3
  relacion_torque: "tau [Nm] = 0.1 * I_mag_1st [uT] + 0.0068"
  posiciones_sensor_evaluadas: 2
mecanismo_o_principio: El flujo de fuga contiene una componente fija asociada a la alimentacion y picos de transicion simetricos cuya frecuencia cambia con slip/rotacion. La intensidad del primer pico de transicion varia aproximadamente linealmente con torque en el montaje calibrado; combinando frecuencia inferida y torque se estima potencia.
limitaciones:
  - La ubicacion y eje del sensor deben optimizarse por relacion senal-ruido.
  - La relacion intensidad-torque es una calibracion del motor y montaje ensayados; no se demuestra universalidad entre motores.
  - Vibracion mecanica/chatter incremento el error aproximadamente entre 0.015 y 0.018 Nm.
  - Diagnostico de fallas se plantea como uso futuro; el estudio demuestra estado operativo, no una tasa validada de deteccion de fallas.
contradicciones:
  - La tecnica se denomina monitorizacion no-contacto, pero requiere proximidad espacial y electronica/sensor activo; no es sensado pasivo ni remoto de largo alcance.
  - Torque y potencia no son mediciones directas: dependen de correlaciones/calibracion con el espectro magnetico.
