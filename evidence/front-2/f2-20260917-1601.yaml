id: f2-20260917-1601
frente: front-2
cycle_id: 2026-09-17T16
tema_objeto: "videodisco analógico de alta densidad leído por capacitancia"
afirmacion_principal: "RCA llevó a producción masiva una vía de video doméstico prensable como un disco: información audiovisual codificada como microvariaciones geométricas en un surco conductor y leída por una aguja como capacitancia variable. La vía funcionó técnicamente y comercializó millones de discos, pero fue retirada tras llegar tarde frente al videocassette y conservar problemas inherentes al contacto físico, contaminación y desgaste."
nombre_proyecto_o_artefacto: "RCA SelectaVision Capacitance Electronic Disc (CED)"
periodo_historico: "1964-1986; mercado 1981-1986"
pais_contexto: "Estados Unidos"
disciplina: "almacenamiento audiovisual; electrónica; fabricación por prensado; transducción capacitiva"
problema_original: "Crear reproducción doméstica de video pregrabado con reproductores simples y discos baratos de duplicar mediante técnicas derivadas del prensado fonográfico."
principio_tecnico: "Un stylus conductor en contacto con un disco de PVC cargado con carbono forma un capacitor variable; microondulaciones del fondo del surco modifican la capacitancia y recuperan la señal audiovisual analógica. El surco guía mecánicamente el pickup."
estado_historico: "sustitución; línea comercial discontinuada"
resultado_real_alcanzado: "Producto de consumo lanzado en 1981. RCA informó el envío del disco número 2.000.000 en noviembre de 1981; el archivo corporativo registra más de 1.000 programas disponibles en septiembre de 1983. La fabricación regular de discos terminó en 1986."
causa_documentada: "La lectura por contacto hacía al sistema sensible a polvo/debris, saltos y desgaste; una patente RCA presentada antes del lanzamiento documenta explícitamente pérdida de señal, saltos de varios surcos y desgaste acelerado por contaminación. El desarrollo iniciado en 1964 llegó al mercado recién en 1981, cuando el videocassette ya ofrecía una vía competidora establecida. RCA cesó la producción de reproductores en 1984 y la de discos en 1986."
causas_alternativas:
  - "Competencia funcional de VHS/Betamax, que además permitían grabación doméstica."
  - "Competencia de videodiscos ópticos sin contacto físico."
  - "El largo desarrollo obligó a resolver repetidamente materiales, fabricación, lubricación, contaminación y seguimiento del surco antes de comercializar."
camino_que_lo_desplazo_si_existe: "Principalmente videocassette VHS/Betamax en video doméstico; en medios de disco, lectura óptica sin contacto (LaserDisc y descendientes)."
