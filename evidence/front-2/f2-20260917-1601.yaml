datos_cuantitativos:
  - "disco: 12 pulgadas; hasta 60 min de video por lado"
  - "tracking force de producción: ~65 mg"
  - "RCA anunció 2.000.000 de discos enviados al 5 nov 1981"
  - "RCA anunció >1.000 programas disponibles al 14 sep 1983"
  - "RCA estimaba ~500 reproducciones por disco bajo condiciones ideales (fuente histórica secundaria)"
limitaciones:
  - "contacto físico stylus-disco y desgaste acumulativo"
  - "polvo/debris podía producir pérdida momentánea, salto de múltiples surcos o locked groove"
  - "60 min por lado obligaba a voltear o usar múltiples discos para contenidos largos"
contradicciones:
  - "La narrativa de 'fracaso puramente técnico' es incompleta: hubo fabricación industrial, catálogo amplio y millones de discos; coexistieron causas técnicas, temporales y competitivas."
  - "La continuación japonesa VHD demuestra que lectura capacitiva de videodisco no desapareció inmediatamente; JVC eliminó el surco pero mantuvo lectura capacitiva por contacto."
incertidumbres:
  - "No se asigna un peso causal único entre retraso de desarrollo, competencia, desgaste/contaminación y estrategia comercial."
  - "Las cifras globales de reproductores vendidos y pérdidas financieras varían entre fuentes retrospectivas y no se usan aquí como hecho principal."
etiquetas_neutrales: [almacenamiento-analogico, capacitancia, transduccion, contacto-fisico, medio-prensado, videodisco, sustitucion, desgaste]
fecha_hallazgo: "2026-09-17T16:13:58-03:00"
fecha_revision: "2026-09-17T16:13:58-03:00"
evidencia_separada:
  hecho_documentado: "Existió producción comercial; la patente RCA documentó antes del lanzamiento los modos de fallo por polvo y contacto; comunicados RCA contemporáneos documentan escala de discos y catálogo."
  testimonio: "Memories of VideoDisc (1986), producido al cierre de la planta y con presentación del ex gerente general Jay J. Brandinger, preserva la retrospectiva interna de RCA."
  interpretacion: "El caso se clasifica como sustitución de una ruta técnicamente realizada, no como concepto fallido: el principio capacitivo alcanzó mercado pero quedó atrapado entre las desventajas del contacto físico y vías magnéticas/ópticas con mejores propiedades sistémicas."
