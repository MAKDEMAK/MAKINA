id: f2-2026-09-16T03-parametron
frente: front-2
cycle_id: 2026-09-16T03
tema_objeto: logica digital por oscilacion parametrica
nombre_proyecto_o_artefacto: Parametron y computadores parametron japoneses
periodo_historico: 1954-principios de 1960
pais_contexto: Japon
disciplina: computacion digital/electronica
problema_original: realizar logica y memoria digital fiable y barata cuando tubos y transistores eran costosos o poco fiables
principio_tecnico: circuito resonante LC con ferrita excitado parametricamente a 2f; las dos fases estables 0 y pi de la oscilacion a f codifican bits y permiten logica/memoria
estado_historico: sustitucion tras comercializacion real
resultado_real_alcanzado: "PC-1 (1958) uso 4200 parametrons, memoria de 512 palabras cortas; suma/resta 0.4 ms, multiplicacion 36-bit 4.4 ms, division 16.1 ms. Varias empresas japonesas comercializaron computadores parametron; FACOM212 fue exportado a Filipinas en 1963."
causa_documentada: "IPSJ: excelente fiabilidad, pero menor velocidad, mayor consumo y techo de mejora frente a computadores transistorizados; al mejorar la fiabilidad del transistor, el desarrollo parametron termino a comienzos de los 1960."
causas_alternativas: "IEEE/ETHW señala ademas que el transistor servia a mercados mas amplios que la logica digital, concentrando mucha mas inversion de I+D."
camino_que_lo_desplazo_si_existe: logica digital transistorizada
