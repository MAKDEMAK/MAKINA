limitaciones: baja velocidad y mayor consumo que la trayectoria transistor; limite de mejora documentado por IPSJ
contradicciones: "No fue un simple fracaso ni prototipo: existio una familia comercial y aplicaciones fuera de computadores; algunas fuentes simplifican su historia como obsolescencia inmediata."
incertidumbres: "La contribucion relativa exacta de velocidad, consumo, escalabilidad e inversion industrial a su sustitucion no queda cuantificada de forma comparable en las fuentes consultadas."
etiquetas_neutrales: [parametric-oscillation, ferrite, phase-logic, digital-logic, historical-computing, substitution]
separacion_epistemica:
  hecho_documentado: "Inventado por Eiichi Goto en 1954; computadores parametron fueron prototipados y comercializados en Japon; IPSJ documenta su sustitucion por transistores por velocidad, consumo y techo de mejora."
  testimonio: "ETHW reproduce la afirmacion contemporanea de Goto (1959) de que casi la mitad de los computadores electronicos japoneses en operacion usaban parametrons."
  interpretacion: "El camino tecnico abandonado no fue la computacion resonante en abstracto, sino una familia digital concreta donde fase estable de oscilacion parametrica realizaba logica/memoria; quedo desplazada antes de una evolucion comparable a la integracion transistor."
