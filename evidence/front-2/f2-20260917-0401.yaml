separacion_epistemica:
  hecho_documentado: >-
    Highgate Wood existio, entro en prueba/servicio publico experimental en 1962 con 800 lineas y la rama
    PAM/TDM fue retirada del programa de desarrollo.
  testimonio: >-
    Relatos tecnicos retrospectivos describen la transmision analogica como demasiado ruidosa en recorridos
    reales y el ensayo como abortivo, aunque tecnicamente formativo.
  interpretacion: >-
    El principio no desaparecio: se abandono la representacion analogica PAM para telefonia de red, mientras
    la multiplexacion temporal sobrevivio y resulto viable al cambiar la representacion de la voz a PCM.
