limitaciones: >-
  Las cifras publicadas de numero total de valvulas/transistores difieren entre fuentes secundarias;
  se omiten del paquete para evitar falsa precision. El ensayo no equivale a despliegue comercial masivo.
contradicciones: >-
  No debe narrarse como fracaso de TDM en general: fracaso/abandono fue de PAM/TDM analogico bajo las
  condiciones tecnicas de entonces. TDM continuo posteriormente combinado con PCM digital.
incertidumbres: >-
  La proporcion exacta de trafico publico frente a trafico artificial durante toda la prueba varia segun
  testimonios retrospectivos; esta ficha solo afirma conexion y servicio publico experimental documentados.
