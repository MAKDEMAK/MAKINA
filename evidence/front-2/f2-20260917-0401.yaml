tema_objeto: conmutacion telefonica electronica analogica PAM/TDM
nombre_proyecto_o_artefacto: Highgate Wood Electronic Telephone Exchange
afirmacion_principal: >-
  HECHO DOCUMENTADO: Highgate Wood llevo a servicio publico experimental una central telefonica
  totalmente electronica basada en multiplexacion temporal con modulacion por amplitud de pulsos
  (PAM/TDM), pero esa rama concreta fue retirada del desarrollo britanico tras revelar ruido,
  interferencia, incompatibilidades y costes que la hacian impracticable con la tecnologia disponible.
  No fue un concepto no realizado: existio una instalacion de campo de 800 lineas aceptada en 1962.
periodo_historico: "1956-1965"
pais_contexto: Reino Unido
disciplina: telecomunicaciones / conmutacion electronica
problema_original: >-
  Sustituir centrales electromecanicas por conmutacion electronica escalable, manteniendo servicio
  telefonico publico e interoperabilidad con la red y aparatos existentes.
principio_tecnico: >-
  Multiplexacion temporal de conversaciones analogicas: hasta 100 conversaciones compartian una
  highway mediante ranuras de 1 microsegundo repetidas a 10 kHz; puertas electronicas sincronizadas
  conectaban lineas, highways y control comun.
estado_historico: abandono de la rama PAM/TDM analogica; sustitucion y desviacion hacia reed-electronic y posteriormente TDM digital PCM
resultado_real_alcanzado: >-
  Central de campo de 800 lineas aceptada por el Post Office el 12-12-1962 y conectada experimentalmente
  al servicio publico. El control/equipamiento se habia concebido con capacidad aplicable a centrales
  mayores; el ensayo produjo experiencia operacional real antes de retirarse en 1965.
causa_documentada: >-
  La transmision analogica PAM sufria ruido/interferencia y problemas de calidad en trayectos reales;
  las fuentes historicas tambien documentan coste elevado, necesidad de mejores componentes,
  compatibilidad con sistemas existentes y reduccion sustancial del coste global.
causas_alternativas:
  - complejidad de interconexion con la red electromecanica existente
  - fiabilidad y prestaciones limitadas de componentes electronicos de la epoca
  - mantenimiento y crecimiento insuficientemente resueltos
camino_que_lo_desplazo_si_existe: >-
  En el corto plazo, conmutacion espacial reed-electronic/TXE y crossbar como transicion; posteriormente
  TDM reaparecio sobre voz digitalizada mediante PCM y condujo a centrales digitales como System X.
