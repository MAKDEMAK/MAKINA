id: f2-20260917-0101
frente: front-2
cycle_id: 2026-09-17T01
tema_objeto: logica_y_memoria_superconductora_controlada_magneticamente
afirmacion_principal: "HECHO DOCUMENTADO: entre 1953 y mediados de los 1960 el cryotron paso de interruptores superconductores experimentales a circuitos logicos, memoria asociativa, registros integrados y al menos un computador experimental; fue desplazado principalmente por la rapida reduccion de coste de los circuitos integrados de silicio, aunque la computacion superconductora continuo por otras ramas."
nombre_proyecto_o_artefacto: Cryotron
periodo_historico: "1953-mediados de 1960; continuaciones posteriores"
pais_contexto: Estados Unidos
disciplina: computacion_superconductora_y_microelectronica
problema_original: "Construir logica y memoria digital mucho mas compactas y de muy baja disipacion que los sistemas de tubos de vacio, incluyendo memoria direccionable por contenido."
principio_tecnico: "Un campo magnetico generado por una corriente de control fuerza un conductor superconductivo a pasar al estado resistivo; el dispositivo presenta ganancia y puede interconectarse como elemento logico. La miniaturizacion mediante peliculas delgadas permitia integrar matrices de estos interruptores."
estado_historico: sustitucion_con_absorcion_parcial
resultado_real_alcanzado: "Buck construyo y probo cryotrons, puertas, flip-flops y amplificadores; se desarrollo una memoria de reconocimiento/contenido direccionable; GE produjo registros de desplazamiento integrados y, segun la reconstruccion historica IEEE, un computador experimental formado por tres matrices de cryotrons integrados."
causa_documentada: "La evolucion de los microchips de silicio durante los anos 1960 redujo rapidamente el coste de la electronica y eclipsó al cryotron; hacia mediados de la decada la mayor parte de los grupos abandono esta linea."
causas_alternativas:
  - "Los primeros dispositivos bobinados conmutaban lentamente; una combinacion Pb-Nb citada historicamente alcanzaba 5 microsegundos, aunque peliculas delgadas posteriores llegaron a 0.1 microsegundos."
  - "El funcionamiento exigia refrigeracion criogenica con helio liquido, imponiendo infraestructura ajena al dispositivo logico."
camino_que_lo_desplazo_si_existe: "Circuitos integrados de silicio para logica y memoria convencional. Parte de la linea superconductora se desvio posteriormente hacia dispositivos Josephson y computacion superconductora especializada."
