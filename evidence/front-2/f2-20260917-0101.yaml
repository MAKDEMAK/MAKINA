nivel_evidencia: A
datos_cuantitativos:
  - "Cryotron bobinado Pb-Nb: tiempo de conmutacion historicamente reportado de 5 us."
  - "Pelicula superconductora experimental de ~100 nm: conmutacion de 0.1 us."
  - "Unidad de reconocimiento propuesta: 75000 cryotrons, ~3.2 kB."
  - "GE alcanzo un registro de desplazamiento integrado en 1961 y posteriormente un computador experimental de tres matrices."
limitaciones:
  - "Necesidad de operacion criogenica."
  - "La ventaja de integracion fue erosionada rapidamente por la economia y escalado del silicio."
  - "El computador de tres matrices esta documentado aqui mediante reconstruccion historica IEEE, no mediante un informe primario localizado en esta ronda."
contradicciones:
  - "No es correcto describir el cryotron como tecnologia que simplemente desaparecio: la computacion superconductora continuo, especialmente mediante dispositivos Josephson; lo abandonado fue su trayectoria como competidor general del silicio."
incertidumbres:
  - "No se verifico en fuente primaria durante esta ronda la arquitectura y prestaciones exactas del computador experimental de GE."
etiquetas_neutrales: [superconductividad, interruptor_magnetico, logica, memoria_asociativa, peliculas_delgadas, criogenia, sustitucion]
fecha_hallazgo: "2026-09-17"
fecha_revision: "2026-09-17"
separacion_epistemica:
  hecho_documentado: "El principio fue construido y probado; existieron circuitos logicos y memorias y la linea alcanzo integracion experimental antes de perder frente al silicio."
  testimonio: "La reconstruccion IEEE atribuye a GE un computador experimental construido con tres matrices integradas de cryotrons."
  interpretacion: "El camino representa sustitucion tecnologica y desviacion, no fracaso fisico del principio: perdio como plataforma general mientras descendientes superconductores continuaron en nichos distintos."