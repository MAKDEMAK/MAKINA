datos_cuantitativos: "El paper primario está publicado en AFIPS 1964, pp. 631-641. Las cifras populares de número de puertas, palabra y memoria no se incorporan aquí porque no quedaron verificadas directamente en el texto primario accesible durante esta ronda."
limitaciones:
  - "la fuente primaria accesible confirma el artefacto y el principio, pero no expone en el resumen métricas completas de velocidad, tamaño o consumo"
  - "no debe interpretarse el declive de computación fluídica general como abandono de toda la fluídica: continuó en control y nichos hostiles"
contradicciones:
  - "narrativas secundarias describen fluidics como 'abandonada', pero existen aplicaciones posteriores; clasificación correcta: desplazamiento/reducción, no desaparición"
incertidumbres:
  - "causalidad relativa entre velocidad, densidad, consumo y economía frente a circuitos integrados no está cuantificada en las fuentes primarias consultadas"
