id: f2-20260917-0301
frente: front-2
cycle_id: 2026-09-17T03
tema_objeto: logica_y_control_fluidico_sin_partes_moviles
afirmacion_principal: "La fluídica de alta Reynolds convirtió chorros de aire o líquido en amplificadores, lógica booleana, memoria y control secuencial sin electrónica ni partes móviles; llegó a prototipos y aplicaciones industriales, pero fue desplazada como plataforma general por la microelectrónica por ventajas de tamaño y velocidad, sobreviviendo en nichos y reapareciendo a otra escala en microfluídica."
nombre_proyecto_o_artefacto: "fluidic logic / fluidic amplifiers (incl. FLODAC y controles industriales)"
periodo_historico: "1959-1970s (auge); continuidad posterior en nichos"
pais_contexto: "Estados Unidos y Reino Unido; difusión industrial internacional"
disciplina: "control, automatización, neumática, computación"
problema_original: "Realizar amplificación, lógica, memoria y control automático robusto mediante el propio flujo de un fluido, especialmente donde electrónica o mecanismos móviles eran indeseables."
principio_tecnico: "Interacción de chorros, desviación de haz, adhesión a pared/Coanda y vórtices permiten que un flujo pequeño controle uno mayor; presión/flujo codifican señales y estados."
estado_historico: sustitucion_con_continuidad_de_nicho
resultado_real_alcanzado:
  - "En los años 1960 se fabricaron AND/OR/NOT/XOR, amplificadores, contadores y registros de desplazamiento fluídicos."
  - "NASA documentó en 1967 una versión breadboard de control secuencial neumático para motor cohete."
  - "Un prototipo de control fluídico para estación booster de oleoducto realizó más de 1000 secuencias start-stop sin incertidumbre reportada (1969)."
  - "En 1972 ya existían métodos formales de síntesis de circuitos secuenciales fluídico-neumáticos mediante álgebra de conmutación."
causa_documentada: "La disponibilidad creciente de transistores y circuitos integrados durante los 1960 aceleró el reemplazo; revisiones técnicas señalan que la lógica electrónica tenía ventajas decisivas de tamaño y velocidad."
causas_alternativas:
  - "Necesidad de suministro y acondicionamiento de fluido/presión."
  - "Complejidad de interconexión y menor densidad frente a circuitos electrónicos integrados."
camino_que_lo_desplazo_si_existe: "control electrónico de estado sólido, circuitos integrados y posteriormente control digital/PLC"
