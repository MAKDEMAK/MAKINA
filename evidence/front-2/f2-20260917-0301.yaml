datos_cuantitativos:
  - "Pipeline booster prototype: >1000 start-stop sequences, no uncertainty reported."
  - "Contemporary IEEE account (1969) reported switching lives >10^8 operations as usual for fluidic devices; retained as contextual, not universal performance guarantee."
limitaciones:
  - "Inferior size and switching speed versus solid-state electronic logic for general computation/control."
  - "Requires a fluid-energy source and pneumatic/hydraulic distribution."
  - "Performance depends on flow regime, geometry, pressure and contamination."
contradicciones:
  - "The path did not disappear: fluidic devices remained useful in specialized environments and principles later re-emerged in microfluidic control, so 'abandoned technology' is too strong."
  - "Modern microfluidic logic often uses different scale and operating mechanisms; it is not simply uninterrupted continuation of 1960s macroscale fluidics."
incertidumbres:
  - "FLODAC is historically reported as a 1964 proof-of-concept fluidic digital computer, but this package does not rely on it for quantitative performance because a sufficiently strong primary performance record was not verified in this cycle."
etiquetas_neutrales: [fluidics, pneumatic_logic, fluid_amplifier, no_moving_parts, sequential_control, substitution, industrial_automation]
hecho_documentado: "Working fluidic logic/control hardware existed and was applied beyond laboratory gates; contemporary records document rocket-engine-control breadboards and an industrial pipeline-booster prototype."
testimonio: "Contemporary and retrospective technical literature describes a 1960s boom and high reliability in appropriate control applications."
interpretacion: "The technically unfinished branch is not 'fluid computing failed', but the attempt to make fluid-domain logic a general control/computation substrate; semiconductor integration captured that role while fluid-domain computation retained specialized advantages."
