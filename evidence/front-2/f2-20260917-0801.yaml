  cifras_retrospectivas_no_confirmadas_en_primaria: "250 puertas NOR; palabra 4-bit; memoria 4 palabras"
limitaciones: "Las cifras arquitectónicas detalladas proceden de fuentes retrospectivas accesibles, no del texto completo del paper primario consultado en esta ronda. No se atribuye la desaparición total de la fluídica: sobrevivió en aplicaciones especializadas."
contradicciones: "La narrativa 'fluidics failed/disappeared' es demasiado fuerte: controles fluídicos persistieron en sensado, instrumentación, ambientes explosivos y otros nichos; además el principio reapareció posteriormente en microfluídica."
incertidumbres: "No se verificó en fuente primaria accesible el rendimiento de reloj ni todas las cifras de arquitectura del prototipo."
etiquetas_neutrales: [fluidica, logica_sin_electronica, computacion_no_convencional, prototipo_no_escalado, sustitucion, control]
separacion_epistemica:
  hecho_documentado: "Existencia y publicación contemporánea de FLODAC como pure fluid digital computer; auge de dispositivos fluídicos sin partes móviles durante los 1960."
  testimonio: "ASME retrospectivamente atribuye el declive a requisitos prácticos como aire limpio y a la entrada de electrónica barata durante los 1970."
  interpretacion: "FLODAC representa una bifurcación técnica real hacia computación digital materialmente implementada por dinámica de fluidos que no escaló como arquitectura general, más que un concepto meramente especulativo."
