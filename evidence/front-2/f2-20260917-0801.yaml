id: f2-20260917-0801
frente: front-2
cycle_id: 2026-09-17T08
tema_objeto: computador digital de lógica fluídica sin partes móviles
afirmacion_principal: "HECHO DOCUMENTADO: FLODAC demostró en 1964 que un computador digital programable podía construirse con elementos lógicos puramente fluídicos, usando chorros y amplificadores sin partes móviles; la ruta no escaló como computación general y fue desplazada por electrónica digital, aunque la fluídica continuó en nichos de control y sensado."
nombre_proyecto_o_artefacto: FLODAC (Fluid Operated Digital Automatic Computer)
periodo_historico: 1963-1964
pais_contexto: Estados Unidos
disciplina: [computacion, fluidica, control]
problema_original: "Realizar lógica y computación digital robusta mediante fluidos, evitando componentes eléctricos y partes mecánicas móviles."
principio_tecnico: "Chorros de fluido y amplificadores fluídicos bistables implementan conmutación, ganancia, memoria y puertas lógicas; una corriente de control débil desvía una corriente de potencia."
estado_historico: prototipo_no_escalado
resultado_real_alcanzado: "UNIVAC construyó un computador experimental y Gluskin, Jacoby y Reader publicaron FLODAC: a pure fluid digital computer en AFIPS Fall Joint Computer Conference de 1964, pp. 631-641. Fuentes históricas secundarias lo describen como un prototipo funcional; cifras de 250 puertas NOR, palabra de 4 bits y memoria de 4 palabras aparecen en fuentes retrospectivas y se conservan aquí con cautela hasta verificar el texto completo primario."
causa_documentada: "La literatura posterior sobre control neumático documenta que durante los años 1970 la electrónica entró al mercado con menor coste y desplazó gran parte de la lógica fluídica; también identifica necesidad de aire limpio como limitación práctica de instalaciones tempranas."
causas_alternativas: ["menor velocidad que la electrónica", "dificultad de miniaturizacion y escalado", "contaminacion/calidad del fluido de trabajo", "rápida mejora de circuitos integrados"]
camino_que_lo_desplazo_si_existe: "circuitos integrados electrónicos y control digital electrónico"
fuentes:
