afirmacion_principal:
  HECHO_DOCUMENTADO: La CIA construyo y volo un microvehiculo con forma de libelula; alcanzo 200_m en 60_s con masa_de_lanzamiento de 1_g, pero no se hizo operacional porque el control fallaba con viento_cruzado.
  TESTIMONIO: La retrospectiva oficial de CIA indica que vientos cruzados superiores a aproximadamente 5_mph desviaban la trayectoria y que el prototipo estimulo investigacion posterior en UAV.
  INTERPRETACION: Es un prototipo_no_escalado/abandonado por fragilidad del esquema de control frente a perturbaciones ambientales, no por incapacidad de generar vuelo a esa escala.
