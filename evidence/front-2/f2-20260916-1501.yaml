nivel_evidencia: A
datos_cuantitativos:
  - "MUSASINO-1: aproximadamente 5,400 parametrons; coste de prototipo ~15 millones de yenes."
  - "Goto documentó fan-out típico máximo de aproximadamente 10-20 parametrons por salida."
  - "MUSASINO-1B: completado 1960; utilizado hasta 1967."
  - "FACOM 212: completado 1959; exportado a Manila Customs Office en 1963."
limitaciones:
  - "Operación síncrona dependiente de excitación AC multifase."
  - "Frecuencia de operación terminó siendo inferior a la de transistores en rápida mejora."
  - "El primer MUSASINO-1 artesanal tuvo fallas de hardware y mantenimiento intensivo."
contradicciones:
  - "La narrativa de 'tecnología fallida' contradice la evidencia de uso operativo, comercialización FACOM y exportación; la clasificación adecuada es sustitución."
  - "La baja velocidad no fue universal desde el inicio: retrospectivas IEEE señalan que PC-2 llegó a superar al ETL Mark IV A transistorado de su momento; la desventaja decisiva apareció con la mejora posterior del transistor."
incertidumbres:
  - "No se cuantifica aquí cuánto pesaron por separado velocidad, coste total, consumo, manufactura y economía del ecosistema en la decisión industrial final."
