limitaciones: >-
  No se localizó en este ciclo un informe interno de DB de cierre que detalle la decisión corporativa final; la explicación económica más explícita procede de Wenger/UIRR (2001), actor sectorial con experiencia directa pero retrospectivo.
contradicciones: >-
  Algunas reconstrucciones posteriores enfatizan pérdida de clientes por obras en una línea como detonante del fin del servicio; Wenger/UIRR enfatiza costes de adquisición y una ventaja de tracción menor a la prevista. No se fuerza una causa única.
incertidumbres: >-
  No queda demostrado que una deficiencia técnica concreta del vehículo causara la retirada. Tampoco debe describirse la idea como extinta: hubo absorción parcial de la plataforma en vehículos multipropósito y conceptos ferroviarios posteriores.
