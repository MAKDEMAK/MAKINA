limitaciones: >-
  La investigacion historica del museo sigue abierta. No se establece que la maquina conservada
  fuese un computador de programa almacenado ni que todas las funciones anunciadas alcanzaran
  uso operacional prolongado.
contradicciones: >-
  La datacion institucional oscila entre prototipo de 1955 y descripcion del ejemplar como
  prototipo de 1956. La narrativa de 'fracaso aislado' es demasiado simple: existio colaboracion
  industrial con Remington, transferencia posterior de activos a NCR e interes empresarial.
incertidumbres: >-
  No esta resuelto cuanto del trabajo/patentes de Hofgaard fue absorbido por productos posteriores
  de NCR, Remington u otros fabricantes; tampoco esta cuantificado el peso relativo de falta de
  financiacion frente al desplazamiento tecnologico electronico.
