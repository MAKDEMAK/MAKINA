id: f2-20260916-1601
frente: front-2
cycle_id: '2026-09-16T16'
tema_objeto: automatizacion electromecanica integrada de oficina
afirmacion_principal: >-
  HECHO DOCUMENTADO: la linea Hofgaard intento integrar calculo, registro/indexacion,
  entrada e impresion para contabilidad, facturacion, bases de datos y control de inventario
  mediante mecanica de precision y electromecanica basada en reles. Hubo prototipos y una
  maquina de mediados de los 1950 fue demostrada, pero no llego a produccion. La investigacion
  museistica documenta que no fue financiada hasta producto comercial y que, al final de esa
  decada, sus soluciones habian sido sobrepasadas por computadores digitales electronicos.
nombre_proyecto_o_artefacto: Hofgaard-maskinen / sistema de Rolf Hofgaard
periodo_historico: '1922-1956; prototipo conservado de 1955/1956'
pais_contexto: Noruega / Estados Unidos
disciplina: maquinas de oficina; calculo electromecanico; automatizacion de datos
problema_original: >-
  Automatizar en una sola arquitectura tareas comerciales de calculo y registro, incluyendo
  contabilidad, facturacion, indexacion/base de datos e inventario.
principio_tecnico: >-
  Codificacion y procesamiento mediante redes de contactos/reles y mecanismos de registro,
  combinados con mecanica de precision; patentes tempranas describen lineas de digitos,
  elementos de registro y contactos controlados por el estado previamente registrado.
estado_historico: prototipo no escalado; linea desplazada
resultado_real_alcanzado: >-
  Se construyeron varios prototipos entre 1922 y 1954 segun documentacion institucional reciente;
  el prototipo noruego de mediados de los 1950 fue demostrado y reconocido por su potencial,
  pero nunca entro en produccion. El ejemplar conservado integra unidades de indexacion,
  calculo, entrada e impresion.
causa_documentada: >-
  El museo documenta dos hechos distintos: el proyecto Hofgaard-Remington termino tras el crash
  de 1929 y sus activos/patentes fueron vendidos a NCR; para la etapa noruega, el prototipo no
  obtuvo financiacion para convertirse en producto comercial. Hacia fines de los 1950 las
  soluciones de Hofgaard habian sido sobrepasadas por computadores digitales electronicos.
causas_alternativas:
  - INTERPRETACION: la transicion tecnologica hacia electronica digital redujo la ventana comercial de una arquitectura electromecanica compleja.
  - TESTIMONIO: Hofgaard afirmo que alrededor de cien patentes pasaron a NCR con la venta del patrimonio de Hofgaard-Remington; el museo aun investiga cuanto de ese trabajo influyo en maquinas posteriores.
camino_que_lo_desplazo_si_existe: computadores digitales electronicos de posguerra
