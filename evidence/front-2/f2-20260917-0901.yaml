id: f2-20260917-0901
frente: front-2
cycle_id: 2026-09-17T09
tema_objeto: memoria magnetica de burbujas como memoria no volatil de estado solido
afirmacion_principal: "HECHO DOCUMENTADO: la memoria de burbujas magneticas paso de prototipos Bell Labs a productos comerciales y aplicaciones reales, pero su aspiracion de memoria universal fue desplazada por memorias semiconductoras mas rapidas y discos mas densos/baratos; persistio temporalmente en nichos de robustez. INTERPRETACION: el principio no quedo simplemente 'fallido': fue una via comercialmente realizada pero sustituida por una combinacion de tecnologias especializadas."
nombre_proyecto_o_artefacto: Magnetic bubble memory
periodo_historico: 1967-1980s
pais_contexto: "Estados Unidos; desarrollo/comercializacion internacional posterior, incluido Japon"
disciplina: almacenamiento magnetico y microelectronica
problema_original: "obtener memoria digital no volatil, densa, de estado solido y sin partes mecanicas, potencialmente capaz de cubrir memoria principal y almacenamiento masivo"
principio_tecnico: "dominios magneticos cilindricos en peliculas delgadas de granate representan bits y son propagados por campos magneticos a traves de patrones de guiado; lectura magnetorresistiva"
estado_historico: sustitucion con supervivencia temporal en nichos
resultado_real_alcanzado: "productos comerciales desde 1977; TI introdujo un chip comercial de 92 kbit; Intel comercializo dispositivos de 1 Mbit y posteriormente 4 Mbit; hubo uso en terminales, controladores de maquinas, instrumentacion y computadores portatiles"
causa_documentada: "competencia simultanea de memoria semiconductor mas rapida y de discos con mayor densidad, velocidad de acceso y menor coste; la literatura japonesa de 1981 aun identificaba coste y velocidad de conmutacion como problemas"
causas_alternativas:
  - "arquitectura de acceso serial/por bucles con latencia"
  - "complejidad periferica: campo rotatorio, deteccion/control y requisitos de material/fabricacion"
  - "la ventaja de ausencia de partes moviles solo justificaba el coste en ciertos entornos"
camino_que_lo_desplazo_si_existe: "DRAM/otras memorias semiconductoras para memoria rapida; discos magneticos para almacenamiento masivo; posteriormente flash para nichos no volatiles robustos"
