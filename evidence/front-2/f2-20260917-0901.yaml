datos_cuantitativos:
  - "TI TBM 1.01/TIB 0103: 92 kbit comercial en 1977; informe NASA describe 157 bucles menores x 641 posiciones, con minimo 144 bucles buenos"
  - "IBM 1975 discutia escalado de burbujas y configuraciones para aumentar densidad/velocidad"
  - "revision japonesa 1981: burbujas <1 micrometro en desarrollo; mayor densidad de bit que memoria semiconductor, pero coste mayor"
limitaciones:
  - "no fue una tecnologia puramente abandonada: alcanzo produccion y aplicaciones reales"
  - "la causalidad del declive es multivariable y varia segun si se compara contra RAM, disco o almacenamiento no volatil posterior"
contradicciones:
  - "la narrativa de 'fracaso inmediato' contradice la comercializacion y uso durante anos; tambien hubo desarrollo de segunda generacion incluso despues del retiro de varios fabricantes"
incertidumbres:
  - "no se atribuye una unica fecha de abandono global porque fabricantes y mercados regionales siguieron trayectorias distintas"
