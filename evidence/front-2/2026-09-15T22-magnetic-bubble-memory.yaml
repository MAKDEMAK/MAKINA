limitaciones:
  - "Acceso por desplazamiento de dominios introduce latencia dependiente de posicion."
  - "Necesita campos de accionamiento y circuiteria periferica pese a que el medio no posee partes mecanicas moviles."
contradicciones:
  - "No fue simplemente un prototipo fallido: tuvo productos comerciales y aplicaciones de nicho reales."
incertidumbres:
  - "El peso relativo exacto de costo, velocidad, temperatura y competencia varia entre fabricantes y aplicaciones."
HECHO_DOCUMENTADO: "La tecnologia fue fabricada y vendida comercialmente por varias companias; existieron dispositivos de 1 Mbit y cartuchos removibles de 128 KB."
TESTIMONIO: "Fuentes museisticas describen su expectativa inicial como candidata a cubrir varias clases de almacenamiento."
INTERPRETACION: "El principio fisico sobrevivio tecnicamente, pero la trayectoria hacia memoria de uso general fue desplazada por una ecologia de memorias especializadas mas competitivas."
