tema_objeto: transporte guiado sobre colchón de aire
nombre_proyecto_o_artefacto: TALAV (Trem Aerodinâmico Leve de Alta Velocidade)
periodo_historico: 1970-1973
pais_contexto: Brasil
disciplina:
  - ingeniería de transporte
  - mecánica
  - aerodeslizamiento
  - infraestructura guiada
afirmacion_principal:
  hecho_documentado: >-
    La FEI desarrolló en 1972 un prototipo a escala real de un vehículo guiado de alta velocidad que sustentaba el vehículo mediante colchón de aire sobre una vía dedicada. El prototipo fue concebido para 20 pasajeros, con estructura ligera de aluminio y fibra de vidrio, y fue exhibido públicamente en Brasil Export 72; la etapa siguiente exigía construir una pista de pruebas, que no se concretó.
  testimonio: >-
    Fuentes retrospectivas vinculadas a la historia de FEI atribuyen la interrupción de la siguiente etapa a una combinación de necesidad de nuevo financiamiento, crisis del petróleo de 1973 y transición del gobierno Médici al gobierno Geisel.
  interpretacion: >-
    El TALAV constituye un prototipo no escalado de transporte guiado por colchón de aire. La evidencia disponible permite documentar la existencia física del vehículo y la interrupción antes de una infraestructura de prueba completa, pero no demuestra que el principio técnico fuera inviable.
problema_original: >-
  Crear transporte intermunicipal de alta velocidad mediante vehículos ligeros capaces de desplazarse sobre vías exclusivas con baja fricción y con configuraciones modulares para pasajeros o carga.
principio_tecnico: >-
  Sustentación por colchón de aire en canaleta/vía guiada dedicada, reduciendo el contacto mecánico; propulsión aerodinámica prevista mediante hélice, turbohélice o reacción. El diseño separaba el chasis de sustentación del módulo superior de pasajeros/carga.
estado_historico:
  clasificacion:
    - prototipo no escalado
    - abandono
  detalle: >-
    Se construyó un prototipo de escala real y se mostró públicamente, pero la pista de pruebas necesaria para validar y desarrollar el sistema como transporte implantable no llegó a construirse.
resultado_real_alcanzado: >-
  Prototipo físico a escala real para 20 pasajeros, de aproximadamente 15.6 m y unas 6 t cargado según reconstrucciones históricas; presentado en Brasil Export 72 y nuevamente asociado a Brasil Export 73. Existieron además estudios/prototipos menores previos relacionados con sustentación y propulsión.
causa_documentada: >-
  La historia institucional de FEI señala que para avanzar a producción/implantación era necesaria una pista de pruebas; la etapa no se concretó por necesidad de financiamiento, crisis del petróleo de 1973 y transición política entre los gobiernos Médici y Geisel.
causas_alternativas:
  - >-
    La infraestructura exclusiva era una barrera estructural: la propia historia institucional señala que la complejidad del Sistema Delta y la exigencia de vías exclusivas dificultaban su implantación en ciudades existentes.
  - >-
    Una fuente histórica secundaria afirma simplemente falta de nuevos financiamientos; esto es compatible con la historia institucional, pero no permite aislar una sola causa decisiva.
camino_que_lo_desplazo_si_existe: >-
  No se documenta en las fuentes consultadas un único sistema sucesor que sustituyera directamente al TALAV. La línea brasileña específica no escaló a red comercial; no debe equipararse automáticamente su abandono con una victoria técnica de ferrocarril convencional o maglev.
