limitaciones:
  - No se localizó en este ciclo un informe contemporáneo completo de ensayos instrumentados del TALAV a escala real.
  - Varias cifras técnicas provienen de reconstrucciones históricas posteriores, no de una ficha de ingeniería contemporánea recuperada directamente.
contradicciones:
  - >-
    Lexicar Brasil afirma que TALAV no llegó a ser probado en condiciones reales por falta de nuevo financiamiento, mientras una publicación histórica secundaria sobre el Uirapuru/TALAV afirma una demostración experimental de 40 km. Sin documentación contemporánea del supuesto recorrido, no se toma ese dato como hecho establecido.
  - >-
    Algunas fuentes describen dos turbinas a reacción instaladas y otras caracterizan el vehículo de forma más general como impulsado por hélice; puede reflejar variantes de diseño/exhibición y requiere documentación primaria para resolverlo.
incertidumbres:
  - Alcance exacto de las pruebas dinámicas efectuadas con el prototipo grande antes de la cancelación.
  - Peso relativo de financiamiento, crisis energética y cambio de gobierno en la decisión final.
  - Configuración propulsiva efectivamente operativa durante las demostraciones públicas.
