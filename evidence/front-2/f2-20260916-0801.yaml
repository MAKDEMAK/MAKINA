tema_objeto: sintetizador electronico de sintesis subarmonica de la RDA
afirmacion_principal: >-
  HECHO DOCUMENTADO: el Subharchord fue desarrollado entre 1959 y 1968 en el RFZ Berlin-Adlershof como generador central de sonidos y ruidos para estudios de radio, cine, television y musica electroacustica; existio como prototipo y pequena serie de aproximadamente siete instrumentos, pero su desarrollo institucional se detuvo tras el endurecimiento de la politica cultural de la RDA y no escalo a produccion sostenida.
nombre_proyecto_o_artefacto: Subharchord
periodo_historico: 1959-1970
pais_contexto: Republica Democratica Alemana
disciplina: electroacustica; instrumentacion musical electronica
problema_original: proporcionar a estudios un generador electronico central, rapido y operable de sonidos y ruidos artificiales
principio_tecnico: >-
  Sintesis subarmonica mediante division de una frecuencia fundamental en relaciones discretas (aprox. 1/2 a 1/16 en el prototipo Subharchord II), mezcla de subarmonicos y posterior conformacion mediante filtros y modulacion.
estado_historico: prototipo y pequena serie no escalada; desarrollo detenido por decision institucional/politica
resultado_real_alcanzado: >-
  Se construyeron aproximadamente siete instrumentos; hubo uso real en produccion musical, radio, cine y television, presentacion publica en Leipzig en 1965 y unidades enviadas fuera de la RDA, incluida una a NRK en Oslo.
causa_documentada: >-
  Fuentes institucionales atribuyen el fin del desarrollo al endurecimiento de la politica cultural de la RDA tras el 11. Plenum del SED de 1965; el laboratorio dejo de sostener la linea y el prototipo Subharchord II fue transferido al museo postal en 1968.
causas_alternativas:
  - TESTIMONIO/INTERPRETACION: condiciones economicas y materiales de produccion limitadas pudieron contribuir, pero no se registran aqui como causa primaria demostrada.
  - INTERPRETACION: la posterior expansion de sintetizadores analogicos controlados por tension ofrecio una trayectoria tecnica distinta y mas flexible; no demuestra por si sola que causara la cancelacion del Subharchord.
camino_que_lo_desplazo_si_existe: sintetizadores analogicos modulares y posteriormente comerciales basados en control por tension; estudios electroacusticos con equipos de generacion mas generales
