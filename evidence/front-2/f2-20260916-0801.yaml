  - produccion extremadamente pequena
  - caracter sonoro especializado
  - documentacion tecnica superviviente incompleta
  - deriva y degradacion de componentes en ejemplares conservados
contradicciones:
  - Las fuentes varian entre seis unidades de serie mas prototipo y siete instrumentos totales; se conserva aproximadamente siete en vez de fijar una cifra falsa.
  - Fuentes secundarias mencionan competencia de sintetizadores occidentales, pero las fuentes institucionales enfatizan la politica cultural como causa del cese.
