separacion_epistemica:
  hecho_documentado: >-
    Desarrollo 1959-1968, prototipo funcional, pequena serie, uso productivo y transferencia de unidades estan documentados por archivos y museos.
  testimonio: >-
    Relatos retrospectivos de participantes e historiadores vinculan directamente el frenado a la politica cultural contra la experimentacion electronica.
  interpretacion: >-
    El principio tecnico que quedo como camino discontinuado fue un instrumento de estudio dedicado a generar timbre mediante divisiones subarmonicas discretas y mezcla/filtrado, en lugar de la arquitectura generalista de control por tension que domino posteriormente.