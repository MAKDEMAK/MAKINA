nivel_evidencia: A
datos_cuantitativos:
  - "IBM 1973: 1024 bits; 1.5e6 bits/in2; 500 kHz chip; 100 kHz modulo."
  - "Rockwell 1978: 256 Kbit; chip de aproximadamente 1 cm cuadrado; burbujas ~4 micrometros de diametro."
limitaciones:
  - "Coste mayor que memoria semiconductor segun revision contemporanea de 1981."
  - "Velocidad de conmutacion seguia requiriendo mejora."
  - "Acceso dependiente del desplazamiento fisico de dominios, no RAM arbitraria instantanea."
contradicciones:
  - "La narrativa de fracaso total es incorrecta: existieron dispositivos comerciales y usos de nicho."
  - "Tampoco fue una memoria universal realizada: perdio mercados diferentes frente a tecnologias diferentes."
incertidumbres:
  - "No se atribuye el cierre industrial a una unica causa empresarial; la evidencia disponible sostiene competencia simultanea en coste, velocidad y capacidad."
