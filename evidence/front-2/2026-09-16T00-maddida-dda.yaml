    fecha: "consulta 2026-09-16"
nivel_evidencia: A
datos_cuantitativos: "Introducido en 1949; seis unidades vendidas hacia fines de 1952. El descendiente paralelo TRICE costaba USD 89,500 solo en configuracion inicial, ilustrando el coste de esta familia especializada."
limitaciones: "La arquitectura DDA no desaparecio de inmediato: se utilizo en control de tiempo real y guiado; por ello el estado correcto es absorcion/desplazamiento gradual, no fracaso."
contradicciones: "La narrativa de 'callejon sin salida' es demasiado fuerte: CHM documenta uso posterior de DDAs y computadores digitales de guiado derivados del mismo espacio tecnico."
incertidumbres: "No se atribuye una fecha unica de terminacion de MADDIDA ni una causa comercial exclusiva."
