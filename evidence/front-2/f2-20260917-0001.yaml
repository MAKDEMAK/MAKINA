id: f2-20260917-0001
frente: front-2
cycle_id: 2026-09-17T00
tema_objeto: videodisco analógico de lectura capacitiva por contacto
afirmacion_principal: "HECHO DOCUMENTADO: RCA llevó CED/SelectaVision desde investigación iniciada en 1964 hasta un producto comercial en 1981 que almacenaba video analógico de alta densidad en un disco conductivo y lo leía mediante variaciones de capacitancia entre disco y stylus. El camino funcionó técnicamente pero llegó tarde y fue sustituido en consumo por videocassette grabable y, en videodisco, por lectura óptica. INTERPRETACIÓN: el principio técnico no continuado como plataforma dominante fue usar una interfaz mecánica de guiado por surco junto con transducción eléctrica capacitiva de variaciones submicrométricas, separando contacto mecánico de lectura puramente mecánica."
nombre_proyecto_o_artefacto: "RCA Capacitance Electronic Disc (CED) / SelectaVision VideoDisc"
periodo_historico: "1964-1986; comercialización 1981-1984 para reproductores y hasta 1986 para discos"
pais_contexto: "Estados Unidos"
disciplina: "electrónica de consumo; almacenamiento audiovisual; transducción capacitiva; fabricación de precisión"
problema_original: "Distribuir películas y video doméstico pregrabado en un medio replicable por prensado, con reproductor de consumo relativamente simple."
principio_tecnico: "Disco de PVC conductivo con surco de alta densidad; un stylus de diamante con electrodo sigue el surco y detecta cambios extremadamente pequeños de capacitancia producidos por las modulaciones del fondo. La señal FM recuperada se procesa electrónicamente."
estado_historico: sustitucion
resultado_real_alcanzado: "Producto comercial. El modelo introductorio SFT100 ofrecía 2 h totales (1 h por lado) en disco de 30.2 cm, 450 rpm NTSC, caddy protector y lectura capacitiva; la cronología técnica documenta imagen reconocible en 1970, 20 min/lado en 1973, 30 min/lado en 1975 y 1 h/lado en 1978 antes del lanzamiento de 1981."
causa_documentada: "El desarrollo se prolongó hasta 1981. La contaminación, huellas, polvo y rayaduras obligaron al caddy; el contacto físico mantuvo sensibilidad al estado del disco. Para entonces VHS ofrecía grabación doméstica, menor precio de medios y una biblioteca/mercado más fuerte. RCA terminó la venta de reproductores en 1984 tras ventas acumuladas de alrededor de 550000 unidades y grandes pérdidas."
causas_alternativas:
  - "Retrasos de ingeniería y gestión redujeron la ventana competitiva: RCA anunció previamente lanzamientos que no se materializaron."
  - "La duración evolucionó de 20-30 min por lado a 60 min por lado, pero películas de más de dos horas requerían más de un disco."
  - "LaserDisc ofrecía una ruta de lectura sin contacto óptico, evitando parte del desgaste/contaminación inherente al stylus."
camino_que_lo_desplazo_si_existe: "Principalmente VHS/Betamax en video doméstico por grababilidad y ecosistema; LaserDisc como alternativa de videodisco de lectura óptica."
