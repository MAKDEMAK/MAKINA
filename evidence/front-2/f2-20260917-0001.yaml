    fecha: desconocida
nivel_evidencia: A
datos_cuantitativos:
  - "SFT100: 2 h totales, 1 h/lado; disco 30.2 cm; 35 W; 9.1 kg."
  - "Cronología RCA: 1973 20 min/lado y 1600 surcos/cm; 1975 30 min/lado y 2200 surcos/cm; 1978 1 h/lado y 3800 surcos/cm."
  - "Lectura: variaciones de capacitancia del orden de femtofaradios; electrónica del stylus alrededor de 900-910 MHz."
  - "Aproximadamente 550000 reproductores vendidos antes de terminar hardware en 1984."
limitaciones:
  - "Medio de solo reproducción: no resolvía la grabación doméstica que ofrecía VCR."
  - "Lectura por contacto y densidad elevada hacían crítica la contaminación y el desgaste; requirió caddy."
  - "60 min/lado obligaba a voltear o usar varios discos en contenido largo."
contradicciones:
  - "No debe clasificarse como fracaso técnico absoluto: llegó a fabricación masiva y mercado, y alcanzó la especificación de una hora por lado."
  - "Tampoco fue simplemente desplazado por LaserDisc: en mercado doméstico el competidor decisivo fue el videocassette, especialmente VHS."
incertidumbres:
  - "Las estimaciones públicas del coste/pérdida total del programa varían aproximadamente entre US$500 y US$650 millones según fuente y criterio contable."
  - "La fecha exacta de cierre depende de distinguir fin de reproductores (1984) de producción de discos (1986)."
