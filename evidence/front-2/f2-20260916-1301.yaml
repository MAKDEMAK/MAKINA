id: f2-20260916-1301
frente: front-2
cycle_id: 2026-09-16T13
tema_objeto: memoria de dominios magneticos cilindricos
nombre_proyecto_o_artefacto: magnetic bubble memory
afirmacion_principal:
  HECHO_DOCUMENTADO: "La memoria de burbujas magneticas alcanzo chips y modulos funcionales y produccion comercial, pero fue desplazada del almacenamiento general por memorias y discos mas baratos, rapidos y densos; sobrevivio temporalmente en nichos de robustez."
  TESTIMONIO: "No se usa testimonio personal como evidencia principal."
  INTERPRETACION: "Clasificacion: sustitucion con supervivencia de nicho, no fracaso experimental. El principio que perdio continuidad masiva fue almacenar y desplazar bits no volatiles como dominios magneticos fisicamente moviles en una pelicula, compartiendo infraestructura de propagacion y acceso."
periodo_historico: "1967-decada de 1980"
pais_contexto: "Estados Unidos; desarrollo internacional posterior"
disciplina: "memoria magnetica; almacenamiento; microelectronica"
problema_original: "Conseguir memoria no volatil, densa y robusta con menos interconexiones/periferia que arreglos convencionales y apta para almacenamiento sin partes mecanicas rotatorias."
principio_tecnico: "Bits representados por dominios magneticos cilindricos estables ('burbujas') en peliculas magneticas; campos y patrones de propagacion desplazan los dominios por bucles hasta puntos de escritura/lectura."
estado_historico: "sustitucion; produccion comercial; supervivencia de nicho"
resultado_real_alcanzado: "IBM demostro en 1973 un chip de 1024 bits a 1.5e6 bit/in^2, operado a 500 kHz en chip y 100 kHz en modulo, con no volatilidad establecida. Intel introdujo en 1979 un arreglo comercial de 4 Mbit; hubo uso en videojuegos y controladores de maquinas."
causa_documentada: "Soluciones de memoria mas baratas, rapidas y de mayor densidad volvieron obsoleta la memoria de burbujas; literatura de 1981 tambien identificaba coste y velocidad de conmutacion como problemas pendientes."
causas_alternativas:
  - "Complejidad de campos de accionamiento, materiales magneticos y circuiteria periferica."
  - "Competencia simultanea de almacenamiento semiconductor y discos con curvas de mejora mas favorables."
camino_que_lo_desplazo_si_existe: "memoria semiconductor y almacenamiento en disco; posteriormente otras memorias no volatiles de estado solido"
