datos_cuantitativos:
  - "1024 bits; 1.5e6 bit/in^2; 500 kHz a nivel chip; 100 kHz a nivel modulo (IBM, 1973)."
  - "Diseno conceptual NASA 1972: 1e8 bits, <=25 W, 6.4 Mbit/s, acceso de 200 ms a bloque de 800 palabras + 4 ms promedio a palabra."
  - "Demostracion IBM 1977: burbujas de 1 um y >3e7 bit/in^2 en circuitos contiguous-disk."
  - "Arreglo Intel comercial de 4 Mbit introducido en 1979."
limitaciones:
  - "Acceso inherentemente condicionado por propagacion/organizacion de bucles, no equivalente a RAM aleatoria moderna."
  - "Coste y velocidad seguian siendo desventajas explicitamente documentadas en 1981."
  - "Requeria campos de accionamiento y periferia aunque el medio fuese no volatil y sin partes rotatorias."
contradicciones:
  - "La narrativa de 'tecnologia que nunca funciono' es falsa: existieron chips funcionales, modulos y productos comerciales."
  - "Tampoco fue reemplazada instantaneamente: persistio en nichos como videojuegos y control de maquinas."
incertidumbres:
  - "No se atribuye el declive a una unica tecnologia competidora ni a una fecha universal de abandono."
  - "La importancia relativa de coste, velocidad, densidad y complejidad vario por aplicacion y fabricante."
etiquetas_neutrales: [memoria_magnetica, dominio_movil, no_volatil, almacenamiento, sustitucion, nicho, sin_partes_rotatorias]
