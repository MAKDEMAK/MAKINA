tema_objeto: computador de logica magnetica de nucleos
nombre_proyecto_o_artefacto: ALWAC 800
periodo_historico: 1956-1959
pais_contexto: Estados Unidos / Suecia
disciplina: computacion digital / logica magnetica
problema_original: construir un computador general de alta velocidad y bajo mantenimiento evitando tubos como elementos logicos principales
principio_tecnico: nucleos magneticos usados no solo como memoria sino como elementos logicos y registros, combinados con diodos
estado_historico: fracaso de desarrollo / prototipo no escalado / sustitucion
afirmacion_principal:
  HECHO_DOCUMENTADO: "Wegematic contrato un ALWAC 800 con la Reserva Federal en 1956 por USD 231800, prometiendo nucleos magneticos para memoria, logica y registros; tras redisenos y dificultades de ingenieria declaro impracticable la entrega en 1957. IBM entrego un 650 sustituto en 1958."
  TESTIMONIO: "Fuentes historicas posteriores indican que existio un prototipo y que el desarrollo continuo brevemente tras trasladarse a Suecia, sin llegar al mercado."
  INTERPRETACION: "El camino no demuestra que la logica magnetica fuese intrinsecamente inviable: otros computadores contemporaneos usaron principios magneticos. El caso documenta el fracaso de esta implementacion y contrato concreto, dentro de una via que fue rapidamente desplazada por semiconductores."
resultado_real_alcanzado: "Se anuncio comercialmente en 1956 con 11000 sumas/s, 2000 multiplicaciones/s y 13000 comparaciones/s; evidencia retrospectiva describe un prototipo, pero la maquina contratada nunca fue entregada."
causa_documentada: "Necesidad de rediseno y posteriores 'engineering difficulties'; Wegematic declaro que la entrega se habia vuelto impracticable."
causas_alternativas:
  - "La transicion acelerada hacia logica transistorada redujo la ventana economica de la arquitectura magnetica."
  - "La evidencia disponible no permite atribuir el fracaso exclusivamente al principio magnetico; gestion, integracion y calendario contractual tambien son variables plausibles."
camino_que_lo_desplazo_si_existe: "IBM 650 para la necesidad concreta de la Reserva Federal; a escala industrial, computadores basados en semiconductores."
