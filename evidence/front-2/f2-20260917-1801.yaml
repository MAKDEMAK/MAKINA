nivel_evidencia: A
datos_cuantitativos:
  - "La fuente primaria AFIPS identifica a FLODAC como computador digital puramente fluidico; cifras secundarias sobre numero de puertas/word size no se incorporan como hecho cuantitativo en esta ronda al no verificarse directamente en el texto primario accesible."
  - "Un articulo industrial de 1969 documenta un manipulador controlado por logica fluidica capaz de clasificar hasta 3,600 circuitos integrados por hora, evidencia de uso industrial de la familia tecnica, no de FLODAC."
limitaciones:
  - "velocidad inferior a la electronica contemporanea/posterior"
  - "calidad/limpieza del aire de suministro critica en implantaciones industriales"
  - "infraestructura de fluido necesaria"
contradicciones:
  - "La narrativa de que 'la fluidica fracaso' contradice aplicaciones documentadas posteriores en industria, medicina, instrumentacion y control especializado."
  - "NASA en 1964 calificaba el campo como temprano pero prometedor; la retrospectiva ASME atribuye parte de su posterior retroceso a sobreventa y condiciones industriales, no a imposibilidad tecnica."
incertidumbres:
  - "No se establecio en esta ronda una causa administrativa concreta para terminar especificamente el programa FLODAC."
  - "No se usan cifras populares de 250 puertas NOR, 4-bit/4-word como datos verificados porque no quedaron confirmadas directamente en el extracto primario accesible."
