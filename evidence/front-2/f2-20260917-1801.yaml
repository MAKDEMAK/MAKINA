id: f2-20260917-1801
frente: front-2
cycle_id: 2026-09-17T18
tema_objeto: computacion digital mediante logica fluidica sin partes mecanicas moviles
afirmacion_principal:
  hecho_documentado: "FLODAC demostro en 1964 que amplificadores fluidicos sin partes mecanicas moviles podian integrarse como elementos de logica de un computador digital; la misma familia tecnica fue ensayada para sensado, logica y control industrial/aeroespacial."
  testimonio: "Una retrospectiva profesional de ASME de 1985 describe que a mediados de los 60 la fluidica fue promovida como solucion general, pero sufrio por aire industrial insuficientemente limpio y por expectativas sobredimensionadas."
  interpretacion: "El camino no fracaso como principio: fue desplazado como plataforma general de logica/control por electronica de menor coste y mayor velocidad, mientras sobrevivio en nichos donde ausencia de partes moviles y tolerancia ambiental eran ventajas."
nombre_proyecto_o_artefacto: FLODAC
periodo_historico: "1960-1970s; FLODAC presentado en 1964"
pais_contexto: Estados Unidos
disciplina: "computacion; automatizacion; control; fluidica"
problema_original: "Realizar amplificacion, conmutacion, memoria/logica y control usando flujo de gas o liquido, especialmente donde componentes electromecanicos/electronicos presentaban limitaciones ambientales o de fiabilidad."
principio_tecnico: "Un chorro de potencia se conmuta o desvia mediante un chorro de control; dispositivos de interaccion de flujo y efecto de adherencia a pared proporcionan ganancia, conmutacion y estados biestables sin partes mecanicas moviles."
estado_historico: "prototipo no escalado como computador de proposito general; sustitucion en control general; continuidad especializada"
resultado_real_alcanzado: "UNIVAC construyo FLODAC y publico su arquitectura como 'pure fluid digital computer' en AFIPS 1964. NASA documentaba en 1964 aplicaciones simples ya realizadas y en 1966 una combinacion compleja serie/paralelo de dispositivos fluidicos controlando un actuador neumatico. Un paper SAE de 1967 reporto analisis y resultados de prueba de controles fluidicos para ramjet, cubriendo sensado, logica y actuacion."
causa_documentada:
  - "ASME (retrospectiva 1985): los circuitos fluidicos exigian aire limpio, poco habitual entonces en plantas industriales."
  - "ASME: durante los anos 70 la electronica entro al mercado y su bajo coste contribuyo al retroceso de la fluidica."
  - "La literatura historica/tecnica coincide en una desventaja de velocidad frente a electronica, aunque no se encontro en esta ronda una metrica primaria unica que explique por si sola el abandono de FLODAC."
causas_alternativas:
  - "sobreventa inicial y formacion insuficiente de usuarios, segun retrospectiva ASME"
  - "ventaja creciente de coste, integracion y velocidad de la electronica"
  - "necesidad de suministro y acondicionamiento del fluido"
camino_que_lo_desplazo_si_existe: "logica electronica de estado solido y, posteriormente, control digital basado en circuitos integrados/microprocesadores"
