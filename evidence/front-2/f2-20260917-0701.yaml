nivel_evidencia: A
datos_cuantitativos:
  - Recognition unit propuesta: 75000 cryotrons, aproximadamente 3.2 kB.
  - Una pelicula superconductora experimental de Buck conmutaba en aproximadamente 0.1 microsegundos.
  - El computador imaginado por Buck buscaba aproximadamente la capacidad de Whirlwind, cuyo sistema ocupaba varias salas y consumia cerca de 150 kW.
limitaciones:
  - Refrigeracion con helio liquido cercana al cero absoluto.
  - Los primeros cryotrons wire-wound tenian velocidad de conmutacion baja.
  - La recognition unit completa de 75000 elementos no esta documentada en las fuentes consultadas como sistema terminado.
  - El computador experimental posterior demuestra integracion, no viabilidad economica o escalado industrial.
contradicciones:
  - La narrativa de que el cryotron simplemente desaparecio es incorrecta: tecnologias superconductoras derivadas o relacionadas continuaron, aunque la arquitectura original perdio la competencia por computacion general.
  - Atribuir el final exclusivamente a la muerte de Buck contradice la continuidad posterior de programas en GE, IBM, RCA y otros laboratorios.
incertidumbres:
  - Las fuentes consultadas no fijan aqui una fecha unica de cancelacion para todos los programas industriales; el desplazamiento ocurrio de forma distribuida durante los anos 1960.
  - La relacion genealogica entre cryotron magnetico, Josephson logic y nano-cryotron debe tratarse como continuidad parcial, no equivalencia tecnica.
