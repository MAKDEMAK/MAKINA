limitaciones:
  - "MM6 no tiene evidencia audiovisual conocida de locomocion efectiva segun el catalogo del museo."
  - "Las demostraciones de MM7/MM8 dependian de controles externos; no prueban autonomia domestica general."
  - "No se encontro documentacion suficiente para cuantificar precision, carga util, velocidad, fiabilidad o horas de operacion."
contradicciones:
  - >-
    La narrativa de robot autonomo/inteligente debe limitarse: la filmacion Reuters de 1964 describe movimientos gobernados desde un panel complejo y la fuente retrospectiva indica que las tareas domesticas se realizaban solo insuficientemente.
  - >-
    Fuentes secundarias discrepan en dimensiones/masa de MM6; se priorizan 184 cm y 55 kg del catalogo institucional del Technisches Museum Wien.
