tema_objeto: robotica_humanoide_cibernetica_domestica
afirmacion_principal: >-
  La serie vienesa Maschinenmenschen de Claus Christian Scholz-Nauendorff materializo entre finales de los 1950 y los 1970 una via de robot domestico humanoide basada en actuacion electrohidraulica/electromecanica, teleoperacion y realimentacion; existieron varios aparatos, pero la linea no escalo a producto autonomo y sus tareas domesticas permanecieron limitadas.
nombre_proyecto_o_artefacto: "Maschinenmenschen MM6 / MM7 Selektor / MM8 Contina"
periodo_historico: "1957-1973 aprox."
pais_contexto: Austria
disciplina: robotica_cibernetica_electromecanica
problema_original: >-
  Construir maquinas humanoides de servicio capaces de manipular objetos y realizar tareas domesticas, avanzando desde control remoto hacia reconocimiento/reaccion y conducta autonoma.
principio_tecnico: >-
  Cuerpo antropomorfo con articulaciones accionadas; MM6 exploro miembros electrohidraulicos, mientras MM7/MM8 combinaron motores/controles remotos y mecanismos de realimentacion. La arquitectura perseguia trasladar acciones humanas a una maquina de proposito domestico general.
estado_historico: prototipo_no_escalado
a_resultado_real_alcanzado: null
resultado_real_alcanzado: >-
  MM6, MM7 y MM8 fueron construidos y se conservan ejemplares. Documentacion audiovisual contemporanea de 1964 muestra robots realizando acciones como abrir/cerrar puerta, tomar un sombrero, caminar/rodar, manipular botella y vaso y verter una bebida bajo control instrumental. El catalogo del Technisches Museum Wien advierte que para MM6 no se conoce documento audiovisual que pruebe movimiento efectivo y que estaba montado sobre un bastidor.
causa_documentada: >-
  Para MM6, el relato curatorial del Technisches Museum Wien documenta que problemas mecanicos llevaron a Scholz-Nauendorff a detener su desarrollo y construir un modelo sucesor. Para la linea completa, fuentes museales/historicas describen que las funciones domesticas se cumplian insuficientemente y que la investigacion no obtuvo exito duradero; no se localizo evidencia primaria suficiente para atribuir su terminacion a una unica causa economica o institucional.
causas_alternativas:
  - complejidad_mecanica_y_fiabilidad
  - dependencia_de_teleoperacion
  - autonomia_perceptiva_no_demostrada
  - capacidad_domestica_limitada
camino_que_lo_desplazo_si_existe: >-
  No se establece sustituto unico. La robotica industrial posterior privilegio manipuladores especializados y entornos estructurados frente al humanoide domestico general; se registra como interpretacion historica, no como causalidad documentada de cierre.
