separacion_epistemica:
  HECHO_DOCUMENTADO:
    - "MM6 existe en la coleccion del Technisches Museum Wien y el museo lo identifica como primer modelo de la serie."
    - "MM6 estaba soportado por bastidor y sus miembros estaban previstos para accionamiento mediante pistones hidraulicos."
    - "La filmacion Reuters de 1964 documenta robots posteriores ejecutando manipulaciones bajo control externo."
  TESTIMONIO:
    - "El relato del curador Christian Stadelmann atribuye el abandono de MM6 a problemas mecanicos y el paso a un modelo sucesor."
  INTERPRETACION:
    - "La serie representa una via temprana de robot domestico humanoide general que quedo en demostradores, mientras la robotica practica se especializo en arquitecturas mas restringidas."
