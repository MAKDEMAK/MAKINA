tema_objeto: computacion analogica hidraulica
nombre_proyecto_o_artefacto: Integrador hidraulico de Vladimir Lukyanov
periodo_historico: 1936-1980s
pais_contexto: URSS
disciplina: computacion_analogica_e_ingenieria
problema_original: resolver con rapidez ecuaciones diferenciales que modelaban transferencia termica y fisuracion del hormigon
principio_tecnico: analogia fisico-matematica entre flujo hidraulico y transferencia termica; niveles de agua representan variables y resistencias hidraulicas parametrizan coeficientes de la ecuacion
afirmacion_principal: "HECHO DOCUMENTADO: el integrador hidráulico no fue una curiosidad aislada: evolucionó a arquitectura modular, entró en producción en 1955 y fue aplicado a problemas de ingeniería durante décadas. Fue finalmente desplazado cuando computadores digitales pudieron resolver de forma práctica problemas comparables. INTERPRETACION: constituye una ruta madura de computación por isomorfismo físico que desapareció por sustitución funcional, no por fracaso experimental."
estado_historico: sustitucion_tardia
resultado_real_alcanzado: "IG-1 operativo en 1936; versiones modulares 2D/3D posteriores; producción serial IGL desde 1955; uso reportado en construcción, geología, metalurgia y otros dominios de ingeniería hasta décadas posteriores."
causa_documentada: "Los computadores digitales más pequeños y rápidos terminaron absorbiendo las tareas de modelado; fuentes históricas sitúan uso de integradores hidráulicos soviéticos hasta los años 1980."
causas_alternativas:
  - configuración física manual específica al problema
  - escalabilidad y reutilización inferiores al software digital general
camino_que_lo_desplazo_si_existe: simulacion_numerica_en_computadores_digitales
