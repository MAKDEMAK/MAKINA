limitaciones:
  - El cartucho y los equipos eran considerablemente mayores que Compact Cassette.
  - La mejora tecnica no compenso incompatibilidad, coste y menor conveniencia para el mercado masivo.
  - Las cifras de prestaciones citadas corresponden al Sony EL-7 y no deben generalizarse automaticamente a todos los decks Elcaset.
contradicciones:
  - Algunas fuentes describen Elcaset como tecnicamente excelente; esto no demuestra superioridad universal frente a todos los decks Compact Cassette contemporaneos.
  - La fecha exacta de cese aparece como 1979 o 1980 segun la fuente; se conserva 1980 como fecha aproximada de retirada comercial de Sony.
incertidumbres:
  - No se encontro en esta ronda una cifra primaria robusta de unidades mundiales vendidas; no se registra una estimacion.
  - La contribucion relativa de precio, tamano, incompatibilidad y mejora del Compact Cassette no puede separarse causalmente con la evidencia consultada.
separacion_epistemica:
  HECHO_DOCUMENTADO: >-
    Existieron decks y cintas comerciales Elcaset. El formato empleo cinta de 6.3 mm a 9.5 cm/s; durante reproduccion/grabacion la cinta era extraida del cartucho y guiada por el mecanismo del deck. El EL-7 documenta 15 Hz-27 kHz, 67 dB S/R con Dolby B y 0.04% wow/flutter.
  TESTIMONIO: >-
    Fuentes historicas retrospectivas caracterizan el sistema como tecnicamente logrado pero de adopcion muy baja y señalan la mejora del Compact Cassette como factor de desplazamiento.
  INTERPRETACION: >-
    El principio tecnico que quedo lateralizado no es simplemente usar una cinta mayor, sino separar mecanicamente las funciones de almacenamiento/proteccion del cartucho y las de guiado de precision: el cassette transporta y protege el medio, mientras el aparato toma control geometrico del medio durante la lectura/escritura.
