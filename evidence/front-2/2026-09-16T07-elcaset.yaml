id: f2-2026-09-16T07-elcaset
frente: front-2
cycle_id: 2026-09-16T07
tema_objeto: formato de grabacion magnetica encapsulada de alta fidelidad
nombre_proyecto_o_artefacto: Elcaset
periodo_historico: 1976-1980
pais_contexto: Japon; comercializacion internacional
disciplina: audio analogico; almacenamiento magnetico; mecanica de transporte de cinta
afirmacion_principal: >-
  Elcaset fue una via comercial real para obtener prestaciones cercanas al carrete abierto manteniendo la manipulacion por cassette: uso cinta de 1/4 de pulgada a 9.5 cm/s y, crucialmente, extraia la cinta del cartucho durante operacion para desacoplar la precision de guiado de las tolerancias del propio cassette. Fue desplazado no por incapacidad tecnica demostrada sino por coste/tamano y por la mejora simultanea del Compact Cassette.
problema_original: >-
  Combinar la calidad de grabacion/reproduccion de sistemas de carrete abierto con la comodidad de carga, proteccion y manipulacion de un cassette.
principio_tecnico: >-
  Aumentar ancho y velocidad de cinta para mejorar margen magnetico y respuesta, y sacar fisicamente la cinta del cartucho hacia un transporte de precision para que el guiado frente a las cabezas no dependa de las tolerancias mecanicas de la carcasa.
estado_historico: sustitucion
resultado_real_alcanzado: >-
  Producto comercial fabricado por Sony y licenciado/adoptado por otros fabricantes. El Sony EL-7 de 1976 operaba a 9.5 cm/s, alcanzaba 15 Hz-27 kHz con cinta FeCr, 67 dB S/R con Dolby B y 0.04% de wow/flutter. El formato fue retirado alrededor de 1980.
causa_documentada: >-
  Baja adopcion comercial; mayor volumen y coste frente al Compact Cassette, mientras este mejoro rapidamente mediante mejores materiales de cinta y fabricacion. Sony retiro el sistema alrededor de 1980.
causas_alternativas:
  - La incompatibilidad con el enorme ecosistema instalado de Compact Cassette reducia la ventaja practica del aumento de calidad.
  - La necesidad de un transporte mas grande y complejo erosionaba precisamente la ventaja de portabilidad/conveniencia que motivaba el formato.
camino_que_lo_desplazo_si_existe: >-
  Compact Cassette mejorado, especialmente con nuevas formulaciones magneticas y mejores transportes; el mercado de maxima fidelidad tambien podia permanecer en carrete abierto.
