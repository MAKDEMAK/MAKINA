nivel_evidencia: A
datos_cuantitativos:
  - Vander Woerd inventó su máquina en 1871 y la mejoró desde 1874
  - demostración de factibilidad del NC del MIT: 1952
limitaciones:
  - no constituye una rama extinta: tornos automáticos mecánicos siguieron funcionando después de la adopción de CNC
  - la evidencia de este paquete describe una familia tecnológica, no un único modelo abandonado
contradicciones:
  - decir que CNC 'reemplazó' por completo las automáticas mecánicas sería falso; coexistieron y persisten nichos de alto volumen
incertidumbres:
  - el grado y fecha del desplazamiento varía por industria, pieza y volumen de producción
etiquetas_neutrales: [machine-tool, mechanical-automation, cams, physical-programming, nc, cnc, partially-displaced]
fecha_hallazgo: 2026-09-15
fecha_revision: 2026-09-15
hecho_documentado: >-
  Smithsonian documenta una máquina automática para tornillos de 1871; MIT documentó en 1959 que el control numérico
  utilizaba números codificados en cinta para gobernar automáticamente servomecanismos de máquinas-herramienta.
testimonio: null
interpretacion: >-
  La característica arqueológica importante es que una secuencia de fabricación podía estar 'programada' en la forma y
  disposición del mecanismo físico; NC/CNC trasladó esa representación desde materia/utillaje hacia información codificada.