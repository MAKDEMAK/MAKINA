id: f2-mechanical-machine-tool-automation-1871-cnc-era
frente: front-2
cycle_id: 2026-09-15T20
tema_objeto: automatización mecánica de máquinas-herramienta mediante secuencias físicas
afirmacion_principal: >-
  Décadas antes del control numérico, tornos automáticos realizaban ciclos de mecanizado completos mediante mecanismos
  físicos como levas, trazadores y secuencias de herramientas. La rama no desapareció por fracaso: fue parcialmente
  desplazada por NC/CNC porque el control codificado desacopló la geometría y la secuencia de trabajo del utillaje físico,
  aunque máquinas mecánicas continuaron en servicio y pueden seguir siendo competitivas en producción de gran volumen.
nombre_proyecto_o_artefacto: automatic screw machine / cam-operated automatic lathe
periodo_historico: 1871-presente, con desplazamiento principal desde 1950s-1970s
pais_contexto: Estados Unidos y otros centros industriales
disciplina: [máquinas-herramienta, fabricación, automatización mecánica]
problema_original: producir piezas torneadas repetitivas con mínima intervención del operador y alta cadencia
principio_tecnico: >-
  El movimiento y la secuencia de herramientas se codifican físicamente en mecanismos de máquina —incluidas levas,
  trazadores, pantógrafos y torretas— que sincronizan operaciones repetibles a partir de un accionamiento común.
estado_historico: desplazamiento parcial / supervivencia de nicho
resultado_real_alcanzado: >-
  Smithsonian conserva la máquina automática de Charles Vander Woerd, inventada en 1871 para fabricar tornillos de reloj;
  la tecnología evolucionó a familias de screw machines y automatic lathes plenamente automáticas. Desde los años 1950,
  NC y luego CNC introdujeron control mediante información codificada en lugar de depender exclusivamente de guías físicas.
causa_documentada: >-
  NC/CNC permitió programar y modificar trayectorias complejas mediante datos; la literatura histórica describe el paso
  desde plantillas/trazadores y automatización mecánica hacia control numérico. La flexibilidad favoreció el desplazamiento,
  no una incapacidad absoluta de las máquinas mecánicas.
causas_alternativas:
  - preparación especializada y fabricación de levas para cambiar trabajos
  - ventaja de CNC para lotes variables y geometrías complejas
camino_que_lo_desplazo_si_existe: control numérico y posteriormente computer numerical control (CNC)
fuentes:
