nivel_evidencia: B
datos_cuantitativos:
  - lanzamiento comercial: 1979
  - fin del formato: 1988
  - actuacion piezoelectrica descrita hasta aproximadamente +/-150 V en documentacion tecnica secundaria
limitaciones:
  - no se recupero en esta ronda el manual primario de servicio citado para DTF
  - el exito o fracaso comercial del formato no mide aisladamente el valor tecnico de DTF
contradicciones:
  - la intencion de DTF era mejorar compatibilidad entre maquinas, pero se documentaron problemas de alineacion entre primeras maquinas Philips y Grundig
incertidumbres:
  - contribucion cuantitativa de la complejidad/coste de DTF frente a factores de mercado
hecho_documentado: >-
  Video 2000 fue comercial, uso DTF con actuacion piezoelectrica y desaparecio como formato a finales de los anos 1980.
testimonio: >-
  Retrospectivas tecnicas atribuyen su derrota principalmente a entrada tardia, ecosistema VHS y alcance de mercado, no a incapacidad fundamental del seguimiento activo.
interpretacion: >-
  Es un camino donde una solucion sofisticada de servo-seguimiento existio en producto real pero quedo encerrada en un formato que fue sustituido por otra plataforma.
etiquetas_neutrales: [video_magnetico, servo, piezoelectrico, DTF, formato, sustitucion]
