nivel_evidencia: A
datos_cuantitativos:
  - "IEEE Spectrum (1969): vidas de conmutación >1e8 operaciones descritas como usuales para dispositivos de la época."
  - "TIME (1967, fuente contextual no usada como evidencia primaria principal): estimación de mercado de productos fluídicos de USD 30 millones ese año."
limitaciones:
  - no se obtuvo en esta ronda una especificación completa de FLODAC que permita comparar velocidad, tamaño y consumo con computadores electrónicos contemporáneos
  - fluidics comprende familias físicas distintas; no debe generalizarse una limitación de escalado de un dispositivo a toda la disciplina
contradicciones:
  - la narrativa de 'tecnología abandonada' es incompleta: la lógica fluídica continuó en aplicaciones especializadas y principios relacionados reaparecieron en microfluídica y control neumático
  - la existencia de métodos de diseño publicados en 1972 contradice una desaparición inmediata tras la llegada del transistor
incertidumbres:
  - peso causal relativo de coste, velocidad, tamaño, herramientas de diseño y ecosistema industrial en el desplazamiento
  - alcance funcional exacto de FLODAC más allá de la demostración publicada sin consultar el texto completo del proceedings
