id: f2-20260916-2101
frente: front-2
cycle_id: 2026-09-16T21
tema_objeto: computacion_digital_fluidica_sin_partes_moviles
afirmacion_principal:
  hecho_documentado: "FLODAC demostro en 1964 que un computador digital programable de proposito general podia implementarse exclusivamente con logica de fluido, usando aire presurizado y elementos NOR sin partes mecanicas moviles."
  testimonio: "Los autores concluyeron que el computador fluido era factible, pero reconocieron que no podia competir con la electronica en muchas areas por la limitacion intrinseca de velocidad de propagacion de señales fluidas."
  interpretacion: "Fue un prototipo no escalado y una via parcialmente sustituida: la computacion digital fluidica general no continuo como plataforma competitiva, mientras principios fluidicos sobrevivieron en controles especializados."
nombre_proyecto_o_artefacto: FLODAC
periodo_historico: "1963-1964"
pais_contexto: "Estados Unidos"
disciplina: "computacion digital / fluidica / control"
problema_original: "Explorar logica y computacion digital robustas sin electronica ni partes mecanicas moviles, especialmente para ambientes extremos."
principio_tecnico: "Chorros de aire presurizado realizan conmutacion y amplificacion; elementos NOR fluidicos se interconectan para implementar memoria, control y aritmetica digital."
estado_historico: prototipo_no_escalado
resultado_real_alcanzado: "Computador experimental programable construido y operando de forma fiable; ejecutaba automaticamente programas con cuatro instrucciones y memoria de cuatro palabras. Reloj nominal de 10 ciclos/s; circuitos compactos con elementos equivalentes fueron probados hasta 250 ciclos/s."
causa_documentada: "Los propios autores identificaron la velocidad como limite fisico: la propagacion de señales en aire es aproximadamente un millon de veces mas lenta que en conductores electricos, por lo que la logica fluidica no podia competir con electronica en muchas aplicaciones."
causas_alternativas:
  - "La literatura historica posterior describe el desplazamiento de la fluidica en control industrial conforme la logica digital electronica se consolido; no se atribuye aqui una causa comercial unica a FLODAC."
camino_que_lo_desplazo_si_existe: "logica digital electronica de estado solido"
