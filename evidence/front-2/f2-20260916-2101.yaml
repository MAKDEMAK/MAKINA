limitaciones:
  - "Velocidad de propagacion fluidica intrinsecamente baja frente a electronica."
  - "El prototipo usaba conductos largos y no optimizo adaptacion de impedancias; 10 Hz no representa un limite absoluto de componentes fluidicos."
  - "Necesita fuente de fluido presurizado."
contradicciones:
  - "No fue un fracaso funcional: el paper informa operacion fiable pocas semanas despues de iniciada la construccion."
  - "La fluidica no desaparecio completamente; continuo en nichos de control y ambientes donde la electronica era desfavorable."
incertidumbres:
  - "No se encontro evidencia primaria suficiente para atribuir el fin de FLODAC a una decision empresarial concreta o fecha formal de cancelacion."
  - "No se registra aqui el numero de elementos NOR porque fuentes secundarias difieren y el extracto primario consultado no basta para fijarlo con seguridad."
