nivel_evidencia: A
datos_cuantitativos:
  - "cryotron de hilo: conmutacion reportada de 5 microsegundos"
  - "pelicula experimental Pb-Bi-Sr: 0.1 microsegundo"
  - "el transistor más rápido contemporáneo era aproximadamente 100 veces más rápido que el cryotron de 5 microsegundos"
limitaciones:
  - refrigeracion criogenica
  - velocidad de transición superconductivo-normal en diseños tradicionales
contradicciones:
  - "La narrativa de desaparicion total es incorrecta: variantes con uniones Josephson continuaron y la computacion superconductora persiste."
incertidumbres:
