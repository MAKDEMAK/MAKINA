limitaciones:
  - La transmision de patrones evita el generador local completo de caracteres pero intercambia esa simplificacion por mayor volumen de informacion visual transmitida.
  - Las cifras de adopcion prueban alcance limitado, no aislan causalmente una unica razon del resultado comercial.
contradicciones:
  - La encuesta experimental de 1981 mostraba intencion de uso y alta valoracion visual, pero la adopcion comercial posterior permanecio limitada; intencion declarada no predijo penetracion masiva.
incertidumbres:
  - El peso causal relativo del precio del terminal, velocidad/eficiencia de transmision, modelo de servicio y competencia posterior no queda cuantificado de forma comparable en las fuentes consultadas.
  - La afirmacion de que el precio fue la causa principal procede de una fuente tecnica retrospectiva, no de una evaluacion econometrica contemporanea.
