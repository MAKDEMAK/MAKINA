tema_objeto: videotex rasterizado sobre red telefonica
nombre_proyecto_o_artefacto: CAPTAIN (Character And Pattern Telephone Access Information Network System)
periodo_historico: 1978-2002
pais_contexto: Japon
disciplina: telecomunicaciones / interfaces / servicios de informacion
afirmacion_principal: >-
  CAPTAIN fue una via japonesa de videotex que resolvio la dificultad de representar kanji y graficos complejos en terminales domesticos baratos transmitiendo patrones de puntos pre-renderizados por la red telefonica hacia televisores, en vez de depender de generadores locales de caracteres. Paso de experimentos nacionales a servicio comercial, pero no alcanzo adopcion masiva y termino siendo desplazado por servicios de PC/red e Internet.
problema_original: >-
  Dar acceso domestico bajo demanda a informacion textual y grafica usando lineas telefonicas existentes y televisores, incluyendo miles de kanji y otras formas complejas cuya generacion local encarecia el terminal.
principio_tecnico: >-
  Transmision de informacion como patrones de puntos (pattern transmission): el centro codifica y transmite la imagen/patron que el terminal presenta en el televisor, permitiendo caracteres y dibujos arbitrarios sin almacenar un repertorio completo de glifos en cada terminal.
estado_historico: sustitucion con despliegue comercial prolongado
resultado_real_alcanzado:
  hecho_documentado: >-
    El primer experimento opero de diciembre de 1979 a marzo de 1981 con 1000 terminales, 199 proveedores de informacion y 100000 cuadros/paginas; un segundo experimento comenzo en agosto de 1981 con 2000 terminales y 200000 cuadros. El servicio comercial comenzo en noviembre de 1984 y finalizo el 31 de marzo de 2002.
  testimonio: >-
    El paper de 1981 reporta que los usuarios valoraban especialmente el atractivo de las pantallas y que muchos declaraban querer usar el sistema cuando comenzara el servicio comercial.
  interpretacion: >-
    La ruta demostro que era viable desplazar complejidad tipografica desde el terminal hacia la representacion transmitida, pero esa ventaja no produjo por si sola un mercado masivo.
causa_documentada: >-
  Las fuentes historicas coinciden en adopcion limitada: para marzo de 1992 CAPTAIN tenia aproximadamente 120000 abonados pese al despliegue nacional. Fuentes japonesas retrospectivas senalan ademas el elevado precio inicial de terminales dedicados y, posteriormente, el desplazamiento por comunicaciones de PC e Internet.
causas_alternativas:
  - terminal dedicado y coste de acceso
  - transmision raster menos eficiente que representar contenido simbolicamente cuando el terminal puede renderizarlo
  - competencia posterior de redes de PC, TCP/IP y Web
camino_que_lo_desplazo_si_existe: comunicaciones por computador e Internet/Web sobre redes IP
