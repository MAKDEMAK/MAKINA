id: f2-20260917-1401
frente: front-2
cycle_id: 2026-09-17T14
tema_objeto: memoria acústica serial por línea de retardo
nombre_proyecto_o_artefacto: Mercury delay-line memory
periodo_historico: 1947-1970s
pais_contexto: Reino Unido / Estados Unidos / Australia
disciplina: computación; memoria; acústica
afirmacion_principal: Las líneas de retardo hicieron viable memoria electrónica útil convirtiendo bits en ondas acústicas recirculantes; fueron desplegadas en computadores reales y luego sustituidas por memorias de acceso aleatorio y semiconductores.
problema_original: almacenar suficientes bits para computadores electrónicos de programa almacenado
principio_tecnico: Pulsos eléctricos se convierten mediante transductores en pulsos ultrasónicos que atraviesan un medio físico, se reconvierten, regeneran y recirculan; el tiempo de propagación almacena el tren de bits.
estado_historico: sustitucion con continuidad parcial
resultado_real_alcanzado:
  hecho_documentado:
    - EDSAC operó en 1949 con 32 líneas de mercurio y 512 palabras de 35 bits.
    - UNIVAC I empleó memoria de línea de retardo con acceso medio reportado de 222 microsegundos.
    - CSIRAC implementó líneas acústicas con capacidad teórica total de 1024 palabras.
  testimonio: []
  interpretacion:
    - No fue un fracaso; resolvió una carencia crítica y fue desplazada por tecnologías con acceso aleatorio más conveniente.
causa_documentada:
  - acceso intrinsecamente secuencial
  - control térmico preciso en implementaciones con mercurio
  - peso y volumen del medio
  - aparición de memorias de acceso aleatorio
causas_alternativas:
  - variantes magnetostrictivas prolongaron la familia técnica durante los años 1960
camino_que_lo_desplazo_si_existe: memoria de núcleos magnéticos; posteriormente memoria semiconductor
