    titulo: En depit des incertitudes techniques...
    tipo: prensa contemporanea
    fecha: 1974-02-09
nivel_evidencia: A
datos_cuantitativos:
  - Experimental 02: 422 km/h el 22-01-1969
  - via de ensayo Experimental 02: 6.7 km
  - Experimental 02: 2.6 t y reactor JT12D de 1200 kg de empuje
limitaciones:
  - distintas variantes del programa usaron sistemas de propulsion diferentes; no debe tratarse Aerotrain como una unica configuracion
contradicciones:
  - las fuentes difieren en fechar el abandono como 1974, 1977 o 1978 segun contrato, programa tecnico o decision publica considerada
incertidumbres:
  - peso relativo exacto de factores politicos, energeticos, economicos y tecnicos en la decision final
hecho_documentado: >-
  Hubo prototipos reales, vias de prueba, records medidos y estudios de linea comercial; no llego a servicio comercial.
testimonio: >-
  Fuentes patrimoniales posteriores caracterizan el programa como una alternativa pionera finalmente desplazada por el TGV.
interpretacion: >-
  El principio de sustentacion por aire para alta velocidad terrestre quedo como camino frances no escalado, mientras el objetivo de alta velocidad se resolvio mediante ferrocarril convencional evolucionado.
etiquetas_neutrales: [cojin_de_aire, transporte, Francia, prototipo, sustitucion, TGV]
