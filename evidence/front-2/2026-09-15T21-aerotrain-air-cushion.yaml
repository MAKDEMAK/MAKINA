id: f2-20260915-21-aerotrain
frente: front-2
cycle_id: 2026-09-15T21
tema_objeto: transporte guiado de alta velocidad sobre cojin de aire
nombre_proyecto_o_artefacto: Aerotrain de Jean Bertin
periodo_historico: 1965-1977
pais_contexto: Francia
disciplina: transporte / mecanica / infraestructura
problema_original: lograr transporte terrestre guiado de alta velocidad eliminando contacto rueda-riel y gran parte de la friccion mecanica
principio_tecnico: sustentacion y guiado por cojin de aire sobre via dedicada en T invertida; distintas variantes de propulsion incluyeron helice, turborreactor y estudios de motor lineal
afirmacion_principal: El Aerotrain alcanzo prototipos a escala real y velocidades superiores a 400 km/h, pero Francia abandono la linea antes de explotacion comercial y priorizo el TGV ferroviario electrico compatible parcialmente con infraestructura existente.
estado_historico: prototipo no escalado; sustitucion
resultado_real_alcanzado: >-
  Se construyeron cinco prototipos en el programa; el Experimental 02 alcanzo 422 km/h el 22-01-1969 sobre una via de ensayo de 6.7 km. Existio tambien una via experimental de aproximadamente 18 km al norte de Orleans y planes avanzados para una linea Cergy-La Defense.
causa_documentada: >-
  Fuentes institucionales francesas registran el abandono definitivo durante los anos 1970 y la eleccion estatal del TGV. Fuentes historicas contemporaneas muestran ademas retrasos e incertidumbres tecnicas en la propuesta Cergy-La Defense.
causas_alternativas:
  - choque petrolero y desventaja de variantes propulsadas por hidrocarburos
  - necesidad de infraestructura dedicada
  - madurez y compatibilidad de la alternativa ferroviaria TGV
  - retrasos de puesta a punto del motor lineal y su control para la linea proyectada
camino_que_lo_desplazo_si_existe: TGV electrico sobre tecnologia rueda-riel
