    titulo: "К пятидесятилетию ЭВМ «Сетунь 70»"
    tipo: "proceedings SoRuCom-2020 / historia tecnica"
    fecha: "2020"
nivel_evidencia: A
datos_cuantitativos:
  - "50 Setun fabricadas; 30 adquiridas por universidades y escuelas tecnicas"
  - "produccion seriada 1961-1965"
  - "fuente historica del proyecto reporta reemplazo binario de rendimiento comparable a >2.5x el precio"
limitaciones:
  - "la implementacion original no permite inferir ventaja universal del ternario frente al binario"
  - "las afirmaciones economicas y sobre oposicion institucional provienen en parte de participantes del proyecto"
contradicciones:
  - "no fue un callejon totalmente muerto: Setun-70 continuo la arquitectura y DSSP preservo ideas sobre hardware binario"
  - "la narrativa de que fracaso tecnicamente contradice las pruebas oficiales y la produccion/uso documentados"
incertidumbres:
