  - "costo de prototipo: 15 millones de yenes de la epoca"
  - "memoria inicialmente 32 palabras, ampliada a 256 palabras de 40 bits"
  - "suma 1,350 microsegundos; multiplicacion 6,800 microsegundos; division 26.1 ms"
