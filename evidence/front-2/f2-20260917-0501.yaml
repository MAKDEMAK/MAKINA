tema_objeto: memoria magnetica no volatil de dominios moviles
afirmacion_principal: La memoria de burbujas fue una via comercial real hacia almacenamiento no volatil y sin partes moviles; alcanzo productos de 1 Mbit, pero fue desplazada como memoria general por discos y memorias semiconductoras que mejoraron mas rapido.
nombre_proyecto_o_artefacto: Magnetic Bubble Memory / Intel 7110
periodo_historico: 1967-1980s
pais_contexto: Estados Unidos, con desarrollo internacional
disciplina: almacenamiento magnetico y computacion
problema_original: Conseguir memoria no volatil de alta densidad y sin mecanismos rotatorios.
principio_tecnico: Cada bit es un dominio magnetico cilindrico estable en una pelicula de granate; un campo magnetico rotatorio desplaza secuencialmente los dominios por patrones de propagacion hasta puntos de lectura y escritura.
estado_historico: sustitucion_con_continuidad_de_nicho
resultado_real_alcanzado: Texas Instruments comercializo memoria de burbujas en 1977. Intel introdujo el 7110 de 1048576 bits en 1979; su manual especifica burbujas de 2.7 um, 50 kHz de desplazamiento y unos 40 ms de acceso aleatorio medio de pagina. Intel tambien vendio placas iSBC 254 de hasta 512 KB.
causa_documentada: El Computer History Museum documenta que, pese a una inversion estimada de mil millones de dolares en investigacion, la tecnologia fue eclipsada durante los anos 1980 por discos duros y RAM semiconductor.
causas_alternativas:
  - La arquitectura serial imponia latencia.
  - El sistema exigia bobinas, campo rotatorio y circuiteria de control.
  - Competidores con mercados mayores siguieron curvas de mejora mas fuertes.
camino_que_lo_desplazo_si_existe: Discos magneticos y memorias semiconductoras; posteriormente flash cubrio gran parte del nicho no volatil de estado solido.
fuentes:
