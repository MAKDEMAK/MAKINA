  - {url: 'https://www.bitsavers.org/components/intel/_dataBooks/1981_Systems_Data_Catalog.pdf', titulo: 'Intel Systems Data Catalog', tipo: catalogo_tecnico_de_epoca, fecha: '1981'}
  - {url: 'https://ntrs.nasa.gov/api/citations/19780015029/downloads/19780015029.pdf', titulo: 'State of the Art in Magnetic Bubble Memories', tipo: informe_institucional_contemporaneo, fecha: '1978'}
nivel_evidencia: A
datos_cuantitativos: {capacidad_7110_bits: 1048576, diametro_burbuja_um: 2.7, shift_rate_kHz: 50, acceso_medio_ms: 40, lectura_pagina_min_ms: 6.5, isbc254_capacidad_max_KB: 512, isbc254_transferencia_max_KB_s: 50, isbc254_potencia_max_W: 35}
limitaciones:
  - Acceso secuencial por desplazamiento de dominios.
  - Necesidad de periferia electronica y magnetica.
  - La robustez mecanica no compenso la evolucion de alternativas.
contradicciones:
  - No fue un simple fracaso; hubo produccion y aplicaciones comerciales reales.
  - Persistio en nichos donde vibracion y fiabilidad mecanica penalizaban al disco.
incertidumbres:
  - La cifra de inversion es una estimacion historica agregada del Computer History Museum.
HECHO_DOCUMENTADO: Existieron productos comerciales TI e Intel; el 7110 fue de 1 Mbit y su documentacion de epoca cuantifica arquitectura y rendimiento.
TESTIMONIO: No usado como soporte principal.
INTERPRETACION: El camino desplazado fue almacenar bits como entidades fisicas moviles en un medio solido, competitivo en robustez pero no en la trayectoria conjunta de coste, velocidad y densidad.
