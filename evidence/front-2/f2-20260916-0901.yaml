tema_objeto: seguimiento dinamico de pista en grabacion magnetica de video
nombre_proyecto_o_artefacto: Philips/Grundig Video 2000 (VCC) - Dynamic Track Following (DTF)
periodo_historico: 1979-1988
pais_contexto: Paises Bajos / Alemania Occidental; mercado principalmente europeo
disciplina: grabacion magnetica; servo-control; electronica de consumo
afirmacion_principal:
  hecho_documentado: Video 2000 implemento seguimiento activo de las pistas de video mediante cabezales montados sobre actuadores piezoelectricos y frecuencias piloto grabadas con la señal, eliminando la necesidad del control manual de tracking y de una pista de control convencional; el sistema llego al mercado pero fue discontinuado tras perder frente a VHS.
  testimonio: Fuentes tecnicas retrospectivas describen DTF como una de las partes mas sofisticadas del formato y senalan que su precision, complejidad y coste contribuyeron a dificultades de fabricacion/compatibilidad.
  interpretacion: El camino tecnico residual es cerrar localmente el lazo entre informacion embebida en el propio medio y posicionamiento fisico del transductor, en vez de depender de una referencia mecanica separada o ajuste manual.
problema_original: mantener automaticamente el cabezal centrado sobre pistas helicoidales muy estrechas y permitir reproduccion estable, incluida busqueda de imagen, sin ajuste manual de tracking.
principio_tecnico: cuatro frecuencias piloto de tracksensing se registran junto al video; la lectura relativa de pistas vecinas genera una senal de error que gobierna actuadores piezoelectricos del cabezal para desplazarlo transversalmente y seguir el centro de la pista.
estado_historico: sustitucion comercial; tecnologia realizada y comercializada, luego discontinuada
resultado_real_alcanzado: grabadores comerciales desde 1979; seguimiento automatico de pista; cassette reversible; hasta 8 h totales en formatos iniciales y posteriormente hasta 16 h con long-play segun modelos; produccion finalizada durante la segunda mitad de los 1980 y distribucion residual hasta 1988.
causa_documentada: entrada tardia frente a VHS/Betamax, costes elevados asociados a la precision del transporte/DTF/electronica, menor ecosistema de equipos y contenido, y problemas de fiabilidad/compatibilidad entre maquinas; Philips y Grundig pasaron a ofrecer VHS.
causas_alternativas:
  - ventaja de red y politica de licencias de VHS
  - distribucion geografica mas limitada de Video 2000
  - catalogo pregrabado menor
camino_que_lo_desplazo_si_existe: VHS, basado en un ecosistema de fabricantes y contenido mas amplio y un sistema de transporte/seguimiento comercialmente mas consolidado
