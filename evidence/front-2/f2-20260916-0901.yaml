limitaciones:
  - DTF exigia tolerancias estrechas, actuacion piezoelectrica y electronica de control compleja.
  - la sofisticacion tecnica no compenso la desventaja de ecosistema y entrada tardia.
  - existieron problemas de compatibilidad entre grabaciones de primeras generaciones Philips/Grundig.
contradicciones:
  - no todos los modelos implementaron exactamente la misma variante de seguimiento; algunas fuentes distinguen DTF y variantes ATF.
  - atribuir el fracaso a una sola causa es inconsistente con la evidencia: coexistieron factores tecnicos, de coste, red de mercado y catalogo.
incertidumbres:
  - la contribucion causal exacta del coste de DTF frente a efectos de red no esta cuantificada de forma comparable en las fuentes consultadas.
  - algunas cifras tecnicas detalladas provienen de reconstrucciones retrospectivas y requieren manual de servicio original para nivel A.
