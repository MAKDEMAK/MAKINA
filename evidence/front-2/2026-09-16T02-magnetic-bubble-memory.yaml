datos_cuantitativos: "La literatura de 1980 discutia reducir diametros de burbuja de 2 a 0.5 um. Un tester de 1980 soportaba chips hasta 512x512 bits y operacion hasta 1 MHz. El trabajo de 1985 proyectaba espaciamiento de 2.5 diametros de burbuja y reportaba tolerancia a defectos demostrada."
limitaciones: "No se localizo en esta ronda una fuente primaria unica que cuantifique el punto exacto de cruce de coste contra DRAM/disco ni una fecha universal de abandono; hubo continuidad especializada."
contradicciones: "TESTIMONIO/INTERPRETACION HISTORICA: llamarla tecnologia 'olvidada' simplifica una trayectoria que incluyo mercado real y trabajo de I+D posterior; en 1981-85 seguia considerandose tecnicamente activa."
incertidumbres: "La importancia relativa de coste, velocidad, latencia, complejidad de drive y mejoras rivales varia por fabricante y aplicacion."
