id: f2-2026-09-16T02-magnetic-bubble-memory
frente: front-2
cycle_id: 2026-09-16T02
tema_objeto: memoria magnetica de dominios moviles
afirmacion_principal: "HECHO DOCUMENTADO: la memoria de burbujas magneticas llevo dominios magneticos no volatiles y desplazables a productos reales; pese a fuerte desarrollo industrial, no se convirtio en memoria universal y fue desplazada economicamente por memorias semiconductoras y discos. INTERPRETACION: el camino no fue un simple fracaso de laboratorio sino una sustitucion de una arquitectura de estado movil en el propio medio magnetico."
nombre_proyecto_o_artefacto: magnetic bubble memory
periodo_historico: "1967-1980s (desarrollo principal; continuidad especializada posterior)"
pais_contexto: "Estados Unidos; Japon; desarrollo internacional"
disciplina: "almacenamiento magnetico; materiales; computacion"
problema_original: "obtener almacenamiento no volatil, denso, sin partes mecanicas moviles y potencialmente competitivo con memoria principal y almacenamiento masivo"
principio_tecnico: "dominios magneticos cilindricos ('burbujas') en peliculas con magnetizacion perpendicular, propagados por campos/patrones magneticos y leidos mediante detectores magneticos"
estado_historico: sustitucion
resultado_real_alcanzado: "Se fabricaron y comercializaron dispositivos; hacia 1980 la literatura de Science describia la tecnologia ya introducida en el mercado. La investigacion exploro burbujas de ~2 um hacia 0.5 um y arquitecturas de mayor densidad; en 1985 aun se publicaban prototipos con redes autoestructuradas y tolerancia a defectos demostrada."
causa_documentada: "En 1981 una revision japonesa señalaba que, aunque la densidad por bit superaba a memoria semiconductor, el coste era algo mayor y seguian pendientes reduccion de coste y mejora de velocidad de conmutacion. La historia del Computer History Museum clasifica las memorias bubble entre tecnologias probadas que finalmente perdieron en el mercado."
causas_alternativas: "Competencia simultanea de semiconductores y discos; requisitos de campos/drive y acceso secuencial/latencia; dificultad de escalar materiales, litografia y velocidad. No se atribuye el desplazamiento a una unica causa."
camino_que_lo_desplazo_si_existe: "memorias semiconductoras para memoria electronica y discos magneticos para almacenamiento masivo"
