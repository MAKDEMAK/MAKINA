datos_cuantitativos:
  - '250 NOR requeridos; 280 elementos instalados'
  - 'palabra: 4 bits; memoria: 4 palabras de 4 bits; 4 instrucciones'
  - 'reloj nominal FLODAC: 10 ciclos/s; circuitos compactos similares: hasta 250 ciclos/s'
  - 'conmutacion y propagacion: orden de 1 ms; propagacion ~1 ms/pie'
  - 'recuperacion de presion promedio ~30%; minimo aceptado 28%; ganancia minima 1.6'
  - 'presion de alimentacion: 20 pulgadas de agua (~0.8 psi)'
limitaciones: >-
  FLODAC fue deliberadamente pequeno y demostrativo; no prueba escalabilidad economica a memoria o
  programas grandes. Las ventajas de coste y fiabilidad de 1964 eran en parte estimaciones o
  expectativas y no deben tratarse como ventajas comerciales demostradas.
contradicciones: >-
  La narrativa de que la fluidica simplemente fracaso es incorrecta: el propio equipo delimitaba
  aplicaciones donde la velocidad era suficiente y la tecnologia continuo en controles especiales.
  Por tanto, el abandono corresponde principalmente a computacion digital general, no al principio
  fluidico completo.
incertidumbres: >-
  No se encontro en esta ronda una decision corporativa primaria de UNIVAC que documente una fecha
  unica de cancelacion de FLODAC ni una comparacion economica posterior que aisle causalmente cada
  factor del no escalado.
