tema_objeto: logica digital por oscilacion parametrica
nombre_proyecto_o_artefacto: Parametron / PC-1
periodo_historico: 1954-1960s
pais_contexto: Japon
disciplina: computacion digital / electronica magnetica
afirmacion_principal: >-
  El parametron fue una familia real y comercial de logica digital japonesa basada en
  oscilacion parametrica; alcanzo computadores de proposito general y otras aplicaciones,
  pero fue sustituido rapidamente por transistores al quedar limitado en frecuencia,
  potencia y amplitud de aplicaciones.
problema_original: >-
  Construir logica y memoria digital fiable y economica cuando tubos y transistores
  tempranos eran costosos o poco fiables.
principio_tecnico: >-
  Un resonador LC con reactancia no lineal excitado aproximadamente a 2f oscila a f en
  uno de dos estados de fase separados por pi; esas fases codifican bits. Acoplamientos
  entre parametrons realizan retardo/memoria, NOT y logica mayoritaria de la que se
  derivan AND/OR.
estado_historico: sustitucion
resultado_real_alcanzado: >-
  HECHO DOCUMENTADO: Goto publico el principio en 1959. El PC-1 de la Universidad de
  Tokio fue completado en 1958 y uso 4200 parametrons, memoria de 512 palabras cortas,
  suma/resta de 0.4 ms, multiplicacion de 36 bits de 4.4 ms y division de 16.1 ms.
  La IPSJ documenta multiples computadores comerciales japoneses basados en parametrons;
  Fujitsu entrego el FACOM 212 y lo exporto a Filipinas en 1963.
causa_documentada: >-
  La IPSJ atribuye el fin del desarrollo a que los parametrons eran mas lentos y
  consumian mas potencia que los computadores de transistores, tenian un techo de
  mejora y perdieron su ventaja cuando aumento la fiabilidad del transistor.
causas_alternativas: >-
  INTERPRETACION HISTORICA respaldada por IEEE Milestone: el transistor servia ademas
  para radio y circuitos analogicos, atrayendo una base de inversion en I+D mucho mayor;
  por tanto la sustitucion no fue solo una comparacion aislada de velocidad.
camino_que_lo_desplazo_si_existe: logica digital basada en transistores de union
