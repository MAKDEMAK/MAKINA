limitaciones: >-
  Frecuencia operativa baja frente a transistores posteriores; consumo elevado a escala
  de computador; resonadores requieren excitacion sincronizada y ajuste; elemento
  especializado principalmente en logica.
contradicciones: >-
  No fue un prototipo marginal ni un fracaso inmediato: existieron multiples productos
  comerciales y hacia 1959 Goto reportaba parametrons en cerca de la mitad de los
  computadores electronicos japoneses en operacion. Tampoco el principio desaparecio
  conceptualmente: osciladores parametricos posteriores reutilizaron estados de fase,
  aunque eso no constituye continuidad comercial directa del parametron original.
incertidumbres: >-
  Las cifras agregadas de cuota y ventas de modelos comerciales provienen de fuentes
  historicas retrospectivas y no se usan aqui como medida exacta de mercado.
