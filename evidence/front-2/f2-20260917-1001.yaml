separacion_epistemica:
  hecho_documentado: >-
    El principio, PC-1 y computadores comerciales existieron y estan documentados por
    el paper original, IPSJ, Fujitsu e IEEE.
  testimonio: >-
    La evaluacion contemporanea de Goto describia al parametron como robusto, estable,
    durable y barato, y reportaba amplia adopcion japonesa en 1959.
  interpretacion: >-
    La trayectoria se clasifica como sustitucion tecnologica: una alternativa funcional
    y comercial perdio frente a una plataforma transistor que mejoro mas rapido y tenia
    un espacio de aplicaciones e inversion mayor.
