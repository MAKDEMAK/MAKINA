datos_cuantitativos: "Construido en 1950 con aproximadamente USD 700 en excedentes de la Segunda Guerra Mundial; CHM destaca consumo inferior al de una tostadora."
limitaciones: "El caso Nordsieck es una instancia especifica de una familia analogica mayor; la evidencia de desplazamiento corresponde en parte a la trayectoria general de la computacion analogica."
contradicciones: "No fue abandonado por inviabilidad inmediata: su bajo costo y simplicidad eran precisamente ventajas; el desplazamiento ocurrio por mejora relativa de la via digital."
incertidumbres: "No se determino en esta ronda numero de unidades fabricadas ni fecha exacta de ultimo uso."
