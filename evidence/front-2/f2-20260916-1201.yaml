tema_objeto: videotex gráfico interactivo sobre redes de telecomunicación existentes
afirmacion_principal: >-
  Telidon fue un camino canadiense de videotex de segunda generación que intentó convertir televisores y enlaces de telecomunicación existentes en terminales gráficos interactivos. Existió en prototipos, ensayos de campo y despliegues comerciales, y su lenguaje gráfico sobrevivió parcialmente como NAPLPS, pero el programa Telidon como plataforma integrada no alcanzó masa crítica y el apoyo federal terminó en 1985.
nombre_proyecto_o_artefacto: Telidon
periodo_historico: 1978-1985
pais_contexto: Canadá
disciplina: telecomunicaciones; videotex; gráficos por computador; interfaces
problema_original: >-
  Proporcionar acceso bidireccional doméstico a bases de datos, información y comandos mediante un televisor modificado y enlaces como teléfono, cable, fibra, radiodifusión o satélite, con gráficos 2D más expresivos que los sistemas videotex basados en mosaicos de caracteres.
principio_tecnico: >-
  Descripción gráfica independiente del dispositivo mediante Picture Description Instructions: en vez de transmitir una imagen raster completa, el enlace transporta primitivas/instrucciones geométricas que el terminal interpreta y rasteriza localmente. La arquitectura separaba base de datos/host, enlace de telecomunicación y decodificador/pantalla.
estado_historico: sustitucion_y_absorcion_parcial
resultado_real_alcanzado: >-
  HECHO DOCUMENTADO: el Department of Communications lo convirtió en un programa nacional; existieron múltiples ensayos y sistemas comerciales. El informe anual 1980-81 del departamento enumeraba 14 proyectos canadienses anunciados y esperaba 20 sistemas operativos a comienzos de 1983. El Auditor General documentó en 1983 que Telidon era un programa principal del Research Sector, iniciado como programa de cuatro años en abril de 1979. La sintaxis evolucionó hacia el estándar norteamericano NAPLPS y tuvo usos posteriores fuera del programa Telidon.
causa_documentada: >-
  HECHO DOCUMENTADO: el Auditor General constató en 1983 deficiencias de planificación/evaluación: el plan de 1979 fue abandonado tras aproximadamente dos meses por cambios rápidos, un sistema de planificación propuesto en 1981 nunca se utilizó y aún no se había evaluado si el programa cumplía sus objetivos. Evidencia histórica posterior documenta que los terminales/equipos auxiliares permanecieron caros, los servicios no lograron una estructura de precios sostenible ni masa crítica, y el apoyo federal terminó el 31 de marzo de 1985.
causas_alternativas:
  - INTERPRETACION: la rápida caída del coste y aumento de capacidad de los computadores personales redujo la ventaja de un decodificador videotex dedicado.
  - INTERPRETACION: el problema no fue únicamente técnico; dependía simultáneamente de terminales, operadores de red, proveedores de información y una economía de servicio viable.
camino_que_lo_desplazo_si_existe: >-
  Computadores personales y servicios online de propósito general; posteriormente Internet/Web. Parte del principio de presentación sobrevivió de forma absorbida en NAPLPS y en usos de señalización/BBS, por lo que no corresponde clasificarlo como fracaso técnico total.
