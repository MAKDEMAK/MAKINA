datos_cuantitativos:
  - "Programa inicial: CAD 9 millones por cuatro años desde abril de 1979."
  - "Presupuesto acumulado previsto del Department of Communications al cierre de 1985: CAD 59,3 millones."
  - "Plan 1980-81: compra pública de aproximadamente 6.000 terminales para préstamo a industria."
  - "14 proyectos Telidon anunciados en Canadá; expectativa contemporánea de 20 sistemas operativos a comienzos de 1983."
limitaciones:
  - Las cifras de expansión del informe 1980-81 eran planes/expectativas, no adopción final demostrada.
  - No se atribuye el cierre a una sola causa porque confluyeron economía de terminal, contenido, mercado, gobernanza del programa y competencia tecnológica.
contradicciones:
  - La narrativa de que Telidon simplemente fracasó oculta que su sintaxis gráfica fue estandarizada como NAPLPS y continuó en otros sistemas.
  - El optimismo oficial contemporáneo sobre expansión contrasta con la auditoría de 1983, que señalaba ausencia de evaluación formal de cumplimiento de objetivos.
incertidumbres:
  - No se encontró en esta ronda una evaluación federal final de 1984/1985 que cuantifique causalmente el peso relativo de cada motivo de terminación.
  - La fecha exacta de algunos documentos promocionales reimpresos por IEEE no está explicitada en la página; se conserva la fecha histórica aproximada indicada por el contexto documental.
