nivel_evidencia: A
datos_cuantitativos:
  - "Intel: matriz de 4 Mbit introducida en 1979."
  - "Mercado mundial estimado por Dataquest: USD 8.5M (1979), 22.5M (1980), 49M (1981), 80M (1982), 145M (1983)."
  - "Western Electric: modulo previsto de 272 kbit para 10 s de voz digitalizada."
limitaciones:
  - "mas lenta que RAM semiconductor contemporanea"
  - "la propagacion de burbujas impone acceso secuencial y latencia"
  - "ventaja de ausencia de partes moviles no compenso finalmente coste/velocidad/densidad"
contradicciones:
  - "No fue un prototipo fallido: llego a produccion, mercado y aplicaciones reales."
  - "La narrativa de desaparicion total es excesiva: persistio en nichos donde robustez y ausencia de partes moviles eran valiosas."
incertidumbres:
  - "Las cifras de mercado de 1982-1983 en el informe Dataquest son estimaciones contemporaneas, no necesariamente ventas finales realizadas."
etiquetas_neutrales: [memoria_magnetica, dominios_moviles, almacenamiento_no_volatil, estado_solido, acceso_secuencial, sustitucion]
hecho_documentado: "Bell Labs exploro la tecnologia desde fines de los 1960; multiples fabricantes invirtieron fuertemente; existieron chips, lineas de produccion y usos comerciales; en los 1980 fue eclipsada por discos y memoria semiconductor."
testimonio: "La prensa tecnica y publicidad de epoca promovian la robustez frente a discos; fuentes institucionales posteriores confirman que esa ventaja existia pero no basto comercialmente."
interpretacion: "El principio tecnico que quedo reducido fue almacenamiento no volatil mediante transporte controlado de estados magneticos discretos dentro de un medio solido, sin desplazar fisicamente el soporte completo."
