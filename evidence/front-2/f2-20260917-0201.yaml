id: f2-20260917-0201
frente: front-2
cycle_id: 2026-09-17T02
tema_objeto: memoria magnetica de burbujas como almacenamiento solido no volatil
nombre_proyecto_o_artefacto: Magnetic Bubble Memory
periodo_historico: "1967-1980s"
pais_contexto: "Estados Unidos; desarrollo y comercializacion internacional"
disciplina: "memoria y almacenamiento magnetico"
afirmacion_principal: "La memoria de burbujas magneticas constituyo una via comercial real hacia almacenamiento no volatil sin partes mecanicas: dominios magneticos moviles almacenaban bits y se desplazaban por una pelicula magnetica. Tras fuerte inversion y productos comerciales, fue desplazada durante los anos 1980 por discos y memorias semiconductoras mas baratas, rapidas y densas, sobreviviendo temporalmente en nichos de robustez."
problema_original: "obtener almacenamiento no volatil, robusto y sin mecanismos rotatorios, con potencial para sustituir discos/cintas en aplicaciones de alta fiabilidad"
principio_tecnico: "pequenos dominios magnetizados de polaridad opuesta ('burbujas') permanecen estables en una pelicula magnetica bajo bias y son desplazados secuencialmente mediante campos/caminos magneticos para escritura, transporte y lectura de bits"
estado_historico: sustitucion
resultado_real_alcanzado:
  - "Intel introdujo una matriz comercial de 4 Mbit en 1979; el ejemplar documentado por CHM contiene cuatro unidades de 1 Mbit."
  - "Hubo uso comercial en videojuegos, controladores de maquinas y equipos robustos; GRiD Compass incorporo 384 KB de bubble memory."
  - "Western Electric puso en operacion una linea de produccion en 1976 y proyecto modulos de 272 kbit para 10 s de voz digitalizada."
causa_documentada: "memorias semiconductoras y discos evolucionaron hacia menor coste, mayor velocidad y mayor densidad; CHM documenta que esas alternativas volvieron obsoleta la tecnologia"
causas_alternativas:
  - "acceso inherentemente secuencial/por propagacion, mas cercano a cinta o disco que a RAM"
  - "complejidad magnetica y termica; implementaciones comerciales podian generar calor"
camino_que_lo_desplazo_si_existe: "RAM/almacenamiento semiconductor de mayor velocidad y densidad, junto con discos magneticos cada vez mas compactos y economicos"
