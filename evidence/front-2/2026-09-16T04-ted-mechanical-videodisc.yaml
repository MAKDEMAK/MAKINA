id: f2-2026-09-16T04-ted-mechanical-videodisc
frente: front-2
cycle_id: 2026-09-16T04
tema_objeto: videodisco mecánico de alta densidad
nombre_proyecto_o_artefacto: TeD (Television Electronic Disc / Teldec Television Disc)
periodo_historico: 1970-1978
pais_contexto: Alemania Occidental / Reino Unido; licencias posteriores en Japón
disciplina: almacenamiento audiovisual; mecánica de precisión; electrónica de consumo
afirmacion_principal: >-
  HECHO DOCUMENTADO: Telefunken/Teldec llevó a mercado un videodisco analógico flexible leído mecánicamente: surcos verticales de alta densidad, lectura por estilete/pickup piezoeléctrico y disco girando sobre colchón de aire. Llegó a distribución comercial en 1975, pero su límite de unos 10 minutos por disco, problemas técnicos y un ecosistema de software reducido quedaron rápidamente desplazados por videocassette; para 1978 Telefunken había adoptado VHS. No fue sólo concepto ni prototipo.
problema_original: almacenar y distribuir vídeo doméstico pregrabado en un soporte prensable similar al disco fonográfico
principio_tecnico: >-
  Modulación vertical (hill-and-dale) extremadamente densa en lámina plástica flexible; rotación rápida sobre colchón de aire y transducción mecánico-eléctrica mediante estilete/pickup piezoeléctrico. La alta velocidad lineal elevaba el ancho de banda disponible hasta escala de vídeo.
estado_historico: sustitucion
resultado_real_alcanzado: >-
  Anunciado públicamente en 1970 y comercializado en Alemania Occidental desde marzo de 1975. En los primeros tres meses se distribuyeron aproximadamente 6000 reproductores a 2500 distribuidores y había unas 50000 unidades de discos en tiendas. Sanyo y General obtuvieron licencias japonesas; Sanyo desarrolló un cambiador automático de 12 discos. El sistema no escaló como estándar doméstico.
causa_documentada: >-
  Reproducción limitada a aproximadamente 10 minutos por disco, problemas técnicos/fragilidad de la base mecánica y mercado de programas insuficiente; simultáneamente videocassette ofrecía grabación doméstica y duraciones aptas para programas/películas completos.
causas_alternativas:
  - La llegada comercial tardía respecto del largo desarrollo iniciado antes de 1970 redujo la ventana competitiva.
  - El autocambiador mitigaba duración pero aumentaba complejidad y no eliminaba la desventaja frente a cinta.
camino_que_lo_desplazo_si_existe: videocassette, especialmente VHS y Betamax; posteriormente videodisco óptico
