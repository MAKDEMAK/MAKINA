nivel_evidencia: A
datos_cuantitativos:
  - disco flexible: 8 pulgadas / ~21 cm en versión comercial
  - velocidad PAL: ~1500 rpm
  - reproducción comercial: ~10 min por disco
  - mercado inicial: ~6000 reproductores enviados a ~2500 distribuidores y ~50000 discos en tiendas durante los primeros tres meses
  - precio inicial reportado: justo bajo DM1500; discos desde DM10
  - prototipo de autocambiador: 12 discos de 10 min
limitaciones:
  - El soporte era sólo reproducción; no ofrecía grabación doméstica.
  - La duración obligaba a múltiples discos/cambios para contenido largo.
  - La lectura mecánica de vídeo exigía alta precisión y era sensible a problemas del soporte y mecanismo.
contradicciones:
  - La narrativa de fracaso inmediato simplifica demasiado: existió producto comercial, distribución significativa inicial, licencias internacionales y desarrollo de autocambiador.
  - Las fuentes difieren en detalles de diámetro/velocidad entre prototipos PAL/NTSC; las cifras se mantienen ligadas a la configuración descrita por cada fuente.
incertidumbres:
  - No se localizó en esta ronda una cifra primaria consolidada de ventas finales al consumidor ni una fecha única formal de cancelación; la adopción de VHS por Telefunken a fines de 1978 fija un límite práctico.
etiquetas_neutrales: [videodisco, almacenamiento_analogico, transduccion_piezoelectrica, lectura_mecanica, colchón_de_aire, sustitucion]
separacion_epistemica:
  hecho_documentado: El sistema fue fabricado, comercializado y licenciado; usó lectura mecánica de surco vertical sobre disco flexible en colchón de aire.
  testimonio: La prensa técnica de 1977 describía aceptación pública poco espectacular pese a calidad de imagen demostrada como muy buena.
  interpretacion: El principio de obtener ancho de banda de vídeo mediante velocidad lineal y densidad mecánica funcionó, pero la arquitectura de soporte impuso una duración/operación peor que la trayectoria videocassette.
