limitaciones:
  - "La configuracion dependia de una correspondencia fisica entre parametros del problema y componentes hidraulicos."
  - "Las primeras versiones eran especificas para problemas concretos; la modularidad posterior redujo esta limitacion."
  - "No se encontro en esta ronda una fuente primaria de fabrica que cuantifique volumen total de produccion, error numerico o coste."
contradicciones:
  - "La narrativa popular lo presenta a veces como curiosidad o prototipo aislado; la evidencia de produccion seriada, exportacion y uso durante decadas contradice esa caracterizacion."
incertidumbres:
  - "No se pudo atribuir cuantitativamente el abandono a coste, velocidad, precision o mantenimiento por separado."
  - "La fecha exacta del ultimo uso operacional no esta establecida por las fuentes consultadas."
