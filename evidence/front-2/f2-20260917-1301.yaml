    tipo: fuente institucional, Moscow State University
    fecha: desconocida
nivel_evidencia: A
datos_cuantitativos:
  - 50 computadores producidos en total segun la retrospectiva del equipo.
  - 30 instalados en universidades/colegios; restantes en laboratorios y plantas.
  - Memoria caracteristica documentada en fuentes historicas: 81 palabras de 18 trits y 1944 palabras en tambor magnetico.
  - La retrospectiva afirma que el reemplazo binario de prestaciones comparables costo mas de 2.5 veces el Setun.
limitaciones:
  - El hardware de finales de los anos 1950 no permite extrapolar competitividad a tecnologias posteriores.
  - Parte de la memoria secundaria representaba estados ternarios sobre soporte magnetico que no materializaba necesariamente tres estados fisicos independientes por celda.
contradicciones:
  - La narrativa de que Setun fue detenido por ser demasiado barato es mas fuerte que lo que permiten afirmar las fuentes institucionales verificadas; se conserva solo la oposicion industrial y la sustitucion documentadas.
  - La linea ternaria no desaparecio inmediatamente: Setun-70 y posteriormente DSSP continuaron aspectos arquitectonicos y de programacion.
incertidumbres:
  - No se localizaron en esta ronda archivos administrativos de la planta de Kazan o del ministerio que permitan aislar una unica causa formal de cancelacion.
  - Las cifras de demanda pendiente y comparacion exacta de costes dependen principalmente del relato retrospectivo del equipo.
