afirmacion_principal: "HECHO: una interfaz gel-gel confinada en microporos permite integrar memoria ionica temporal, plasticidad sinaptica y modulacion quimica en una matriz 10x10; INTERPRETACION: la capacidad materialmente relevante es hacer computacion neuromorfica escalable con transporte ionico en un medio blando, no solo emular un memristor aislado."
