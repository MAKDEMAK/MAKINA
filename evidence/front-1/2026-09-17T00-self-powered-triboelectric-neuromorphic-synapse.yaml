id: f1-20260917-0002
frente: front-1
cycle_id: 2026-09-17T00
tema_objeto: sinapsis neuromorfica flexible autoalimentada por tacto
afirmacion_principal: "HECHO: un transistor de grafeno con compuerta ion-gel, accionado directamente por nanogeneradores triboelectricos P(VDF-TrFE), convierte contacto mecanico en pulsos que modifican conductancia sin bateria externa y demuestra memoria temporal multiescala y plasticidad dependiente de frecuencia. INTERPRETACION: sensado, cosecha de energia y actualizacion de estado analogico pueden colocalizarse de modo que el propio estimulo aporte tanto informacion como energia de escritura."
capacidad_nueva: "sensar tacto y actualizar un peso sinaptico analogico usando directamente la energia del estimulo mecanico, con memoria de distintas escalas temporales"
mecanismo_o_principio: "electrificacion triboelectrica genera pulsos pre/post-sinapticos; estos desplazan iones del ion-gel y modulan la conductancia del canal de grafeno, produciendo plasticidad y decaimiento temporal"
dominio: "neuromorfica; materiales flexibles; sensado autoalimentado; memoria analogica"
fuentes:
