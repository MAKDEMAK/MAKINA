  ruido_alto: ">75% en el benchmark reportado"
  flexion: "operacion reportada bajo 1.1 MPa de esfuerzo de flexion"
condiciones_de_prueba: "dispositivo flexible sobre PET; pulsos triboelectricos de contacto alimentan directamente la modulacion sinaptica; perfiles de actualizacion medidos se trasladan posteriormente a un perceptron para evaluar reconocimiento de seis clases"
requiere_computacion_digital: opcional
requiere_alimentacion: parcial
tipo_de_sensado: "tactil triboelectrico"
tipo_de_memoria_o_estado: "conductancia analogica ionica/electrostatica con decaimiento multiescala"
tipo_de_adaptacion: "plasticidad dependiente de tasa de spikes; potenciacion/depresion"
tipo_de_actuacion: "modulacion de corriente postsinaptica"
madurez_tecnica: "prototipo experimental de dispositivo; benchmark de reconocimiento parcialmente evaluado fuera del dispositivo"
limitaciones:
  - "la demostracion >88% no es una red clasificadora completa ejecutada fisicamente en el dispositivo; usa kernels LTP/LTD medidos dentro de un perceptron"
  - "la autoalimentacion se refiere a los eventos sinapticos/tactiles; la instrumentacion de lectura y el benchmark de red no son battery-free end-to-end"
  - "memoria denominada long-term en el experimento es >2 s, no retencion no volatil"
contradicciones:
  - "el articulo usa lenguaje de system-level relevance y real-time on-body computation, pero la clasificacion reportada incorpora perfiles de hardware en un modelo de perceptron; debe evitarse interpretarla como inferencia completamente fisica"
etiquetas_neutrales: [triboelectric, ion-gel, graphene, neuromorphic, self-powered, tactile, analog-memory, rate-coded-plasticity]
