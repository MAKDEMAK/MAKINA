hipotesis: "La colocalizacion de transduccion y memoria podria reducir conversiones y alimentacion auxiliar; no se cuantifica aqui ahorro end-to-end."
interpretacion: "La capacidad relevante no es el reconocimiento de actividad por si solo, sino que un estimulo mecanico puede simultaneamente energizar, codificar y modificar estado sinaptico local sin acondicionamiento externo de potencia."