datos_cuantitativos: "7378 neuronas monoliticas; 7.45 s retencion; dinamica GHz; sistema multicapa de 10 nucleos; 61.87 aJ/operacion reportados a nivel de sistema en demostracion de navegacion."
condiciones_de_prueba: chip fotonico monolitico y sistema multicapa de diez nucleos; demostracion end-to-end de vision/navegacion
