tema_objeto: neuronas fotonicas con memoria corta y larga integrada
afirmacion_principal:
  HECHO: "FLARE integra sensado, procesamiento y memoria en neuronas fotonicas reconfigurables; un chip monolitico de 7378 neuronas retuvo memoria de largo plazo 7.45 s mientras preservo dinamica de corto plazo en GHz."
  HIPOTESIS: "La coexistencia de escalas temporales de memoria en el mismo nodo puede reducir movimientos de datos en redes fisicas profundas."
  INTERPRETACION: "Es una mejora material de capacidad porque memoria sensorial/intermedia deja de depender exclusivamente de memoria digital externa."
capacidad_nueva: computacion fotonica profunda totalmente in-memory con memoria temporal multiescala
mecanismo_o_principio: acoplamiento fotonico-electronico en neuronas reconfigurables que mantienen estados de memoria de corto y largo plazo
