tipo_de_actuacion: modulación de corriente/conductancia
madurez_tecnica: demostración experimental de dispositivo y sistema RC de laboratorio
limitaciones: "El artículo demuestra benchmarks de reconocimiento/predicción, no un sistema autónomo de propósito general. La cifra energética corresponde al evento del dispositivo y no necesariamente al consumo total de adquisición, codificación y readout."
contradicciones: "INTERPRETACIÓN: homogeneidad de dispositivo reduce heterogeneidad de fabricación, pero no equivale a eliminar periféricos o cómputo digital del sistema completo."
