tipo_de_actuacion: propulsion_fototermica_y_direccionamiento_laser
madurez_tecnica: prueba_de_principio_experimental
limitaciones: "montaje complejo con laser, microscopia y feedback digital; no supera reservorios fisicos maduros; desempeño sensible al espaciamiento y damping"
contradicciones: "El propio paper advierte que la implementacion activada por laser puede no ser practicamente aplicable."
