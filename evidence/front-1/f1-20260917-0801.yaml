nivel_evidencia: A
datos_cuantitativos: "La fuente primaria accesible confirma experimentos y reprogramacion, pero el resumen publico no expone metricas suficientes para registrar precision, numero de niveles o ciclos sin extrapolar del suplemento."
condiciones_de_prueba: "prototipos mecanicos multestables sometidos a compresion uniaxial; secuencias configuradas mediante distribucion de rigidez y activacion/desactivacion selectiva de unidades"
requiere_computacion_digital: no
requiere_alimentacion: parcial
tipo_de_sensado: "entrada mecanica continua codificada por umbrales de inestabilidad"
tipo_de_memoria_o_estado: "estados multestables y configuracion estructural de unidades activas/inactivas"
tipo_de_adaptacion: "reprogramacion fisica in situ; no aprendizaje autonomo demostrado"
tipo_de_actuacion: "compresion uniaxial y transiciones snap-through"
madurez_tecnica: "demostracion experimental de laboratorio; no se demuestra escalado industrial ni operacion autonoma prolongada"
limitaciones:
  - "requiere carga mecanica para operar; cero computacion digital no implica cero energia mecanica"
  - "el resumen primario accesible no cuantifica aqui precision ADC, durabilidad o tolerancia a variaciones de fabricacion"
  - "reprogramable no equivale a autoaprendizaje: la configuracion es seleccionada externamente"
contradicciones:
  - "la literatura previa ya demuestra logica mecanica reprogramable y procesamiento secuencial; la novedad defendible es la integracion experimental de entrada continua, codificacion digital y reprogramacion secuencial en un mismo sistema, no la invencion de la logica mecanica"
etiquetas_neutrales: [multistabilidad, snap_through, diseno_inverso, ADC_mecanico, logica_reprogramable, computacion_sin_digital]
