nivel_evidencia: A
datos_cuantitativos: "98.05% MNIST; 87.85% Fashion-MNIST; 90.12% BreaKHis; 77.7% BreaKHis con 10 imagenes de entrenamiento; HAM10k DICE 84.49%, Jaccard 74.80%; prototipo ~150 um; throughput de medicion reportado hasta 100 Hz para esquema de una capa."
condiciones_de_prueba: "Benchmarks de imagen MNIST, Fashion-MNIST, BreaKHis y HAM10k; comparaciones few-shot y desbalanceadas contra modelos software; lectura hiperespectral y clasificador lineal/logistico posterior."
requiere_computacion_digital: si
requiere_alimentacion: si
tipo_de_sensado: optico / hiperespectral
tipo_de_memoria_o_estado: estado dinamico optico; no se demuestra memoria no volatil intrinseca
tipo_de_adaptacion: pesos de lectura entrenados digitalmente; respuesta fisica fija/heterogenea
tipo_de_actuacion: emision laser multimodo
madurez_tecnica: demostracion experimental de laboratorio
limitaciones: "La cadena no es totalmente fotonica: seleccion de rasgos, binning y regresion final son digitales; parte de la seleccion de regiones de deteccion fue manual; benchmarks pequenos/medianos y montaje de laboratorio; no se aporta aqui comparacion completa de energia extremo-a-extremo."
contradicciones: "El trabajo atribuye ventaja few-shot a alta dimensionalidad y heterogeneidad no lineal, pero esa explicacion es mecanistica/interpretativa y no demuestra causalidad exclusiva; software con augmentacion y fine-tuning puede superar algunos resultados aunque con pasos adicionales."
