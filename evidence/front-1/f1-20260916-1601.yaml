datos_cuantitativos: "El resumen accesible confirma estudio de topologia, geometria, actuacion, tension axial y estrategias de reduccion de readouts, pero no expone cifras comparables de error/capacidad; no se inventan valores."
condiciones_de_prueba: "Simulaciones con modelos de barras de Cosserat y validacion experimental mediante prototipo fisico de red de fibras; se variaron diseno/condiciones de operacion y numero/ubicacion de salidas medidas."
