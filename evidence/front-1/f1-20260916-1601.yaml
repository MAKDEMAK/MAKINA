tema_objeto: red de fibras complaciente como reservorio mecanico
afirmacion_principal:
  HECHO: "Una red fisica de fibras estructuradas puede realizar transformacion no lineal y retener historia de entrada mediante su dinamica mecanica; el trabajo fue validado con un prototipo fisico ademas de simulaciones."
  HIPOTESIS: "La topologia, geometria, tension axial y seleccion de puntos de lectura permiten ajustar la capacidad computacional de redes mecanicas distribuidas."
  INTERPRETACION: "La capacidad emergente relevante es computacion temporal parcialmente encarnada en estructura y dinamica, reduciendo la parte que debe ejecutar un procesador digital."
capacidad_nueva: "procesamiento temporal mecanico distribuido con memoria de entrada y transformacion no lineal en una red de fibras"
mecanismo_o_principio: "physical reservoir computing: la dinamica no lineal y transitoria de una red de filamentos complacientes mapea entradas a estados mecanicos distribuidos; un readout interpreta esos estados"
