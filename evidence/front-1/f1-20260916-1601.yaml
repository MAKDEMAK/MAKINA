limitaciones:
  - "El articulo completo esta bajo acceso restringido; el resumen publico no permite extraer cifras de benchmark sin riesgo de inventarlas."
  - "La lectura de estados y el readout siguen requiriendo instrumentacion y, segun implementacion, computacion externa."
  - "Es demostracion de reservorio fisico, no evidencia de ventaja universal frente a computacion digital convencional."
contradicciones:
  - "El principio de reservoir computing mecanico no es nuevo por si mismo; la novedad material esta en la red de fibras distribuida, su parametrizacion estructural y validacion fisica."
  - "No equivale a computacion sin electronica: la transformacion ocurre mecanicamente, pero medicion/readout pueden ser electronicos."
