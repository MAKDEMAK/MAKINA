tema_objeto: sistema neuromorfico analogico autoalimentado multimodal
afirmacion_principal: "HECHO: sensores y memristores difusivos/de deriva integran sensado, codificacion temporal, aprendizaje no supervisado y memoria en hardware analogico sin circuiteria digital ni alimentacion externa durante la operacion demostrada. HIPOTESIS: la arquitectura podria escalar a fusion sensorial autonoma mas compleja. INTERPRETACION: la capacidad materialmente nueva es cerrar la cadena sensado->spikes->plasticidad->memoria usando la energia del propio estimulo."
capacidad_nueva: aprendizaje neuromorfico multimodal analogico y autoalimentado
mecanismo_o_principio: "Memristores difusivos Ag/SiO2 realizan conmutacion volatil dependiente del tiempo por deriva/difusion ionica y codifican amplitud/temporalidad en latencia de spike; memristores de deriva Ta/HfO2/Pt almacenan pesos no volatiles mediante migracion de vacancias de oxigeno. Sensores fotovoltaicos/piezoelectricos aportan simultaneamente señal y energia."
dominio: neuromorfica_analogica_memristiva
