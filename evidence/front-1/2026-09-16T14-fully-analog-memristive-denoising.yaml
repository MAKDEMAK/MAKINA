tema_objeto: denoising neuromorfico completamente analogico con memoria y computacion homogeneas
afirmacion_principal: "HECHO: una arquitectura experimental basada en RRAM usa nucleos memristivos homogeneos tanto como almacenamiento temporal analogico como para computacion neuronal, manteniendo el flujo de procesamiento en dominio analogico y evitando buffers analogicos separados de gran area."
capacidad_nueva: "Procesar y reducir ruido en señales dentro de una ruta analogica continua usando el mismo tipo de dispositivo resistivo para memoria temporal y operaciones de red neuronal."
mecanismo_o_principio: "Las conductancias de matrices RRAM 32x32 representan estados/pesos; nucleos homogeneos implementan memoria temporal y multiply-accumulate analogico, inspirados funcionalmente en memoria episodica."
dominio: [computacion_analogica, compute_in_memory, neuromorfica, memristores]
fuentes:
  - url: "https://doi.org/10.1002/aisy.70419"
    titulo: "Neuromorphic Denoising with Fully Analog Memristive In-Memory Computing"
    tipo: paper_experimental
    fecha: 2026-05-18
nivel_evidencia: A
datos_cuantitativos:
  array_RRAM: "32x32"
  mejora_eficiencia_potencia: "1.849-3.002x frente a trabajos analogicos de redes neuronales comparados por los autores"
  reduccion_buffer_analogico_on_chip: "2.98-27.66x"
  mejora_eficiencia_area: "3.12x"
condiciones_de_prueba: "Demostracion experimental de sistema de denoising neuromorfico con matrices RRAM y circuiteria analogica de interfaz; las comparaciones de eficiencia dependen de los baselines seleccionados en el paper."
