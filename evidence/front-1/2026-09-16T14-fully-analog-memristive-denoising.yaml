separacion_epistemica:
  HECHO: "Se construyo experimentalmente un sistema de denoising analogico con nucleos memristivos homogeneos para almacenamiento temporal y computacion; se reportan las mejoras cuantitativas indicadas."
  HIPOTESIS: "La homogeneidad del sustrato podria reducir conversiones y movimiento de datos en otras cadenas post-sensado."
