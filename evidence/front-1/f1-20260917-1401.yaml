tema_objeto: reservorio fotonico en cristal organico con acoplamiento spin-orbita
afirmacion_principal:
  HECHO: "La interferencia en un resonador-guia de onda de cristal organico BPDBNA separa patrones opticos; al leer tambien grados de libertad de polarizacion habilitados por acoplamiento spin-orbita, aumenta la dimensionalidad de salida del reservorio."
  HIPOTESIS: "La ingenieria de grados de libertad spin-orbita puede ser una via general para elevar dimensionalidad util de reservorios fotonicos sin ampliar proporcionalmente la red digital de lectura."
  INTERPRETACION: "La capacidad materialmente mejorada es obtener representaciones opticas mas separables usando polarizacion y estructura espacial como dimensiones computacionales fisicas adicionales."
capacidad_nueva: "Expansion fisica de dimensionalidad para clasificacion optica que permite hasta 10x menor red y 3x aceleracion de entrenamiento frente a usar solo intensidad en los simbolos complejos probados."
mecanismo_o_principio: "Interferencia optica en microcavidad/resonador organico; el acoplamiento spin-orbita fotonico mezcla estructura espacial/momento y polarizacion, generando canales de salida adicionales que funcionan como estados del reservorio."
dominio: fotonica_neuromorfica
