  - "La lectura experimental usa instrumentacion optica externa (objetivo, polarizadores/placas de onda, espectrometro/CCD); no se demuestra integracion completa en chip."
  - "No se establece ventaja energetica end-to-end frente a aceleradores digitales."
contradicciones:
