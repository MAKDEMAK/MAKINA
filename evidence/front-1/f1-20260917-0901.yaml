id: f1-20260917-0901
frente: front-1
cycle_id: 2026-09-17T09
tema_objeto: memristor optoelectronico WS2/ZTO como sensor-reservorio
HECHO:
  afirmacion_principal: "Un unico dispositivo WS2/ZTO integra sensado optico, memoria dinamica y computacion temporal por reservoir computing, con operacion demostrada bajo humedad elevada."
  capacidad_nueva: "Decodificacion temporal in-sensor multimodal con memoria volatil/no volatil y computacion en el mismo elemento."
  mecanismo_o_principio: "La fotorespuesta y dinamica memristiva no lineal dependiente de historia del heterodispositivo WS2/ZTO generan estados de reservorio; el encapsulado ZTO estabiliza la respuesta ambiental."
HIPOTESIS: "La co-localizacion fisica de sensado, estado y transformacion temporal puede reducir transferencias de datos frente a cadenas sensor-memoria-procesador separadas; el paper no demuestra esa ventaja a nivel de sistema completo."
INTERPRETACION: "El avance materialmente util es la combinacion experimental de reservoir optoelectronico, sensado y robustez a 95% RH, no solamente una mejora de accuracy."
dominio: [neuromorfica, optoelectronica, physical_reservoir_computing, in_sensor_computing]
fuentes:
