  accuracy_motion: "~93%"
  accuracy_speech: "~89%"
  humedad_probada: "95% RH"
  endurance: ">1.5 millones de ciclos AC"
condiciones_de_prueba: "Tareas N-MNIST, percepcion de movimiento y reconocimiento de habla; entradas convertidas a trenes de spikes; estabilidad evaluada hasta 95% RH."
requiere_computacion_digital: opcional
requiere_alimentacion: si
tipo_de_sensado: optico
tipo_de_memoria_o_estado: "dinamica memristiva volatil y plasticidad de corto/largo plazo"
tipo_de_adaptacion: "respuesta sinaptica dependiente de historia; readout entrenado externamente"
tipo_de_actuacion: electrica/optoelectronica
madurez_tecnica: "demostracion experimental de dispositivo y tareas benchmark; no sistema autonomo desplegado"
limitaciones:
  - "Las tareas de audio y movimiento requieren preprocesamiento/conversion de entradas a spikes."
  - "La energia reportada es energia optica por spike y no consumo end-to-end del sistema."
  - "Benchmarks y humedad controlada no equivalen a validacion prolongada en campo."
contradicciones:
  - "La afirmacion de integracion sensor-computo es fuerte a nivel de dispositivo, pero no elimina completamente computacion digital externa para codificacion/readout en las demostraciones."
