tema_objeto: calculo analogico cerrado en memoria SRAM
afirmacion_principal: "HECHO: un circuito integrado CMOS de 90 nm con dos matrices SRAM 64x64 dentro de un lazo analogico ejecuta experimentalmente multiplicacion matriz-vector inversa y la usa como primitiva para inversion recursiva, filtro de Kalman e inversa cinematica. INTERPRETACION: el lazo fisico convierte una operacion digital tipicamente iterativa/cubica en una solucion analogica de equilibrio, desplazando parte del calculo hacia la dinamica del circuito."
capacidad_nueva: "resolver operaciones inversas de algebra lineal directamente en memoria mediante realimentacion analogica integrada"
mecanismo_o_principio: "conductancias programadas representan la matriz; amplificadores operacionales cierran un lazo cuya condicion de equilibrio implementa la solucion inversa, con DAC/ADC integrados para interfaz"
dominio: "computacion analogica; in-memory computing; algebra lineal; control"
