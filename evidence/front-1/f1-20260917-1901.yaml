condiciones_de_prueba: caracterizacion de transportadores de gel; reglas de plasticidad; procesador de dos canales conectado a segmentos proximal y distal de nervio ciatico transectado de rata
requiere_computacion_digital: no
requiere_alimentacion: parcial
tipo_de_sensado: potenciales electricos/ionicos; en demostracion biohibrida, potencial neural endogeno
tipo_de_memoria_o_estado: memoria ionica temporal de corto y largo plazo por acumulacion/disipacion interfacial
tipo_de_adaptacion: potenciacion/depresion; plasticidad dependiente de intensidad y timing; reglas Hebbian, anti-Hebbian y BCM demostradas
tipo_de_actuacion: reconfiguracion de transmision ionica; modulacion de actividad neural downstream en demostracion in vivo
madurez_tecnica: demostracion experimental de laboratorio peer-reviewed, incluyendo interfaz biohibrida in vivo
limitaciones: no demuestra integracion a gran escala; 0.61 pJ es minimo reportado por spike y no consumo end-to-end de un sistema completo; experimento neural fue en rata y no establece durabilidad cronica
contradicciones: la ausencia de fuente externa aplica a la demostracion biohibrida impulsada por potencial neural; no debe generalizarse a toda caracterizacion del dispositivo
