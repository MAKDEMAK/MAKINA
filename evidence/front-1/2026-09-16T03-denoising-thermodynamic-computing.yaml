id: f1-20260916T03-denoising-thermodynamic-computing
frente: front-1
cycle_id: 2026-09-16T03
tema_objeto: computacion probabilistica termodinamica CMOS para modelos generativos
afirmacion_principal: "HECHO: un generador aleatorio experimental solo-transistores explota ruido de disparo en subumbral y fue combinado, a nivel de arquitectura/simulacion, con modelos termodinamicos de denoising que encadenan distribuciones condicionales mas simples. HIPOTESIS/PROYECCION: el sistema completo podria aproximar rendimiento GPU en un benchmark simple con ~10^4 menos energia; no existe aun un chip DTCA completo medido."
capacidad_nueva: muestreo probabilistico fisico CMOS de muy baja energia y arquitectura generativa que evita parcialmente el compromiso mezcla-expresividad de EBMs monoliticos
mecanismo_o_principio: ruido de disparo subumbral para RNG sigmoidal + Gibbs sampling local + cadena de modelos de energia condicionales de denoising
dominio: computacion probabilistica / hardware generativo / analog-digital co-design
fuentes:
  - url: https://www.nature.com/articles/s44335-026-00075-3
    titulo: An efficient probabilistic hardware architecture for diffusion-like models
    tipo: paper revisado por pares / npj Unconventional Computing
    fecha: 2026-07-02
