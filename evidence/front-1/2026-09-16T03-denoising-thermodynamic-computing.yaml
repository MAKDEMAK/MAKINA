    titulo: An efficient probabilistic hardware architecture for diffusion-like models
    tipo: preprint del trabajo primario
    fecha: 2025-10-28
nivel_evidencia: B
datos_cuantitativos: "RNG experimental: decorrelacion ~100 ns, ~350 aJ/bit, area reportada ~3x3 um. Mayor DTM simulado ~50,000 nodos. Ventaja energetica sistema ~10,000x frente a GPU es estimacion de sistema, no medicion de chip completo."
condiciones_de_prueba: "Circuito RNG medido experimentalmente; modelos DTM evaluados mediante simulacion de hardware termodinamico en computador convencional; benchmark generativo simple."
requiere_computacion_digital: opcional
requiere_alimentacion: si
tipo_de_sensado: no aplica
tipo_de_memoria_o_estado: variables binarias estocasticas y pesos del modelo
tipo_de_adaptacion: entrenamiento del DTM fuera del circuito de muestreo; inferencia por dinamica Gibbs
tipo_de_actuacion: conmutacion estocastica de transistores / estados binarios
madurez_tecnica: circuito elemental medido + arquitectura completa simulada
limitaciones: "No existe demostracion fisica a escala del computador completo; autores declaran que el sistema esta lejos del estado del arte en potencia de modelado; efectos de circuitos reales, interconexion, cuantizacion y escalado aun requieren ingenieria."
contradicciones: "La cifra ~10^4 de energia es analisis/proyeccion y no debe tratarse como benchmark de silicio; el propio paper indica que las pruebas de modelos se ejecutaron en simulacion y que el sistema propuesto esta lejos del estado del arte en capacidad generativa."
