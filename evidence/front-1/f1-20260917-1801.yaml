  radio_demostrado_mm: "80 -> 40"
  fuerza_objetivo_contraccion_N: ">=10"
  cargas_robot_kg: "0-25"
  masas_rueda_validadas_kg: "1.8, 2.3, 2.8"
  resortes_torsionales: 12
  rigidez_resorte_Nmm_deg: 2.14
condiciones_de_prueba: "Modelo analitico, banco de medicion y robot movil bajo cargas, pendientes y terreno no estructurado."
requiere_computacion_digital: no
requiere_alimentacion: parcial
tipo_de_sensado: "mecanico intrinseco de torque/resistencia mediante equilibrio de fuerzas"
tipo_de_memoria_o_estado: "estado geometrico y elastico; sin memoria persistente demostrada"
tipo_de_adaptacion: "conmutacion pasiva por umbrales mecanicos entre transmision directa, reconfiguracion y stall"
tipo_de_actuacion: "reconfiguracion mecanica impulsada por el mismo torque de entrada"
madurez_tecnica: "prototipo experimental integrado en robot; preprint"
limitaciones:
  - "La logica demostrada es pequena y predeterminada; no aprende ni cambia autonomamente sus umbrales."
  - "La estructura no crea energia: usa la potencia mecanica de entrada, por eso requiere_alimentacion se marca parcial."
  - "No hay validacion de vida util extensa, manufactura a escala o rango amplio de velocidades."
contradicciones:
  - "Los autores lo describen como inteligencia/decision mecanica; funcionalmente implementa logica umbral determinista, no inferencia general."
  - "Existen CVT pasivos previos; la novedad reclamada es combinar bidireccionalidad continua, mayor capacidad de carga y comportamiento determinista en una rueda, no inventar la transmision pasiva."
