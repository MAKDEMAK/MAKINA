tema_objeto: logica_mecanica_pasiva_por_geometria_y_compliance
afirmacion_principal:
  hecho: "Una estructura mecanicamente programada puede sensar torque y ejecutar una decision umbral para reconfigurar su estado sin sensores, actuadores auxiliares, electronica ni control digital."
  hipotesis: "El principio de codificar condiciones y transiciones en geometria, cinematica y rigidez puede constituir una clase general de control fisico pasivo; el trabajo solo valida directamente una arquitectura."
  interpretacion: "La capacidad emergente es desplazar sensado, decision y adaptacion desde un controlador hacia la propia ruta de fuerzas del mecanismo."
capacidad_nueva: "Adaptacion determinista bidireccional condicionada por carga, con sensado y logica realizados por fuerzas y geometria."
mecanismo_o_principio: "Un acoplador slider-crank evalua mecanicamente umbrales de fuerza/torque; struts con resortes torsionales codifican el segundo umbral y cambian la geometria cuando se supera."
dominio: inteligencia_fisica_mecanica
fuentes:
  - url: https://arxiv.org/abs/2602.06265
    titulo: "MORPH Wheel: A Passive Variable-Radius Wheel Embedding Mechanical Behavior Logic for Input-Responsive Transformation"
    tipo: preprint_original_con_validacion_experimental
    fecha: 2026-02-05
nivel_evidencia: B
