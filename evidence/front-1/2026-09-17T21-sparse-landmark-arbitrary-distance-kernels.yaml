madurez_tecnica: "preprint con garantías teóricas y experimentos numéricos; sin revisión por pares confirmada"
limitaciones:
  - "La dimensión ambiente del embedding crece con el número de datos de entrenamiento |D|, aunque el soporte compacto induce dispersidad."
  - "La afirmación de tractabilidad depende de esa dispersidad; no implica coste constante al escalar D."
  - "No hay todavía validación independiente ni revisión por pares confirmada."
contradicciones:
  - "No elimina el coste de elegir/calcular una distancia de dominio; elimina la exigencia CND para obtener un kernel PSD válido."
  - "'Arbitrary distance measures' es una garantía de construcción PSD, no garantía de mejor precisión para cualquier métrica."
