core:
  title: MAKINA
  status: active
  description: "Ecosistema experimental para trasladar sensado, estado, memoria, adaptacion y computacion hacia la capa fisica cuando la evidencia lo justifique."

active_modules:
  - id: physical-state-interface
    maturity: M3
    confidence: 0.91
    evidence_ids:
      - f1-20260915-2101
      - f1-20260915-2103
      - f3-20260915-21-passive-crack
      - f3-20260915-21-passive-rf-temp
      - f3-20260915-22-wiegand-counter
      - f1-20260915-22-light-programmable-mechanical-logic
      - f1-20260916-02-lc-photonic-memory
      - f3-20260916-02-hygromechanical-indicator
      - f3-20260916-03-adhesive-tape-latching-memory
      - f3-20260916T04-passive-tti
    success_criterion: "Una entrada fisica debe producir un estado reproducible y verificable —discreto o material persistente— con umbral/rango documentado, persistencia medible y tasa de falsos cambios cuantificable; para memorias de historia debe medirse resolucion, destructividad de lectura y ambiguedad entre trayectorias de entrada que producen el mismo estado final."
    next_action: "Ejecutar tests existentes de physical_state/event_state; despues incorporar una curva experimental real de transduccion o memoria material y medir falsos cambios, margen, persistencia, resolucion, reversibilidad, destructividad de lectura y degeneracion de historia-a-estado."

  - id: embodied-dynamics-computation
    maturity: M1
    confidence: 0.87
    evidence_ids:
      - f1-20260915-22-wave-metamaterial-robot
      - f1-20260915-22-light-programmable-mechanical-logic
      - f1-20260916T00-mycelium-reservoir
      - f1-20260916T00-active-colloid-reservoir
      - f1-20260916-02-flare
      - f1-20260916-02-magnetic-self-learning
      - f1-20260916t03-zro2-aftj
      - f1-20260916t03-learning-shape-metamaterial
      - f1-20260916T04-pneumatic-soft-robot-prc
      - f1-20260916T04-hydrogel-fluidic-memristor
      - f1-20260916T04-ti3c2tx-homogeneous-rc
    success_criterion: "Definir una tarea computacional comun y medible que pueda ejecutarse sobre al menos dos clases de sustrato fisico y compararse con una referencia digital usando la misma metrica; separar inferencia, memoria, aprendizaje, reset/relajacion y coste de perifericos en la comparacion."
    next_action: "No promover aun. La ronda 04 refuerza fuertemente reservoir computing en sustratos mecanico-neumatico, ionico y MXene, pero sus benchmarks siguen heterogeneos. Especificar un benchmark temporal minimo comun con entrada, readout, metrica de error, memoria requerida, energia del sistema completo y coste de reset antes de M2."

waiting_modules:
  - id: temporal-in-sensor-processing
    evidence_ids: [f1-20260915-2102, f3-20260915-21-event-vision, f3-20260916T04-event-vibration]
    reason: "La nueva medicion cuantifica que event vision puede recuperar frecuencia 10-190 Hz con error medio 0.673%, pero tambien muestra dependencia fuerte de amplitud/contraste; sigue sin evidencia directa de integracion con reservorio fisico y requiere hardware especializado."
  - id: legacy-noninvasive-observability
    evidence_ids: [f3-20260915-22-stray-flux, f3-20260915-22-laser-speckle, f3-2026-09-16T00-clamp-on-ultrasonic-flow, f3-20260916-02-motor-stray-flux-state]
    reason: "La evidencia magnetica refuerza inferencia externa de estado de motor, pero sigue validada en montaje/motor especifico; junto a speckle y ultrasonido las modalidades siguen heterogeneas y no justifican modulo activo sin variable objetivo comun y presupuesto de incertidumbre."

archived_modules:
  - id: air-cushion-transport
    evidence_ids: [f2-20260915-21-aerotrain]
    reason: "Hallazgo valido pero sin convergencia funcional suficiente con el nucleo actual."
  - id: networked-management-precedents
    evidence_ids: [f2-20260915T22-cybersyn, f2-20260915T22-minitel]
    reason: "Precedentes historicos relevantes de redes y coordinacion, pero sin traduccion funcional directa al nucleo fisico actual."
  - id: synchronized-facsimile-path
    evidence_ids: [f2-2026-09-16T00-caselli-pantelegraph]
    reason: "Camino historico valido de barrido y sincronizacion, pero no aporta traduccion funcional suficiente al nucleo actual."
  - id: differential-computing-precedents
    evidence_ids: [f2-2026-09-16T00-nordsieck-differential-analyzer, f2-2026-09-16T00-maddida-dda]
    reason: "La continuidad integrador mecanico -> DDA digital es tecnicamente fuerte como precedente, pero no demuestra que el nucleo actual deba adoptar integracion diferencial especializada."
  - id: magnetic-mobile-state-precedent
    evidence_ids: [f2-20260915T22-magnetic-bubble-memory, f2-2026-09-16T02-magnetic-bubble-memory]
    reason: "La ronda 02 aporta mejor documentacion historica de bubble memory pero no una linea funcional nueva; se deduplica como precedente de estado magnetico fisico y sustitucion tecnologica."
  - id: parametric-phase-logic-precedent
    evidence_ids: [f2-2026-09-16T03-parametron]
    reason: "Precedente historico fuerte de logica/memoria por fase estable de oscilacion parametrica, pero no hay continuidad funcional suficiente con el nucleo para abrir modulo; queda archivado sin forzar analogia con fotonica o reservorios."
  - id: saturable-magnetic-logic-precedent
    evidence_ids: [f2-2026-09-16T04-magnetic-amplifier-computing]
    reason: "Demuestra logica real mediante saturacion magnetica y una sustitucion decidida por trayectoria tecnologica, pero no existe traduccion funcional suficientemente especifica al nucleo actual para abrir modulo."
  - id: mechanical-video-density-precedent
    evidence_ids: [f2-2026-09-16T04-ted-mechanical-videodisc]
    reason: "Demuestra transduccion mecanico-electrica de video de alta densidad, pero sus restricciones de soporte y duracion no convergen funcionalmente con los modulos activos."

current_architecture: "physical variable/event -> transduction or direct material response -> threshold/continuous state formation -> persistent or fading physical state -> optional physical dynamics/logic/learning -> observable output/action; characterize persistence, relaxation/reset, read destructivity, history-to-state ambiguity and peripheral cost explicitly"
last_synthesized_cycle: 2026-09-16T04

rules:
  max_active_modules: 3
  promotion:
    M0: signal
    M1: supported_convergence
    M2: functional_specification
    M3: real_minimum_prototype
    M4: test_or_measurement
    M5: demonstrable_system
  death_criteria:
    - insufficient_evidence
    - aesthetic_or_verbal_only_relation
    - no_functional_translation
    - not_measurable
    - impractical_to_prototype
    - redundant
    - disproportionate_cost
    - contradicted_by_new_evidence
    - stagnant_without_path_to_M2_M3
