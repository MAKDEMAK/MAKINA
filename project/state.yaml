archived_modules:
  - id: air-cushion-transport
    evidence_ids: [f2-20260915-21-aerotrain]
    reason: "Hallazgo valido pero sin convergencia funcional suficiente con el nucleo actual."
  - id: networked-management-precedents
    evidence_ids: [f2-20260915T22-cybersyn, f2-20260915T22-minitel]
    reason: "Precedentes historicos relevantes de redes y coordinacion, pero sin traduccion funcional directa al nucleo fisico actual."
  - id: synchronized-facsimile-path
    evidence_ids: [f2-2026-09-16T00-caselli-pantelegraph]
    reason: "Camino historico valido de barrido y sincronizacion, pero no aporta traduccion funcional suficiente al nucleo actual."
  - id: differential-computing-precedents
    evidence_ids: [f2-2026-09-16T00-nordsieck-differential-analyzer, f2-2026-09-16T00-maddida-dda, f2-20260916-1001]
    reason: "Lukyanov refuerza que ecuaciones diferenciales se mapearon operacionalmente a dinamica fisica durante decadas; junto con Nordsieck/MADDIDA forma un precedente fuerte de computacion especializada, pero no demuestra que el nucleo actual deba adoptar integracion diferencial fisica."
  - id: magnetic-mobile-state-precedent
    evidence_ids: [f2-20260915T22-magnetic-bubble-memory, f2-2026-09-16T02-magnetic-bubble-memory]
    reason: "Precedente de estado magnetico fisico y sustitucion tecnologica; evidencia posterior deduplicada."
  - id: parametric-phase-logic-precedent
    evidence_ids: [f2-2026-09-16T03-parametron]
    reason: "Precedente historico fuerte de logica/memoria por fase estable, sin continuidad funcional suficiente con el nucleo."
  - id: saturable-magnetic-logic-precedent
    evidence_ids: [f2-2026-09-16T04-magnetic-amplifier-computing]
    reason: "Logica real mediante saturacion magnetica, pero sin traduccion funcional suficientemente especifica al nucleo actual."
  - id: mechanical-video-density-precedent
    evidence_ids: [f2-2026-09-16T04-ted-mechanical-videodisc]
    reason: "Transduccion mecanico-electrica de video de alta densidad sin convergencia funcional con los modulos activos."
  - id: integrated-office-automation-precedent
    evidence_ids: [f2-2026-09-16T06-hofgaard-office-machine]
    reason: "Prototipo historico valido de integracion mecanica-electromecanica, sin traduccion funcional medible al nucleo fisico actual."
  - id: cartridge-decoupled-precision-transport
    evidence_ids: [f2-2026-09-16T07-elcaset]
    reason: "Elcaset demuestra separar almacenamiento/proteccion del medio y guiado de precision en la maquina, pero no converge de forma medible con los modulos activos."
  - id: subharmonic-synthesis-precedent
    evidence_ids: [f2-20260916-0801]
    reason: "Subharchord demuestra generacion por divisiones subarmonicas discretas y conformacion analogica, sin traduccion funcional medible al nucleo actual."
  - id: dynamic-track-following-precedent
    evidence_ids: [f2-20260915-21-video2000, f2-20260916-0901]
    reason: "Video 2000/DTF queda deduplicado como precedente de feedback medio-transductor, sin promover modulo."

current_architecture: "physical variable/event -> transduction or direct material response -> threshold/continuous accumulation or remotely addressed transition -> persistent or fading physical state -> optional physical dynamics/logic/learning -> local or remotely interrogated observable output/action; characterize persistence, relaxation/reset, read destructivity, history-to-state ambiguity, write selectivity, environmental sensitivity and peripheral cost explicitly"
last_synthesized_cycle: 2026-09-16T10

rules:
  max_active_modules: 3
  promotion:
    M0: signal
    M1: supported_convergence
    M2: functional_specification
    M3: real_minimum_prototype
    M4: test_or_measurement
    M5: demonstrable_system
  death_criteria:
    - insufficient_evidence
    - aesthetic_or_verbal_only_relation
    - no_functional_translation
    - not_measurable
    - impractical_to_prototype
    - redundant
    - disproportionate_cost
    - contradicted_by_new_evidence
    - stagnant_without_path_to_M2_M3
