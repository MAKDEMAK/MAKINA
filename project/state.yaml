    next_action: "Mantener M3. Sustituir en CumulativeHistoryMemory la ley de tasa ilustrativa por una curva experimental publicada o medida; para PeakThresholdMemory sustituir un umbral ideal por curva experimental. La nueva escritura mecanica desde frontera no se simula aun: faltan tasa de error, energia y funcion de transferencia suficientes para un modelo calibrado."

