    next_action: "No promover. F1-20 refuerza computacion mecanica reprogramable pero no aporta benchmark comun ni metricas suficientes; especificar benchmark comun antes de M2."

  - id: temporal-in-sensor-processing
    maturity: M3
    confidence: 0.90
    evidence_ids: [f1-20260915-2102, f3-20260915-21-event-vision, f3-20260916T04-event-vibration, f1-20260916-0901, f3-20260916-1401, f1-20260916-1501]
    current_architecture: "synthetic temporal signal -> uniform reference | threshold-event encoder | latency+fading-state encoder -> common event task -> transfer/error/score metrics"
    success_criterion: "Sobre una misma señal y tarea, la cadena fisica/analogica debe conservar >=95% del score de referencia digital o mejorarlo y reducir >=10x el volumen transferido; reportar energia local y periferica por separado."
    next_action: "Ejecutar src/temporal_benchmark.py y tests/test_temporal_benchmark.py en entorno reproducible y persistir resultados antes de M4."

