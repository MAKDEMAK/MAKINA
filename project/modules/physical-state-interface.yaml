id: physical-state-interface
title: Physical State Interface
maturity: M3
confidence: 0.78
classification: INFERENCIA_DE_DISENO
purpose: >-
  Arquitectura para traducir variables fisicas continuas a estados discretos persistentes y operar sobre esos estados con la menor separacion posible entre sensado, memoria y computacion.
evidence_ids:
  - f1-20260915-2101
  - f1-20260915-2103
  - f3-20260915-21-passive-crack
  - f3-20260915-21-passive-rf-temp
support:
  - "F3 demuestra transduccion pasiva de grieta y temperatura a señales RF interrogables."
  - "F1 demuestra discretizacion mecanica multestable y memoria/logica secuencial fisica."
alternative_checked:
  id: f1-20260915-2102
  reason_not_primary: "Integra sensado y computacion con mejor densidad funcional, pero requiere dispositivo semiconductor especializado y no prueba la ruta de minima electronica del nucleo."
success_criterion: >-
  Dada una señal fisica normalizada, producir estados discretos reproducibles con histeresis controlada y ejecutar transiciones de estado deterministas; superar tests de umbral, ruido y memoria sin transiciones espurias fuera de tolerancia.
prototype:
  implementation: src/physical_state.py
  tests: tests/test_physical_state.py
  status: executed_digital_surrogate
  scope: "sustituto digital del contrato transduccion -> cuantizacion multestable -> FSM; no representa integracion fisica demostrada"
validation:
  pytest: "14/14 tests de physical_state + event_state pasaron"
  scope: "validacion del sustituto digital; no medicion de hardware"
next_action: "Mantener M3. Parametrizar con curva experimental real y medir un mecanismo fisico antes de M4."
limitations:
  - "No existe aun evidencia de integracion fisica entre los sensores F3 y los mecanismos F1."
  - "La arquitectura es una inferencia de diseño; no una causalidad demostrada."
